<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid dots pattern -->
  <g opacity="0.08">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="white"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>
  <!-- Accent bar -->
  <rect x="80" y="200" width="6" height="80" rx="3" fill="url(#accent)"/>
  <!-- Title -->
  <text x="110" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white">toon-memory</text>
  <!-- Subtitle -->
  <text x="110" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a5b4fc">MCP Memory Server for AI Coding Agents</text>
  <!-- Description -->
  <text x="110" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">Persistent memory for Claude, Cursor, OpenCode &amp; 15+ agents</text>
  <!-- Stats badges -->
  <rect x="110" y="410" width="160" height="44" rx="22" fill="#1e1e3a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="190" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle">20 MCP Tools</text>
  <rect x="290" y="410" width="180" height="44" rx="22" fill="#1e1e3a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle">15+ Agents</text>
  <rect x="490" y="410" width="200" height="44" rx="22" fill="#1e1e3a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="590" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle">80% Fewer Calls</text>
  <rect x="710" y="410" width="200" height="44" rx="22" fill="#1e1e3a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="810" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle">22% Fewer Tokens</text>
  <!-- Bottom URL -->
  <text x="110" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569">luiggival08.github.io/toon-memory</text>
  <!-- Logo placeholder circle -->
  <circle cx="1050" cy="250" r="80" fill="#6366f1" opacity="0.15"/>
  <text x="1050" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="48" fill="#818cf8" text-anchor="middle" font-weight="700">TM</text>
</svg>