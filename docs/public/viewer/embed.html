<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toon-memory viewer (live data)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--border:#2a2a3a;--text:#e2e2ee;--muted:#8888a0;--brand:#a78bfa;--brand2:#c084fc;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b;--pink:#ec4899;--cyan:#06b6d4}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:grid;grid-template-rows:1fr;height:100vh}
.main{display:grid;grid-template-columns:var(--sidebar-w,320px) 1fr;overflow:hidden;position:relative}
.sidebar{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.sidebar-header{padding:0.75rem 1rem;border-bottom:1px solid var(--border);background:var(--bg2)}
.sidebar-header h2{font-size:0.85rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:0.5rem}
.search-box{width:100%;padding:0.5rem 0.75rem;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);font-size:0.85rem;outline:none}
.search-box:focus{border-color:var(--brand)}
.filter-row{display:flex;gap:0.4rem;margin-top:0.5rem;flex-wrap:wrap}
.filter-btn{padding:0.2rem 0.5rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);font-size:0.7rem;cursor:pointer;transition:all 0.15s}
.filter-btn:hover,.filter-btn.active{border-color:var(--brand);color:var(--brand);background:rgba(167,139,250,0.1)}
.entries-list{flex:1;overflow-y:auto;padding:0.5rem}
.entry-item{padding:0.6rem 0.75rem;border:1px solid var(--border);border-radius:8px;margin-bottom:0.4rem;cursor:pointer;transition:all 0.15s}
.entry-item:hover{border-color:var(--brand);background:rgba(167,139,250,0.05)}
.entry-item.selected{border-color:var(--brand);background:rgba(167,139,250,0.1)}
.entry-cat{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.2rem}
.entry-cat.decision{color:var(--brand)}.entry-cat.bug{color:var(--red)}.entry-cat.pattern{color:var(--green)}.entry-cat.knowledge{color:var(--cyan)}.entry-cat.architecture{color:var(--amber)}
.entry-key{font-size:0.85rem;font-weight:600;margin-bottom:0.15rem}
.entry-preview{font-size:0.75rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-tags{display:flex;gap:0.25rem;margin-top:0.3rem;flex-wrap:wrap}
.entry-tag{font-size:0.6rem;padding:0.1em 0.35rem;border-radius:3px;background:var(--bg3);color:var(--muted);font-family:monospace}
.viewer-area{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 1rem}
.tab{padding:0.6rem 1rem;font-size:0.8rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s}
.tab:hover{color:var(--text)}.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab-content{flex:1;overflow:hidden;position:relative}
.tab-panel{display:none;width:100%;height:100%;overflow:auto}
.tab-panel.active{display:block}
.graph-container{width:100%;height:100%;background:var(--bg);position:relative}
.graph-container::before{content:'';position:absolute;inset:0;background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:24px 24px;opacity:0.3;pointer-events:none;z-index:0}
.graph-container svg{width:100%;height:100%;position:relative;z-index:1}
.node-circle{cursor:pointer;transition:r 0.2s ease,opacity 0.2s ease,filter 0.2s ease,stroke 0.2s ease}
.node-circle:hover{filter:brightness(1.3) drop-shadow(0 0 6px color-mix(in srgb,currentColor 60%,transparent))}
.node-circle.glow{filter:drop-shadow(0 0 12px var(--brand)) brightness(1.5)}
.node-circle.selected{stroke:var(--brand);stroke-width:3;filter:drop-shadow(0 0 14px var(--brand)) brightness(1.3)}
.node-label{font-size:9px;font-family:monospace;fill:var(--text);pointer-events:none;text-anchor:middle;transition:opacity 0.2s ease;font-weight:500;letter-spacing:0.02em}
.link{stroke:var(--border);stroke-opacity:0.4;transition:all 0.2s ease;cursor:pointer}
.link:hover{stroke-opacity:0.9;stroke-width:3}.link.highlighted{stroke:var(--brand);stroke-opacity:0.9;stroke-width:2.5}.link.faded{stroke-opacity:0.04}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;padding:1.5rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem}
.stat-card h3{font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:0.75rem}
.stat-big{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bar-chart{display:flex;flex-direction:column;gap:0.4rem}.bar-row{display:flex;align-items:center;gap:0.5rem}
.bar-label{font-size:0.75rem;color:var(--muted);width:80px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:20px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.6s cubic-bezier(0.16,1,0.3,1)}
.bar-value{font-size:0.7rem;color:var(--muted);width:30px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:0.4rem}
.tag-pill{padding:0.25rem 0.6rem;border-radius:6px;font-size:0.75rem;font-family:monospace;border:1px solid var(--border);color:var(--muted);transition:all 0.15s}
.detail-panel{padding:1.5rem;max-width:700px}
.detail-panel h2{font-size:1.2rem;font-weight:700;margin-bottom:0.5rem}
.detail-panel .detail-cat{font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:1rem}
.detail-field{margin-bottom:1rem}
.detail-field label{display:block;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.3rem}
.detail-field .value{font-size:0.9rem;line-height:1.6}
.detail-field .value.mono{font-family:monospace;background:var(--bg3);padding:0.5rem;border-radius:6px;display:block;overflow-x:auto;white-space:pre-wrap}
.detail-links{display:flex;gap:0.4rem;flex-wrap:wrap}
.detail-link{padding:0.2rem 0.5rem;border:1px solid var(--border);border-radius:6px;font-size:0.75rem;font-family:monospace;color:var(--brand);cursor:pointer;transition:all 0.15s}
.detail-link:hover{border-color:var(--brand);background:rgba(167,139,250,0.1)}
.empty-detail{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:0.9rem}
.graph-legend{position:absolute;bottom:3.5rem;left:0.5rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.75rem;font-size:0.7rem;z-index:10}
.legend-item{display:flex;align-items:center;gap:0.4rem;margin-bottom:0.25rem}.legend-dot{width:10px;height:10px;border-radius:50%}
.graph-controls{position:absolute;top:1rem;right:1rem;display:flex;gap:0.4rem;z-index:10}
.graph-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all 0.15s}
.graph-btn:hover{border-color:var(--brand);color:var(--brand)}
.tooltip{position:fixed;pointer-events:none;background:rgba(18,18,26,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:0.75rem 1rem;font-size:0.75rem;max-width:320px;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.tooltip .tt-cat{font-size:0.6rem;font-weight:600;text-transform:uppercase;margin-bottom:0.2rem}
.tooltip .tt-key{font-weight:600;margin-bottom:0.2rem}
.tooltip .tt-content{color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tooltip .tt-score{margin-top:0.3rem;font-size:0.65rem;color:var(--brand)}
.tooltip .tt-edge{font-size:0.65rem;color:var(--muted);margin-top:0.3rem;padding-top:0.3rem;border-top:1px solid var(--border)}
.timeline-container{padding:1.5rem;overflow-y:auto;height:100%}
.timeline-header{font-size:1rem;font-weight:700;margin-bottom:1rem}
.timeline-track{position:relative;padding-left:2rem}
.timeline-line{position:absolute;left:0.5rem;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-entry{position:relative;margin-bottom:1rem;padding:0.6rem 0.8rem;border:1px solid var(--border);border-radius:8px;background:var(--bg2);cursor:pointer;transition:all 0.15s}
.timeline-entry:hover{border-color:var(--brand)}
.timeline-entry::before{content:'';position:absolute;left:-1.75rem;top:0.8rem;width:10px;height:10px;border-radius:50%;border:2px solid var(--border);background:var(--bg)}
.timeline-entry .tl-date{font-size:0.65rem;color:var(--muted);margin-bottom:0.2rem}
.timeline-entry .tl-cat{font-size:0.6rem;font-weight:600;text-transform:uppercase}
.timeline-entry .tl-key{font-size:0.85rem;font-weight:600}
.timeline-entry .tl-content{font-size:0.75rem;color:var(--muted);margin-top:0.2rem}



.physics-panel{position:absolute;top:2.8rem;left:0.5rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.75rem;font-size:0.7rem;z-index:10;min-width:180px}
.physics-panel h4{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:0.5rem}
.graph-toolbar{position:absolute;top:1rem;left:0.5rem;display:flex;gap:0.4rem;z-index:11}
.physics-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem}
.physics-row label{font-size:0.65rem;color:var(--muted);width:60px;flex-shrink:0}
.physics-row input[type="range"]{flex:1;height:4px;-webkit-appearance:none;background:var(--bg3);border-radius:2px;outline:none}
.physics-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--brand);cursor:pointer}
.physics-row .physics-val{font-size:0.6rem;color:var(--muted);width:30px;text-align:right}
.node-circle.search-match{filter:drop-shadow(0 0 10px var(--brand)) brightness(1.4);animation:searchPulse 1.5s ease-in-out infinite}
@keyframes searchPulse{0%,100%{filter:drop-shadow(0 0 8px var(--brand)) brightness(1.2)}50%{filter:drop-shadow(0 0 18px var(--brand)) brightness(1.7)}}
.path-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.path-info{position:absolute;bottom:0.5rem;left:0.5rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.7rem;font-size:0.7rem;z-index:10;display:none;max-width:500px;word-break:break-all}
.node-circle.path-start{stroke:var(--green);stroke-width:3;filter:drop-shadow(0 0 12px var(--green))}
.node-circle.path-end{stroke:var(--red);stroke-width:3;filter:drop-shadow(0 0 12px var(--red))}
.node-circle.path-node{stroke:var(--brand);stroke-width:2.5;animation:pathNodePulse 1.2s ease-in-out infinite}
@keyframes pathNodePulse{0%,100%{filter:drop-shadow(0 0 6px var(--brand))}50%{filter:drop-shadow(0 0 14px var(--brand))}}
.link.path-edge{stroke:var(--brand);stroke-opacity:0.9;stroke-width:3}
.light{--bg:#f4f4f9;--bg2:#ffffff;--bg3:#e8e8f0;--border:#c8c8d8;--text:#1a1a2e;--muted:#666680;--brand:#7c3aed;--brand2:#9333ea}
.light .tooltip{background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:#c8c8d8;box-shadow:0 8px 32px rgba(0,0,0,0.1)}
.light .timeline-entry{background:#fff}.light .graph-btn{background:#fff}
@media(max-width:768px){.main{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Entries</h2>
        <input type="text" class="search-box" id="search" placeholder="Search entries... (/)">
        <div class="filter-row" id="filters"></div>
      </div>
      <div class="entries-list" id="entriesList"></div>
    </div>
    <div class="viewer-area">
      <div class="tabs">
        <div class="tab active" data-tab="graph">Graph</div>
        <div class="tab" data-tab="stats">Stats</div>
        <div class="tab" data-tab="timeline">Timeline</div>
        <div class="tab" data-tab="detail">Detail</div>
      </div>
      <div class="tab-content">
        <div class="tab-panel active" id="panel-graph">
          <div class="graph-container" id="graphContainer">
            <div class="graph-legend" id="legend"></div>
            <div class="graph-controls">
              <button class="graph-btn" id="zoomIn" title="Zoom in (+)">+</button>
              <button class="graph-btn" id="zoomOut" title="Zoom out (-)">−</button>
              <button class="graph-btn" id="zoomReset" title="Reset (0)">⟲</button>
            </div>
            <div class="graph-toolbar">
              <button class="graph-btn" id="physicsToggle" title="Physics controls">⚙</button>
              <button class="graph-btn path-btn" id="pathToggle" title="Find path between two nodes">⇿</button>
            </div>
            <div class="physics-panel" id="physicsPanel" style="display:none">
              <h4>Graph Physics</h4>
              <div class="physics-row"><label>Charge</label><input type="range" id="chargeSlider" min="-300" max="0" value="-120" step="10"><span class="physics-val" id="chargeVal">-120</span></div>
              <div class="physics-row"><label>Distance</label><input type="range" id="distSlider" min="20" max="200" value="70" step="5"><span class="physics-val" id="distVal">70</span></div>
              <div class="physics-row"><label>Center</label><input type="range" id="centerSlider" min="0" max="1" value="0.05" step="0.01"><span class="physics-val" id="centerVal">0.05</span></div>
            </div>
            <div class="path-info" id="pathInfo"></div>
          </div>
        </div>
        <div class="tab-panel" id="panel-stats">
          <div class="stats-grid" id="statsGrid"></div>
        </div>
        <div class="tab-panel" id="panel-timeline">
          <div class="timeline-container" id="timelineContainer"></div>
        </div>
        <div class="tab-panel" id="panel-detail">
          <div class="detail-panel" id="detailPanel">
            <div class="empty-detail">Select an entry from the sidebar or click a node in the graph</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip" style="display:none"></div>
<script>
const DATA = {"nodes":[{"id":"e4b00a8c","key":"viewer-live-observations-bridge","category":"knowledge","content":"Live mode watchea todo MEMORY_DIR (data.toon + observations.toon). Observations registran cada tool call del agente (recall, remember, stats, etc.). Al cambiar observations.toon, el server re-construye ViewerData y envía SSE aunque data.toon no haya cambiado. El badge LIVE parpadea en verde para mostrar actividad.","tags":["viewer","live","sse","observations","bridge"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/server.ts","links":["viewer-serve-mode","viewer-static-snapshot","observations-module","viewer-serve-mode","session-auto-promotion-details","viewer-html-generation"],"ttl":"","lastAccessed":""},{"id":"b2c3c0e1","key":"viewer-sidebar-graph-sync","category":"pattern","content":"Pattern: viewer connector between sidebar entry list and graph uses the selectEntry() function which sets selectedEntry global, re-renders entry list (adds .selected class), shows detail panel via showDetail(), highlights the node in the graph via graph.highlightNode(), switches to the Detail tab. Clicking on a graph node does the same via the node click handler.","tags":["pattern","viewer","selection","sync","sidebar-graph"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["sidebar-entry-list-pattern","viewer-data-flow","viewer-css-variable-pattern"],"ttl":"","lastAccessed":"2026-07-29T13:10:26.720Z"},{"id":"a4b1a64f","key":"viewer-data-flow","category":"architecture","content":"Architecture: viewer data flow starts in buildViewerData() which reads .toon memory, parses entries, builds the graph, and returns structured ViewerData (nodes, edges, categories, tagCounts, totalEntries). The data is serialized to JSON and injected into the HTML template. On the client side, DATA is parsed once and used by all panels: graph (D3 force layout), stats (category/tag charts), timeline (date groups), detail (entry metadata).","tags":["architecture","viewer","data-flow","json","serialization"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/data.ts","links":["viewer-html-generation","viewer-tabs-system","cli-setup-routing"],"ttl":"","lastAccessed":"2026-07-29T13:10:26.720Z"},{"id":"b0251ac4","key":"viewer-tooltip-design","category":"decision","content":"Decision: viewer uses pointer-events:none on tooltips to prevent them from intercepting mouse events. The tooltip is a fixed-position div that follows the cursor via mousemove listener. Position calculation flips the tooltip to the left if it would overflow the viewport. This approach is simpler than a CSS-only tooltip and allows rich HTML content (colored spans, tag chips).","tags":["decision","viewer","tooltip","ux","interaction"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["sidebar-resizer-layout-bug","viewer-css-variable-pattern","viewer-theme-toggle"],"ttl":"","lastAccessed":"2026-07-29T13:09:59.299Z"},{"id":"aa943197","key":"viewer-css-variable-pattern","category":"pattern","content":"Pattern: viewer uses CSS custom properties (--sidebar-w, --bg, --text, --brand, etc.) for all dynamic styling. This enables theme switching via .light class toggling CSS variable values, sidebar resize by updating --sidebar-w, consistent color usage across all components. The approach avoids JS-driven style changes and keeps all visual logic in CSS.","tags":["pattern","viewer","css-variables","theming","design"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-theme-toggle-pattern","sidebar-resizer-layout-bug","viewer-theme-toggle"],"ttl":"","lastAccessed":"2026-07-29T13:08:53.050Z"},{"id":"2d0a984e","key":"viewer-node-edge-sizing","category":"architecture","content":"Architecture: viewer node sizing uses a formula based on accessCount: radius = 4 + min(accessCount * 0.8, 8). This means nodes range from 4px (never accessed) to 12px (max). Edge thickness also varies: width = 0.5 + min(shared connections * 0.3, 3), where shared connections is the smaller of the two nodes' connection counts. Both formulas cap growth to prevent visual distortion.","tags":["architecture","viewer","sizing","radius","visualization"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-edge-thickness","graph-node-radius","graph-bfs-traversal"],"ttl":"","lastAccessed":"2026-07-29T13:07:40.627Z"},{"id":"5e8f5823","key":"viewer-zoom-controls","category":"knowledge","content":"Knowledge: viewer zoom controls implement D3 zoom behavior with scaleExtent [0.1, 4]. Three buttons: zoom in (1.5x), zoom out (0.67x), reset (identity). The zoom is applied to a g wrapper element, not the SVG itself, so UI overlay elements (controls, legend, minimap) stay fixed. reset uses d3.zoomIdentity for a clean transition back to the initial state.","tags":["knowledge","viewer","zoom","controls","d3"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","viewer-physics-controls","viewer-force-graph"],"ttl":"","lastAccessed":"2026-07-29T13:08:53.050Z"},{"id":"a1b11344","key":"viewer-highlight-system","category":"architecture","content":"Architecture: viewer node highlight system provides 3 interaction modes: node hover (mouseover shows tooltip + highlights neighbors), node click (selects entry + switches to detail tab), and search/filter mode (matches by id/content/tags + category filter). Highlight types: hover highlights neighbors with increased radius + opacity fade for non-neighbors, selected gets glow + brand stroke, search dims non-matches to 0.08 opacity.","tags":["architecture","viewer","highlight","selection","search"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-node-radius","graph-glow-effect","sidebar-entry-list-pattern"],"ttl":"","lastAccessed":"2026-07-29T13:07:40.627Z"},{"id":"a0f3fe61","key":"viewer-detail-panel","category":"architecture","content":"Architecture: viewer detail panel shows full entry metadata: category badge (colored), key/title, content (monospace block), file link (if any), date, quality score (brand colored, bold), access count, TTL (if set), last accessed date, tags as chips, and linked entries as clickable pills. Clicking a linked entry navigates to that entry via selectEntryById() which is exposed as a global function.","tags":["architecture","viewer","detail","metadata","links"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["toon-file-format-details","viewer-timeline-panel","sidebar-entry-list-pattern"],"ttl":"","lastAccessed":"2026-07-29T13:08:14.062Z"},{"id":"a4677a7e","key":"viewer-timeline-panel","category":"architecture","content":"Architecture: viewer timeline panel groups entries by date in reverse chronological order. Each timeline entry shows date, category badge (colored left border), key, and content preview (100 chars). Clicking navigates to the entry's detail. A vertical line (timeline-line) connects entries visually. Entries without dates are grouped under 'unknown'. Timeline-header shows total count.","tags":["architecture","viewer","timeline","chronological"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["sidebar-entry-list-pattern","viewer-stats-panel","toon-file-format-details"],"ttl":"","lastAccessed":"2026-07-29T13:08:14.062Z"},{"id":"ccc756ea","key":"viewer-stats-panel","category":"architecture","content":"Architecture: viewer topic rendering - the stats panel shows bar charts for category distribution and a tag cloud for top 20 tags. Category bars use the COLORS map for fill colors and animate width via CSS transition (0.6s cubic-bezier). Tag cloud pills show count in parentheses. Stats also show total entries, edge count, average quality, and max access count in big stat cards.","tags":["architecture","viewer","stats","charts","visualization"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-html-generation","sidebar-entry-list-pattern","cli-setup-routing"],"ttl":"","lastAccessed":"2026-07-29T13:08:14.062Z"},{"id":"9680002b","key":"viewer-physics-controls","category":"decision","content":"Decision: viewer physics sliders use HTML range inputs with live updates. Three controls: Charge (-300 to 0, default -120), Link Distance (20 to 200, default 70), Center Strength (0 to 1, default 0.05). Changes update the simulation forces and restart with alpha 0.5. Panel toggled via button. This lets users fine-tune the layout without needing to understand D3 force parameters.","tags":["decision","viewer","physics","ux","interaction"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-physics-controls","viewer-force-graph","graph-force-layout"],"ttl":"","lastAccessed":"2026-07-29T13:27:24.420Z"},{"id":"08e022b3","key":"viewer-tabs-system","category":"knowledge","content":"Knowledge: viewer tabs system - 4 tabs (Graph, Stats, Timeline, Detail). Tabs use data-tab attributes to match with panel IDs (#panel-graph, #panel-stats, etc.). Only the active tab-panel is visible (display:block). Switching tabs triggers graph.resize() if switching to the graph tab (to recalculate layout after the panel becomes visible and has dimensions). switchTab() helper function handles tab switching.","tags":["knowledge","viewer","tabs","panel","navigation"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-keyboard-shortcuts","viewer-html-generation","viewer-standalone"],"ttl":"","lastAccessed":"2026-07-29T13:10:26.720Z"},{"id":"9206d469","key":"viewer-theme-toggle-pattern","category":"pattern","content":"Pattern: theme toggle stores preference in localStorage (key: 'toon-viewer-theme'). Dark theme uses dark background with brand purple. Light theme swaps to light background. Toggle button cycles icons. CSS variables handle all color references, so a single .light class toggle updates the entire page. Tooltips get adjusted backdrop-filter in light mode.","tags":["pattern","viewer","theme","dark","light","localstorage"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-theme-toggle","d3-graph-viewer","viewer-standalone"],"ttl":"","lastAccessed":"2026-07-29T13:08:53.050Z"},{"id":"661f1419","key":"sidebar-entry-list-pattern","category":"pattern","content":"Pattern: entry viewer sidebar renders the entry list with filtering and search. Filter buttons for each category (decision/bug/pattern/knowledge/architecture) plus 'All'. Search input filters by id, content, or tags. Entries show category badge, key, content preview (2 lines), and tag chips. Clicking selects the entry and switches to Detail tab. Selected entries get .selected class with brand border.","tags":["pattern","viewer","sidebar","filter","search"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["toon-file-format-details","entry-linking-patterns","shared-tag-auto-linking"],"ttl":"","lastAccessed":"2026-07-29T13:13:30.218Z"},{"id":"c814e3b0","key":"skills-architecture","category":"architecture","content":"Architecture: the skills directory contains skill definitions for agent workflows. skills/toon-memory.md is the main skill that teaches agents how to use toon-memory effectively. Skills are loaded by the agent via the skill tool when a task matches the skill description. Each skill has a name, description (used for matching), and location (path to SKILL.md with instructions).","tags":["architecture","skills","workflows","agents"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"skills/","links":["observations-module","lock-file-mechanism","config-writer-architecture"],"ttl":"","lastAccessed":""},{"id":"1ddef22a","key":"codebase-memory-mcp-integration","category":"architecture","content":"Architecture: codebase-memory-mcp integration via auto-loaded rules file auto-loads the codebase knowledge graph for structural code queries. It augments traditional grep/glob with graph-based search (search_graph, trace_path, get_code_snippet, query_graph). The codebase graph indexes LSP call/usage resolution and provides cross-referencing. Used together with toon-memory for comprehensive context.","tags":["architecture","codebase","graph","mcp","opencode"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/cli/agents.ts","links":["esbuild-build-pipeline","consolidation-module","session-auto-promotion-details"],"ttl":"","lastAccessed":"2026-07-29T13:08:53.050Z"},{"id":"d6ae9c31","key":"scoring-access-tracking","category":"architecture","content":"Architecture: scoring module in src/mcp/scoring.ts provides entry relevance scoring. findRelatedEntries() finds entries related to a given query by checking tags, content overlap, and links. bumpAccessed() increments the accessCount and updates lastAccessed timestamp when an entry is recalled. Access tracking is persisted to the .toon file on every recall. Used by memory_recall and memory_smart_recall.","tags":["architecture","scoring","relevance","access-tracking"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/scoring.ts","links":["drift-detection","git-integration","quality-access-tracking"],"ttl":"","lastAccessed":""},{"id":"495dff45","key":"session-store-details","category":"architecture","content":"Architecture: session store in src/mcp/session-store.ts manages agent session lifecycle. createSession() records a new session with branch, start time, and empty file list. touchSession() updates the last-seen timestamp. addSessionFile() records files touched during the session. getSessions() lists active sessions. Supports conflict detection by comparing file sets between sessions on different branches.","tags":["architecture","session","store","lifecycle"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/session-store.ts","links":["session-start-hook","session-pruning-pattern","session-store-architecture"],"ttl":"","lastAccessed":"2026-07-29T13:11:06.342Z"},{"id":"cb3bb48d","key":"consolidation-module","category":"architecture","content":"Architecture: consolidation module in src/mcp/consolidation.ts provides content deduplication. consolidateEntries() removes entries with identical content (keeps the one with the highest quality score). mergeSimilar() uses Jaccard similarity > 0.5 to find near-duplicates and merge them. Both operations create backups before modifying data. Used by memory_consolidate and memory_merge_similar tools.","tags":["architecture","consolidation","dedup","merge"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/consolidation.ts","links":["near-duplicate-detection","consolidation-algorithm","archive-module"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.399Z"},{"id":"8fd022fa","key":"observations-module","category":"architecture","content":"Architecture: observations module in src/mcp/observations.ts manages the observation log. readObservations() reads observations.toon, writeObservation() appends a new observation. Each observation has: tool (name of tool that was called), file (file being operated on), timestamp (ISO date). The module also handles auto-pruning at 500 entries. Observations are stored in the same TOON format as memory entries.","tags":["architecture","observations","log","capture"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/observations.ts","links":["observation-auto-prune","capture-hook-architecture","session-auto-promotion-details"],"ttl":"","lastAccessed":"2026-07-29T13:27:24.420Z"},{"id":"3451e598","key":"entry-id-generation","category":"architecture","content":"Architecture: entry IDs use format 'XXXXXXXX' (8 hex chars) generated from timestamp + random. generateId() takes the current Unix timestamp in ms, converts to hex (last 6 chars), and appends 2 random hex chars. This gives ~65K unique IDs per millisecond without collisions. IDs are short (8 chars) for token efficiency but not meant to be human-readable.","tags":["architecture","id","generation","hex","unique"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/entries.ts","links":["entries-module","toon-format-decision","lock-file-mechanism"],"ttl":"","lastAccessed":""},{"id":"cf3fb2fc","key":"lock-file-mechanism","category":"architecture","content":"Architecture: lock file (.toon-memory/memory/.lock) uses a format with PID@hostname and timestamp. acquireLock() writes this file using writeFileSync (atomic on most OS for small files). If the file exists and is older than 5 seconds, it's considered stale and overwritten (deadlock recovery). Locks are released explicitly by releaseLock() or cleaned up on process exit.","tags":["architecture","lock","concurrency","atomic","deadlock"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/lock.ts","links":["file-locking-pattern","drift-detection","session-pruning-pattern"],"ttl":"","lastAccessed":""},{"id":"5ba22d13","key":"i18n-and-localization","category":"knowledge","content":"Knowledge: i18n is handled through 8 translated README files (README.es.md, README.de.md, README.fr.md, README.ja.md, README.ko.md, README.pt-br.md, README.zh.md). The docs site has its own i18n via Astro's built-in i18n support. CLI messages and tool descriptions are in English only. The AGENTS.md allows the agent to respond in the user's language (Spanish in this case).","tags":["knowledge","i18n","languages","readme","docs"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"README.es.md","links":["docs-site-architecture","mcp-tool-error-handling","memory-io-layer"],"ttl":"","lastAccessed":"2026-07-29T13:06:36.814Z"},{"id":"cc61641b","key":"project-constants","category":"knowledge","content":"Knowledge: project constants in src/cli/constants.ts defines projectRoot (resolved from package.json location or CWD), editorConfig paths, and version string. Used by all modules that need filesystem paths. The projectRoot discovery walks up directories looking for package.json or .toon-memory directory. Falls back to process.cwd().","tags":["knowledge","constants","paths","project-root"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/constants.ts","links":["memory-io-layer","context-generation-tools","backup-rotation-pattern"],"ttl":"","lastAccessed":""},{"id":"6ce8045d","key":"capture-hooks-per-agent","category":"knowledge","content":"Knowledge: capture hooks are stored per-agent-framework in each agent's config directory. OpenCode uses .opencode/rules/, Claude Code uses CLAUDE.md, Cursor uses .cursorrules, Continue uses .continuerc, Gemini uses .gemini/config/*.md. Each config installs the capture binary (dist/cli/capture.js) as a tool_use hook. The binary writes observations to observations.toon when a tool is invoked.","tags":["knowledge","capture","hooks","agents","config"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/cli/config-writer.ts","links":["agent-framework-integration","agents-module","config-writer-architecture"],"ttl":"","lastAccessed":""},{"id":"10b9dce3","key":"viewer-static-snapshot","category":"knowledge","content":"Knowledge: the viewer receives data as an injected JSON blob (const DATA = ${jsonData}) at HTML generation time. It does NOT fetch from any API or read the .toon file. This means the viewer is a static HTML snapshot, not a live view, it works offline with no server, to refresh you regenerate. The --serve flag wraps the same HTML in a basic HTTP server. --live flag adds SSE for auto-refresh.","tags":["knowledge","viewer","static","offline","architecture"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-html-generation","no-cloud-decision","prompts-ts-error"],"ttl":"","lastAccessed":"2026-07-29T13:27:24.420Z"},{"id":"824b0ac9","key":"drift-detection","category":"knowledge","content":"Knowledge: drift detection compares lastAccessed date against git file modification times. If a memory entry references a file and that file has been modified more recently than the entry was accessed, the entry is flagged as potentially stale. Quality score is reduced by up to 0.15 for drifted entries. Detected during smart_recall and context generation.","tags":["knowledge","drift","stale","quality","git"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["git-integration","toon-file-format-details","toon-format-decision"],"ttl":"","lastAccessed":"2026-07-29T13:13:30.218Z"},{"id":"7c96a6c2","key":"session-auto-promotion-details","category":"knowledge","content":"Knowledge: session promotion automatically promotes observations accessed 3+ times in a session to permanent memory entries. Tracked via session access map. Happens on session end or periodically. Prevents loss of frequently-used transient knowledge. The promotion uses memory_remember with the observation content, auto-assigning a key from the tool name and file path.","tags":["knowledge","session","promotion","auto","transient"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/session-store.ts","links":["session-auto-promotion","file-locking-pattern","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":""},{"id":"1520ef6b","key":"context-generation-tools","category":"knowledge","content":"Knowledge: context generation in src/lib/context.ts produces structured output for context_* tools. context_brief returns relevant memory + active sessions + project health. context_generate returns full system prompt with project info (from package.json), git state (branch, recent commits), relevant memory entries, and active sessions. context_focus returns hyper-focused data for a specific symbol/task including related files and tests.","tags":["knowledge","context","generation","structured"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/context.ts","links":["token-efficient-context","context-brief-architecture","benchmark-scripts"],"ttl":"","lastAccessed":"2026-07-29T13:13:30.218Z"},{"id":"75494219","key":"git-integration","category":"knowledge","content":"Knowledge: git integration in src/lib/git.ts provides fileMtimes() to check when files were last modified via git. Used for drift detection in quality scoring. If a file has been modified by the user but the memory entry hasn't been updated, quality decreases. Also checks git log for recency signals. Integration uses execSync to run git commands.","tags":["knowledge","git","drift","quality","mtime"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/git.ts","links":["session-start-hook","no-cloud-decision","jsonl-format"],"ttl":"","lastAccessed":""},{"id":"76ac11a7","key":"deterministic-graph-algorithms","category":"pattern","content":"Pattern: all graph algorithms (centrality, BM25, BFS) are deterministic with no randomness. Centrality uses degree centrality (number of connections). BM25 uses fixed k1=1.5, b=0.75. Sort for tiebreaking uses consistent key ordering. This ensures the same query always returns the same results, critical for reproducible agent behavior.","tags":["pattern","graph","deterministic","reproducibility"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-bfs-traversal","shared-tag-auto-linking","mcp-tool-error-handling"],"ttl":"","lastAccessed":""},{"id":"962a42b1","key":"graph-bfs-traversal","category":"pattern","content":"Pattern: graph traversal uses BFS for shortest path (memory_graph_path) and neighbor expansion (graph recall mode). Shortest path uses a standard queue-based BFS with visited set, returning the path as array of entry keys. Graph recall does 1-hop or 2-hop expansion from seed nodes, returning the subgraph with edges. Both are O(V+E) on the memory graph.","tags":["pattern","graph","bfs","shortest-path","traversal"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-recall-algorithm","graph-centrality-algorithm","entry-linking-patterns"],"ttl":"","lastAccessed":""},{"id":"9db55138","key":"entry-linking-patterns","category":"pattern","content":"Pattern: entries also link via explicit links field and [[wiki refs]] in content. parseEntries() extracts both. Explicit links are stored as array in the entry. Wiki refs are parsed from content using regex /\\[\\[([^\\]]+)\\]\\]/g. All link types (explicit, wiki, shared-tag) are merged into the graph adjacency list for unified traversal.","tags":["pattern","graph","links","wiki","parsing"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["shared-tag-auto-linking","graph-edge-types","utils-module"],"ttl":"","lastAccessed":""},{"id":"1b8010ac","key":"shared-tag-auto-linking","category":"pattern","content":"Pattern: entries auto-link when they share 2+ tags. buildGraph() in graph.ts iterates all entry pairs and adds an edge if they share >= 2 tags. Skip optimization: entries with 0-1 tags are skipped from the outer loop since they cannot match the threshold. This O(n²) algorithm runs on every build but is fast enough for <500 entries.","tags":["pattern","graph","edges","tags","auto-link"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["near-duplicate-detection","entries-module","benchmark-graph-mismatch"],"ttl":"","lastAccessed":"2026-07-29T13:06:36.814Z"},{"id":"429b6ffb","key":"viewer-css-duplicates","category":"bug","content":"Bug: viewer CSS had a duplicate .timeline-entry rule and a duplicate .graph-container svg rule. The grid background pseudoelement was rendered below the SVG due to z-index stacking. These were cosmetic but caused redundant CSS.","tags":["bug","viewer","css","duplicate","cosmetic"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["sidebar-resizer-layout-bug","d3js-viewer-decision","viewer-serve-exit-bug"],"ttl":"","lastAccessed":"2026-07-29T13:09:29.356Z"},{"id":"b6189a1d","key":"prompts-ts-error","category":"bug","content":"Bug: TS error in prompts.ts - a pre-existing type error unrelated to the viewer/system changes. Error was already present before any edits. Does not block build (esbuild doesn't type-check) but fails npx tsc --noEmit. Needs separate fix: type annotation mismatch in the prompts definitions.","tags":["bug","typescript","type-error","preexisting"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/prompts.ts","links":["esbuild-vs-tsc-decision","mcp-tool-error-handling","build-order-race"],"ttl":"","lastAccessed":""},{"id":"7f6aab93","key":"build-order-race","category":"bug","content":"Bug: Build had implicit dependency order (bin -> mcp -> cli) but the build script used Promise.all originally, causing race conditions where mcp/server.js was referenced before being built. Fix: changed to sequential && chaining to guarantee build order. Also discovered that src/mcp/server.ts imports from lib/ which must be resolved before bundling.","tags":["bug","build","race","order","sequential"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["benchmark-graph-mismatch","viewer-serve-exit-bug","npm-dependencies"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.060Z"},{"id":"c4e19039","key":"benchmark-graph-mismatch","category":"bug","content":"Bug: Benchmark script (bench-viewer.mjs) produced graph stats (167 edges) that didn't match the real buildGraph in graph.ts (171 edges). Cause: benchmark used a simpler edge-building algorithm that didn't include shared-tag edges (2+ shared tags). Fix: rewrote benchmark to use the same buildGraph logic, now produces matching 171 edges.","tags":["bug","benchmark","graph","edges","mismatch"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"scripts/bench-viewer.mjs","links":["benchmark-scripts","bm25-vs-embeddings-decision","docs-site-architecture"],"ttl":"","lastAccessed":"2026-07-29T13:13:04.144Z"},{"id":"dbbb5f41","key":"sidebar-resizer-layout-bug","category":"bug","content":"Bug: sidebar resizer was a grid item in a grid-template-columns layout, causing layout shifts when the sidebar width changed via CSS variable. Fix: changed resizer to position: absolute with left: var(--sidebar-w), and .main to position: relative. This decoupled the resizer from the grid layout and allowed smooth sidebar resize without grid recalculation.","tags":["bug","viewer","layout","resizer","css"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-theme-toggle","viewer-standalone","viewer-serve-exit-bug"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.060Z"},{"id":"84b4d218","key":"viewer-serve-exit-bug","category":"bug","content":"Bug: viewer --serve called process.exit(0) after viewerServe() but before the HTTP server could bind. The exit(0) was in the non-serve code path but ran unconditionally due to fallthrough in the if/else chain. Fix: moved process.exit(0) inside the non-serve callback and restructured as if/else if/else to prevent fallthrough to 'Unknown command'.","tags":["bug","viewer","server","exit","race-condition"],"quality":0.97,"accessCount":1,"date":"2026-07-28","file":"src/cli/setup.ts","links":["stdio-vs-sse-decision","cli-setup-routing","toon-format-decision"],"ttl":"","lastAccessed":""},{"id":"67aaedf7","key":"auto-merge-on-duplicate","category":"decision","content":"Decision: memory_remember auto-merges on duplicate key (same key = update, not error). This simplifies agent usage - agents can update entries without checking existence first. Auto-merge strategy: union of tags, max of confidence/quality scores, merge links, update date to latest. Verbatim mode (skip auto-tagging) available for precision. No cascading merge on linked entries.","tags":["decision","merge","dedup","upsert","ergonomics"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["entries-module","no-cloud-decision","jaccard-merge"],"ttl":"","lastAccessed":"2026-07-29T13:05:42.677Z"},{"id":"18c6638c","key":"no-cloud-decision","category":"decision","content":"Decision: no central storage or cloud sync - memory stays local to each project. Rationale: security (no data leaves the machine), simplicity (no auth, no API keys, no servers), speed (no network latency), offline-first (works without internet). Users who want cloud sync can use GitHub Gist export/import or check .toon files into git. This is a feature, not a limitation.","tags":["decision","privacy","offline","local","security"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"README.md","links":["export-gist-format","memory-io-layer","esbuild-vs-tsc-decision"],"ttl":"","lastAccessed":""},{"id":"5fd99199","key":"quality-scoring-decision","category":"decision","content":"Decision: access counting with staleness decay for quality scoring rather than LLM-based quality assessment. Access count + recency approximates usefulness without LLM calls. Entries accessed recently score higher. Staleness decay (-0.2 after 30 days) removes stale knowledge. Combined with content-based signals (tags, links, specificity) for a robust 0-1 score. Deterministic, predictable, explainable.","tags":["decision","quality","scoring","staleness","deterministic"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["quality-scoring-pattern","quality-score-formula","quality-access-tracking"],"ttl":"","lastAccessed":""},{"id":"ac8ec59f","key":"bm25-vs-embeddings-decision","category":"decision","content":"Decision to use BM25 over embedding models for search: BM25 is deterministic, requires no LLM, no model downloads, no GPU. Works offline. Perfect for code search where exact term matching matters. Trade-off: misses semantic similarity that embeddings capture. Mitigation: synonym expansion and fuzzy matching add coverage. For a dev tool, BM25's precision on code terms is more valuable than semantic fuzziness.","tags":["decision","search","bm25","embeddings","offline"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["stdio-vs-sse-decision","esbuild-vs-tsc-decision","fuzzy-search-module"],"ttl":"","lastAccessed":""},{"id":"120fbaa7","key":"d3js-viewer-decision","category":"decision","content":"Decision: D3.js v7 via CDN for the viewer instead of bundling a graph library. Rationale: D3 is the de facto standard for force-directed graphs, CDN avoids adding 250KB+ to the bundle, the viewer HTML is self-contained anyway. Canvas was considered for rendering but SVG was chosen for simplicity, accessibility, and export support. Cytoscape.js was rejected due to heavier API and licensing.","tags":["decision","viewer","d3js","cdn","visualization"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-html-generation","viewer-standalone","d3-graph-viewer"],"ttl":"","lastAccessed":"2026-07-29T13:12:06.257Z"},{"id":"fdb6843f","key":"esbuild-vs-tsc-decision","category":"decision","content":"Decision to use esbuild over tsc for build: esbuild is 10-100x faster than tsc, produces bundled output (single JS file for MCP server), supports --define for version injection. tsc is used only for type checking (npx tsc --noEmit in CI). The trade-off: no type checking during build means type errors slip through if not caught separately. CI catches them.","tags":["decision","build","esbuild","tsc","speed"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["ci-workflow-config","stdio-vs-sse-decision","typescript-configuration"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.060Z"},{"id":"d2669967","key":"stdio-vs-sse-decision","category":"decision","content":"Decision to use StdioServerTransport (stdio MCP) over SSE (HTTP MCP): Stdio is simpler, requires no HTTP server, no port assignment, no CORS. Ideal for local CLI-based AI agents (OpenCode, Claude, Cursor). SSE adds complexity for zero benefit in local scenarios. The trade-off: only one client at a time, but memory uses file locking for concurrent safety anyway.","tags":["decision","mcp","transport","stdio","sse"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/server.ts","links":["viewer-standalone","jsonl-format","utils-module"],"ttl":"","lastAccessed":"2026-07-29T13:27:24.420Z"},{"id":"03c1fc4d","key":"toon-format-decision","category":"decision","content":"Decision to use TOON format over JSON/Markdown: TOON is compact (~250 bytes/entry vs ~500+ for JSON), pipe-delimited (human-readable, grep-friendly), version-controllable (diff-friendly). Preserves field order for deterministic diffs. JSONL was considered but TOON offers better density. Markdown was rejected because structured data needs parsing. The @toon-format/toon library handles serialization.","tags":["decision","format","toon","json","markdown","storage"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/memory-io.ts","links":["toon-file-format-details","memory-io-layer","jsonl-format"],"ttl":"","lastAccessed":"2026-07-29T13:12:06.257Z"},{"id":"578c2abd","key":"toon-file-format-details","category":"knowledge","content":"TOON file format: custom pipe-delimited compact format via @toon-format/toon. Header with version, separator config. Each entry has fields: key, category, content, tags, date, accessed, file, ttl, lastAccessed, links. Compact storage (~250 bytes per entry). Human-readable and version-controllable. Archive.toon uses same format for old entries.","tags":["separated), date, accessed, file, ttl, lastAccessed. Compact storage (~250 bytes per entry). Human-readable and version-controllable. Archive.toon uses same format for old entries.","format","toon","storage","compact"],"quality":1,"accessCount":0,"date":"src/mcp/memory-io.ts","file":"src/mcp/memory-io.ts","links":["toon-format-decision","memory-io-layer","jsonl-format"],"ttl":"toon;format;storage;compact;human-readable","lastAccessed":"0.99"},{"id":"91203b13","key":"agent-framework-integration","category":"knowledge","content":"Agent frameworks integration: 15+ agents supported via auto-detection in agents.ts and config-writer.ts. Each agent gets capture hooks + memory_recall auto-loading. File watcher (watchMemory via fs.watch) reloads memory on changes. OpenCode gets the most advanced integration (beacon event, tool.execute.after hook). Claude Code via CLAUDE.md. Others via .cursorrules, .continuerc, .gemini/config, etc.","tags":["agents","integration","frameworks","auto-detection"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/agents.ts","links":["agents-module","config-writer-architecture","capture-hook-architecture"],"ttl":"","lastAccessed":"2026-07-29T13:05:42.677Z"},{"id":"54f02734","key":"benchmark-scripts","category":"knowledge","content":"Benchmark scripts in scripts/: benchmark-toon.mjs (TOON format read/write perf), benchmark-impact.mjs (impact analysis), bench-context-tools.mjs (context generation perf), bench-full-impact.mjs (full impact analysis), bench-compress-all.mjs (compression perf), bench-primer.mjs (system primer generation). bench-viewer.mjs produces graph stats (density, avg degree) to match buildGraph output.","tags":["benchmark","scripts","performance","metrics"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"scripts/","links":["docs-site-architecture","npm-dependencies","mcp-tool-history"],"ttl":"","lastAccessed":"2026-07-29T13:13:30.218Z"},{"id":"c4308171","key":"installer-scripts","category":"knowledge","content":"Installer scripts: install.sh (bash, Unix) and install.ps1 (PowerShell, Windows). Detects platform and installs to local bin or global. install.sh uses curl/wget to fetch the latest release tarball. install.ps1 uses Invoke-WebRequest. Both check for Node.js >= 18. Also installs shell completions (bash/zsh) and man pages. Uninstall via uninstall.sh or manual removal.","tags":["installer","setup","cross-platform","node"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"install.sh","links":["cli-setup-routing","docs-site-architecture","commands-module"],"ttl":"","lastAccessed":""},{"id":"b8b00fc2","key":"docs-site-architecture","category":"knowledge","content":"Documentation is a separate Astro site in docs/ directory. Uses Astro for SSG, deployed via GitHub Pages. Supports 8 languages (en, es, zh, ja, ko, pt-br, de, fr) via Astro i18n. Features: 29 MCP tools cards with SVG icons, token system architecture diagrams, benchmark showcase with charts, sticky header, accessibility, SEO, professional design. Dev server via docs own scripts.","tags":["docs","astro","i18n","ssg","landing-page"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"docs/","links":["docs-i18n-keys","viewer-html-generation","mcp-tool-error-handling"],"ttl":"","lastAccessed":""},{"id":"d16aa3f9","key":"ci-workflow-config","category":"knowledge","content":"CI configuration in .github/workflows/ci.yml: Triggers on push/PR to main. Matrix strategy: Node 20 and 22. Steps: checkout, setup-node (matrix version), npm ci, npm run build, npm test. Also runs npx tsc --noEmit for type checking (no ESLint configured). Separate workflows: docs.yml (docs site deploy) and publish.yml (npm publish on release tag).","tags":["ci","github-actions","matrix","node"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":".github/workflows/ci.yml","links":["typescript-configuration","vitest-test-infrastructure","esbuild-build-pipeline"],"ttl":"","lastAccessed":""},{"id":"4d839c4e","key":"npm-dependencies","category":"knowledge","content":"Dependencies: @inquirer/prompts (interactive prompts for CLI), @modelcontextprotocol/server (MCP SDK v2 beta), @toon-format/toon (TOON file format parser/serializer), zod (schema validation). Dev deps: typescript 7, vitest 4, esbuild, gpt-tokenizer. No runtime LLM dependency, no external services. Zero external service architecture keeps memory fully offline.","tags":["dependencies","package","npm","offline"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["zero-deps-philosophy","memory-io-layer","esbuild-build-pipeline"],"ttl":"","lastAccessed":"2026-07-29T13:11:26.189Z"},{"id":"f0276695","key":"typescript-configuration","category":"knowledge","content":"TypeScript configuration in tsconfig.json: target ES2022, module NodeNext, strict mode enabled. Type-checks src/ directory only (excludes tests via exclude pattern). Includes 'declaration: true' for type generation. moduleResolution uses NodeNext for ESM compatibility. Uses Node types via @types/node. Runs in CI via 'npx tsc --noEmit' (not an npm script, run manually).","tags":["typescript","config","typecheck","tsconfig"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"tsconfig.json","links":["jsonl-format","vitest-test-infrastructure","esbuild-build-pipeline"],"ttl":"","lastAccessed":""},{"id":"7c3bbbfd","key":"vitest-test-infrastructure","category":"knowledge","content":"Test infrastructure uses Vitest 4 with vitest.config.ts configuration. Tests are in tests/ directory. 16 test files with 278 tests total. Runs on Node 20/22 in CI. Each test uses temp directories and cleans up automatically. No external services required. Key test files: cli.test.ts (CLI integration), mcp-integration.test.ts (all MCP tools end-to-end), graph.test.ts, quality.test.ts, context.test.ts.","tags":["test","vitest","ci","integration"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"vitest.config.ts","links":["test-no-external","test-temp-dirs","test-auto-cleanup"],"ttl":"","lastAccessed":""},{"id":"edcd695c","key":"esbuild-build-pipeline","category":"knowledge","content":"Build pipeline in package.json: 'npm run build' runs three esbuild steps sequentially via &&. First builds bin/toon-memory.js (entry: src/bin/toon-memory.ts, bundle: true, platform: node, target: node20, external: ['esbuild']). Second builds mcp/server.js (entry: src/mcp/server.ts, bundle with version injection via --define). Third builds dist/cli/*.js (4 files: setup.ts, opencode-plugin.ts, capture.ts, session-start.ts, external: all packages).","tags":["build","esbuild","pipeline","bundling"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["esbuild-bundle","viewer-html-generation","build-output-layout"],"ttl":"","lastAccessed":"2026-07-29T13:06:36.814Z"},{"id":"b60187d6","key":"near-duplicate-detection","category":"pattern","content":"Near-duplicate detection in consolidation uses Jaccard similarity on word sets. Two entries are considered near-duplicates if Jaccard > 0.5 (50% word overlap). mergeSimilar() in consolidation.ts scans all entries pairwise (O(n²)) and merges matching pairs by keeping the longer content and combining tags. Runs on demand via memory_merge_similar or memory_consolidate.","tags":["dedup","jaccard","similarity","merge","consolidation"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/consolidation.ts","links":["consolidation-algorithm","fuzzy-search-module","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.399Z"},{"id":"47292af9","key":"bm25-search-ranking","category":"pattern","content":"BM25 ranking in src/lib/graph.ts implements the Okapi BM25 algorithm for text search. Parameters: k1=1.5 (term saturation), b=0.75 (length normalization). Tokenization splits on whitespace and camelCase. Structural boosting: Functions/Methods +10, Routes +8, Classes/Interfaces +5. Noise labels (File/Folder/Module/Variable) excluded from results. avgDocLen computed from all entries.","tags":["bm25","search","ranking","ir","tokenization"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["bm25-ranking","utils-module","auto-linking-depth"],"ttl":"","lastAccessed":""},{"id":"49ec9452","key":"quality-scoring-pattern","category":"pattern","content":"Quality scoring in src/lib/quality.ts calculates 0-1 scores based on: tags (bonus for 1-5 tags), links (bonus for 1-5 links), content length (optimal 50-500 chars), recency (1.0 fresh, decays to 0.2 over 365 days), specificity (detecting code, paths, URLs, numbers), access frequency (more accesses = higher), staleness decay (-0.2 after 30 days no access). Combined via weighted product.","tags":["quality","scoring","decay","staleness","recency"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["quality-score-formula","quality-staleness-decay","quality-scoring"],"ttl":"","lastAccessed":""},{"id":"e77b6256","key":"observation-auto-prune","category":"pattern","content":"Observations auto-prune at 500 entries to prevent bloat. When a new observation pushes the count over 500, the oldest entries are removed. Pruning happens on write, not on a timer. Observations are stored in observations.toon with tool name, file, and timestamp. This keeps the capture log manageable while retaining recent context.","tags":["observations","prune","auto","capture","bloat"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/hooks.ts","links":["capture-hook-architecture","backup-rotation-pattern","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":""},{"id":"25021ec0","key":"session-pruning-pattern","category":"pattern","content":"Session pruning removes stale sessions (older than 7 days or with expired TTL). pruneSessions() in src/lib/sessions.ts scans the sessions directory, checks each session's last-seen timestamp, and deletes stale ones. Runs on MCP server startup and periodically. Prevents build-up of orphan session files from disconnected agents.","tags":["session","pruning","stale","cleanup"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/sessions.ts","links":["file-locking-pattern","session-start-hook","resources-registration"],"ttl":"","lastAccessed":""},{"id":"06772376","key":"token-efficient-context","category":"pattern","content":"Context generation tools use token-efficient patterns: compact mode (only signatures, no full source) for context_brief, rebuild mode (hierarchical with token budgets) for context_generate. Truncation detection via comparing total_results to limit. All context_* tools return structured data without LLM processing - pure deterministic logic from memory data.","tags":["context","tokens","efficiency","compact"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/context.ts","links":["context-rebuild-hierarchical","graph-recall-algorithm","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":"2026-07-29T13:13:30.218Z"},{"id":"652f03b9","key":"backup-rotation-pattern","category":"pattern","content":"Backup system keeps the last 10 timestamped backups in .toon-memory/memory/backups/. Each backup file includes the date in the filename (e.g. memory-2026-07-28T16-00-00.toon). Older backups beyond the 10 limit are automatically pruned. Used by memory_backup tool and triggered before major operations like archive or consolidation.","tags":["backup","rotation","pruning","safety"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/mcp/tools.ts","links":["commands-module","file-locking-pattern","config-module"],"ttl":"","lastAccessed":"2026-07-29T13:11:06.342Z"},{"id":"42497e1c","key":"zod-schema-validation","category":"pattern","content":"All MCP tool parameters use Zod schemas for validation. Each tool defines its input schema using z.object() with typed fields, optional defaults, and descriptive messages. Schemas include string/number/boolean with min/max constraints. Enums for categories (decision, pattern, bug, knowledge, architecture) and modes (flat, graph, rebuild).","tags":["zod","validation","schemas","typescript"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["mcp-tool-error-handling","tool-error-handling","agents-module"],"ttl":"","lastAccessed":""},{"id":"2f34b1f0","key":"file-locking-pattern","category":"pattern","content":"File locking in src/lib/lock.ts prevents concurrent access to .toon files. Uses a lock file (.toon-memory/memory/.lock) with PID and timestamp. acquireLock() creates the lock file atomically, releaseLock() removes it. Times out after 5 seconds if lock cannot be acquired. Used by readMemory() and writeMemory() to prevent corruption from parallel agent sessions.","tags":["locking","concurrency","file","atomic"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/lock.ts","links":["session-start-hook","capture-hook-architecture","config-writer-architecture"],"ttl":"","lastAccessed":"2026-07-29T13:11:26.189Z"},{"id":"819ccdd9","key":"mcp-tool-error-handling","category":"pattern","content":"MCP tools use try/catch with error messages returned as content responses, not thrown exceptions. Each tool wraps its logic in try/catch and returns { isError: true, content: [{ type: 'text', text: error.message }] }. This ensures the MCP server never crashes on user errors. Input validation uses Zod schemas before processing.","tags":["error-handling","mcp","robustness","validation"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["tool-error-handling","memory-io-layer","crypto-module"],"ttl":"","lastAccessed":""},{"id":"142fad85","key":"config-module","category":"architecture","content":"Config module in src/mcp/config.ts handles configuration loading, key management, and limits. loadConfig() reads .toon-memory/memory/config.json. MAX_ENTRIES constant (default 100) triggers archive warnings. Key management for encryption mode. Config includes file paths for data.toon, archive.toon, observations.toon, and session storage directories.","tags":["config","limits","paths","keys"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/config.ts","links":["fuzzy-search-module","entries-module","synonyms-module"],"ttl":"","lastAccessed":""},{"id":"b034e2fc","key":"utils-module","category":"architecture","content":"Utils module in src/lib/utils.ts provides shared utility functions: tokenize() splits text into tokens for BM25, normalize() normalizes text (lowercase, trim), isExpiredLocal() checks if a date has passed, importance() calculates entry importance score based on access count and links, isPrivate() checks for 'private' tag on entries.","tags":["utils","tokenize","normalize","utility"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/utils.ts","links":["entries-module","quality-access-tracking","synonyms-module"],"ttl":"","lastAccessed":""},{"id":"05f7ee8b","key":"entries-module","category":"architecture","content":"Entries module in src/mcp/entries.ts provides entry management utilities: generateId() creates unique entry IDs using timestamp + random, parseTTL() converts TTL strings (e.g. '7d', '2026-07-17') to dates, isExpired() checks TTL expiration, inferTags() auto-tags content by keyword matching (verbatim mode skips this), parseRelativeDate() handles relative date strings for date filtering.","tags":["entries","id","ttl","tags","parsing"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/entries.ts","links":["archive-module","toon-v1-format","synonyms-module"],"ttl":"","lastAccessed":""},{"id":"2ca23a3a","key":"crypto-module","category":"architecture","content":"Crypto module in src/mcp/crypto.ts implements AES-256-GCM encryption for memory data. encrypt(data, key) returns base64-encoded ciphertext with IV prepended. decrypt(ciphertext, key) reverses the process. Key derivation uses PBKDF2 with salt. The TOON_MEMORY_KEY environment variable supplies the encryption key. Encryption is opt-in via memory_encrypt tool.","tags":["crypto","aes","gcm","encryption","security"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/crypto.ts","links":["security-env-keys","aes256gcm-encrypt","encrypt-decrypt"],"ttl":"","lastAccessed":""},{"id":"06a19b17","key":"synonyms-module","category":"architecture","content":"Synonyms module in src/lib/synonyms.ts provides term expansion for improved memory recall. Maps common terms to their synonyms (e.g. 'config' ↔ 'configuration', 'delete' ↔ 'remove' ↔ 'forget'). Used during smart_recall to broaden search queries and find entries that use different terminology. Domain-specific synonym maps for memory system terminology.","tags":["synonyms","search","recall","nlp"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/synonyms.ts","links":["fuzzy-search-module","commands-module","resources-registration"],"ttl":"","lastAccessed":""},{"id":"0ddf30db","key":"fuzzy-search-module","category":"architecture","content":"Fuzzy search in src/lib/fuzzy.ts implements approximate string matching for memory recall. Uses Levenshtein distance with configurable threshold. Falls back gracefully when no fuzzy matches are found. Integrated into graph recall and smart recall for broader matching when exact keyword search misses relevant entries.","tags":["fuzzy","search","levenshtein","matching"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/fuzzy.ts","links":["viewer-keyboard-shortcuts","memory-io-layer","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":""},{"id":"110252b3","key":"commands-module","category":"architecture","content":"Commands module in src/cli/commands.ts provides the core CLI command implementations. Includes initProject() to set up the .toon-memory directory structure, showStatus() for current state, showStats() with category breakdowns, exportToon()/importToon() for data portability, watchMemory() for file watching, upgradeSelf() for self-update, and uninstallSelf() for cleanup.","tags":["cli","commands","init","export","import","watch"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/commands.ts","links":["cli-setup-routing","cli-commands","session-start-hook"],"ttl":"","lastAccessed":""},{"id":"2f1ea9a7","key":"agents-module","category":"architecture","content":"Agents module in src/cli/agents.ts detects which AI coding agent is running and installs the appropriate capture hooks. Supports 15+ agents: OpenCode, Claude, Cursor, Continue, Gemini, Codex, Kiro, Mimocode, Cline, Impeccable, Windsurf, CodeGPT, Codium, Aider, Augment, Copilot. Detection is by environment variables, config file presence, or process arguments. Each agent gets a tailored config with tool_use captures.","tags":["agents","detection","hooks","integration"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/agents.ts","links":["config-writer-architecture","15-agents","cli-setup-routing"],"ttl":"","lastAccessed":""},{"id":"ac3aceae","key":"cli-setup-routing","category":"architecture","content":"CLI routing in src/cli/setup.ts handles commands: init, status, stats, export, import, watch, upgrade, uninstall, capture, viewer (with --serve and --port). Uses if/else if/else chain routing argv[2]. 'init' sets up .toon-memory directory and installs agent hooks. 'stats' shows entry counts by category. 'export/import' handle TOON data. 'viewer' generates or serves the HTML graph viewer.","tags":["cli","routing","commands","setup"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/setup.ts","links":["cli-init-command","memory-io-layer","viewer-html-generation"],"ttl":"","lastAccessed":"2026-07-29T13:12:06.257Z"},{"id":"6bac77dc","key":"config-writer-architecture","category":"architecture","content":"Config writer in src/cli/config-writer.ts generates agent-specific configuration files. For each supported agent (OpenCode, Claude, Cursor, Continue, Gemini, Codex, Kiro, Mimocode, Cline, Impeccable), it creates the appropriate config file format with capture hooks enabled. Templates are per-agent with correct file paths and format. Called during 'toon-memory init' and 'toon-memory capture on'.","tags":["config","agents","templates","init"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/config-writer.ts","links":["session-start-hook","capture-hook-architecture","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":"2026-07-29T13:11:26.189Z"},{"id":"c8d217ff","key":"resources-registration","category":"architecture","content":"MCP resources in src/mcp/resources.ts expose memory data as read-only resources for MCP clients. Registers resource templates and static resources that provide access to memory entries, sessions, and health data. Resources use the MCP ResourceTemplate pattern with URI templates for dynamic access by entry key or category.","tags":["mcp","resources","templates","uri"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/mcp/resources.ts","links":["memory-io-layer","session-start-hook","graph-recall-algorithm"],"ttl":"","lastAccessed":""},{"id":"52bff9df","key":"session-start-hook","category":"architecture","content":"Session start hook in src/cli/session-start.ts runs at agent session initialization. It records the git branch, start time, and file access list. Tracks active sessions for conflict detection. Sessions are stored in .toon-memory/sessions/ directory with a structured format including branch, files touched, and last-seen timestamp.","tags":["session","hooks","git","conflict-detection"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/session-start.ts","links":["session-store-architecture","opencode-plugin-auto-loading","session-conflict-detection"],"ttl":"","lastAccessed":"2026-07-29T13:11:26.189Z"},{"id":"d8affc08","key":"archive-module","category":"architecture","content":"Archive module in src/mcp/archive.ts handles moving old entries (>30 days) to archive.toon and pruning expired TTL entries. archiveOldEntries() filters entries by date and appends them to the archive file. pruneExpiredEntries() scans entries with TTL and removes expired ones. Both maintain the data.toon file by filtering out processed entries.","tags":["archive","ttl","prune","storage"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/mcp/archive.ts","links":["opencode-plugin-auto-loading","capture-hook-architecture","memory-archive"],"ttl":"","lastAccessed":""},{"id":"62abd642","key":"memory-io-layer","category":"architecture","content":"Memory I/O in src/mcp/memory-io.ts handles reading and writing .toon files. readMemory() reads the data.toon file and returns its content as a string. writeMemory(data) writes data to data.toon. Uses the TOON format via @toon-format/toon. The file path is resolved relative to projectRoot from src/cli/constants.ts. Handles file not found errors gracefully.","tags":["io","toon","file","persistence","storage"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/memory-io.ts","links":["opencode-plugin-auto-loading","capture-hook-architecture","export-gist-format"],"ttl":"","lastAccessed":"2026-07-29T13:13:30.218Z"},{"id":"49bb179d","key":"capture-hook-architecture","category":"architecture","content":"Capture hooks intercept tool calls and write observations to observations.toon. Implemented in src/cli/hooks.ts. Opt-in via 'toon-memory capture on'. Each observation records tool name, file path, and timestamp. Auto-prunes at 500 entries to prevent bloat. The 'toon-memory capture status' command shows hook installation state. Observations can be promoted to permanent memory entries.","tags":["capture","hooks","observations","auto-prune"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/cli/hooks.ts","links":["capture-system","capture-hooks","capture-observations"],"ttl":"","lastAccessed":""},{"id":"14465db7","key":"opencode-plugin-auto-loading","category":"architecture","content":"OpenCode plugin in src/cli/opencode-plugin.ts hooks into tool.execute.after to implement intelligent auto-loading. Instead of injecting all memory at session start, it triggers a memory_recall by file path after every tool execution. Uses setContext() in OpenCode to inject recalled entries. The plugin also handles first-run config generation. This reduces tokens by ~90% compared to full memory dump.","tags":["opencode","plugin","auto-loading","tokens","efficiency"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/opencode-plugin.ts","links":["intelligent-auto-loading","opencode-plugin","session-conflict-detection"],"ttl":"","lastAccessed":""},{"id":"8ad67378","key":"viewer-keyboard-shortcuts","category":"architecture","content":"Viewer keyboard shortcuts: / focuses search, Escape clears search or deselects entry and switches to graph tab, 1-4 switches tabs (Graph/Stats/Timeline/Detail). When input is focused, Escape only clears and blurs the input. All shortcuts ignore input elements except the Escape+blur behavior.","tags":["viewer","keyboard","ux","shortcuts"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-theme-toggle","viewer-standalone","viewer-html-generation"],"ttl":"","lastAccessed":"2026-07-29T13:11:06.342Z"},{"id":"6d40a55a","key":"viewer-export-features","category":"architecture","content":"Viewer supports PNG and SVG export. PNG uses Canvas 2D: serializes the SVG element to XML, converts to base64 data URL, loads it into an Image, draws to a 2x resolution canvas, then exports via link download. SVG export directly serializes the SVG to a Blob and creates an object URL. Both handle the dark/light background via getComputedStyle.","tags":["viewer","export","png","svg","canvas"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-export-png","viewer-standalone","d3-graph-viewer"],"ttl":"","lastAccessed":"2026-07-29T13:12:06.257Z"},{"id":"39f1e7b4","key":"viewer-force-graph","category":"architecture","content":"Viewer graph uses D3 forceSimulation with 4 forces: link (distance-based), charge (many-body repulsion, default -120), center (gravity to center, default 0.05), collision (radius-based). Nodes are circle elements, edges are line elements. The simulation runs on tick to update positions. Nodes are draggable (fixes position on drag), right-click to unfix. Minimap shows a scaled-down overview with its own SVG.","tags":["viewer","d3js","force-graph","simulation","physics"],"quality":0.99,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-minimap-render","graph-force-layout","graph-physics-controls"],"ttl":"","lastAccessed":""},{"id":"1240730d","key":"viewer-html-generation","category":"architecture","content":"Viewer generates a self-contained HTML file with D3.js v7 via CDN. No runtime dependencies. generateHtml() in src/viewer/html.ts builds the complete HTML string with embedded CSS and JS. Data is serialized as JSON and injected via const DATA = ${jsonData}. The viewer supports graph (D3 force simulation), stats (bar charts, tag cloud), timeline (grouped by date), and detail panels via tabs. --live flag enables SSE for auto-refresh.","tags":["viewer","html","d3js","self-contained","cdnd","cdn"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-standalone","viewer-inline-bundle","d3-graph-viewer"],"ttl":"","lastAccessed":"2026-07-29T13:27:24.420Z"},{"id":"a1b2c3d4","key":"build-output-layout","category":"architecture","content":"Build output layout: bin/toon-memory.js (entry binary), mcp/server.js (MCP server), dist/cli/setup.js (CLI), dist/cli/toon-memory.js, dist/cli/capture.js, dist/cli/session-start.js. All gitignored.","tags":["build","output","structure","esbuild"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"package.json","links":["esbuild-bundle","file-structure","zero-deps-philosophy"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.060Z"},{"id":"bc6dc966","key":"context-rebuild-hierarchical","category":"knowledge","content":"Context rebuild hierarchical: context_rebuild tool reconstructs memory from git history. Scans commits, extracts file changes, generates entries. 3 modes: quick (recent 10 commits), full (all commits), incremental (since last rebuild). Zero LLM.","tags":["context","rebuild","git","hierarchical"],"quality":1,"accessCount":1,"date":"2026-0
