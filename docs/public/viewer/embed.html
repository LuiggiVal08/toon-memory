<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toon-memory viewer (live data)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:oklch(8% 0.02 270);--bg2:oklch(12% 0.02 270);--bg3:oklch(15% 0.02 270);--border:oklch(21% 0.02 270);--text:oklch(91% 0.01 270);--muted:oklch(56% 0.02 270);--brand:oklch(55% 0.25 280);--brand-light:oklch(68% 0.22 280);--brand2:oklch(59% 0.25 300);--lavender:oklch(65% 0.25 310);--pink:oklch(65% 0.26 340);--green:oklch(78% 0.2 155);--red:oklch(65% 0.24 25);--amber:oklch(85% 0.18 85);--brand-wash:oklch(55% 0.25 280 / 0.12);--brand-wash-soft:oklch(55% 0.25 280 / 0.06);--gradient:linear-gradient(135deg,var(--brand),var(--brand2),var(--lavender));--ease-out:cubic-bezier(0.16,1,0.3,1);--font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--font-mono:'JetBrains Mono','Fira Code','Consolas',monospace}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);overflow:hidden}
.app{display:grid;grid-template-rows:1fr;height:100vh}
.main{display:grid;grid-template-columns:var(--sidebar-w,320px) 1fr;overflow:hidden;position:relative}
.sidebar{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.sidebar-header{padding:0.75rem 1rem;border-bottom:1px solid var(--border);background:oklch(8% 0.02 270 / 0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sidebar-header h2{font-size:0.85rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:0.5rem}
.search-box{width:100%;padding:0.5rem 0.75rem;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);font-size:0.85rem;outline:none}
.search-box:focus{border-color:var(--brand)}
.filter-row{display:flex;gap:0.4rem;margin-top:0.5rem;flex-wrap:wrap}
.filter-btn{padding:0.2rem 0.5rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);font-size:0.7rem;cursor:pointer;transition:all 0.15s}
.filter-btn:hover,.filter-btn.active{border-color:var(--brand);color:var(--brand);background:var(--brand-wash)}
.entries-list{flex:1;overflow-y:auto;padding:0.5rem}
.entry-item{padding:0.6rem 0.75rem;border:1px solid var(--border);border-radius:8px;margin-bottom:0.4rem;cursor:pointer;transition:all 0.15s}
.entry-item:hover{border-color:var(--brand);background:var(--brand-wash-soft)}
.entry-item.selected{border-color:var(--brand);background:var(--brand-wash)}
.entry-cat{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.2rem}
.entry-cat.decision{color:var(--brand)}.entry-cat.bug{color:var(--red)}.entry-cat.pattern{color:var(--green)}.entry-cat.knowledge{color:var(--lavender)}.entry-cat.architecture{color:var(--amber)}
.entry-key{font-size:0.85rem;font-weight:600;margin-bottom:0.15rem}
.entry-preview{font-size:0.75rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-tags{display:flex;gap:0.25rem;margin-top:0.3rem;flex-wrap:wrap}
.entry-tag{font-size:0.6rem;padding:0.1em 0.35rem;border-radius:4px;background:var(--bg3);color:var(--muted);font-family:var(--font-mono)}
.viewer-area{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border);background:oklch(8% 0.02 270 / 0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:0 1rem}
.tab{padding:0.6rem 1rem;font-size:0.8rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s}
.tab:hover{color:var(--text)}.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab-content{flex:1;overflow:hidden;position:relative}
.tab-panel{display:none;width:100%;height:100%;overflow:auto}
.tab-panel.active{display:block}
.graph-container{width:100%;height:100%;background:var(--bg);position:relative}
.graph-container::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%,oklch(55% 0.25 280 / 0.07) 0%,transparent 70%);pointer-events:none;z-index:0}
.graph-container svg{width:100%;height:100%;position:relative;z-index:1}
.node-circle{cursor:pointer;transition:r 0.2s var(--ease-out),opacity 0.2s var(--ease-out),filter 0.2s var(--ease-out),stroke 0.2s var(--ease-out)}
.node-circle:hover{filter:brightness(1.3) drop-shadow(0 0 6px color-mix(in srgb,currentColor 60%,transparent))}
.node-circle.glow{filter:drop-shadow(0 0 12px var(--brand)) brightness(1.5)}
.node-circle.selected{stroke:var(--brand);stroke-width:3;filter:drop-shadow(0 0 14px var(--brand)) brightness(1.3)}
.node-label{font-size:9px;font-family:var(--font-mono);fill:var(--text);pointer-events:none;text-anchor:middle;transition:opacity 0.2s var(--ease-out);font-weight:500;letter-spacing:0.02em}
.link{stroke:var(--border);stroke-opacity:0.4;transition:all 0.2s var(--ease-out);cursor:pointer}
.link:hover{stroke-opacity:0.9;stroke-width:3}.link.highlighted{stroke:var(--brand);stroke-opacity:0.9;stroke-width:2.5}.link.faded{stroke-opacity:0.04}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;padding:1.5rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem}
.stat-card h3{font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:0.75rem}
.stat-big{font-size:2rem;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent}
.bar-chart{display:flex;flex-direction:column;gap:0.4rem}.bar-row{display:flex;align-items:center;gap:0.5rem}
.bar-label{font-size:0.75rem;color:var(--muted);width:80px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:20px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.6s var(--ease-out)}
.bar-value{font-size:0.7rem;color:var(--muted);width:30px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:0.4rem}
.tag-pill{padding:0.25rem 0.6rem;border-radius:8px;font-size:0.75rem;font-family:var(--font-mono);border:1px solid var(--border);color:var(--muted);transition:all 0.15s}
.detail-panel{padding:1.5rem;max-width:700px}
.detail-panel h2{font-size:1.2rem;font-weight:700;margin-bottom:0.5rem}
.detail-panel .detail-cat{font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:1rem}
.detail-field{margin-bottom:1rem}
.detail-field label{display:block;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.3rem}
.detail-field .value{font-size:0.9rem;line-height:1.6}
.detail-field .value.mono{font-family:var(--font-mono);background:var(--bg3);padding:0.5rem;border-radius:8px;display:block;overflow-x:auto;white-space:pre-wrap}
.detail-links{display:flex;gap:0.4rem;flex-wrap:wrap}
.detail-link{padding:0.2rem 0.5rem;border:1px solid var(--border);border-radius:8px;font-size:0.75rem;font-family:var(--font-mono);color:var(--brand);cursor:pointer;transition:all 0.15s}
.detail-link:hover{border-color:var(--brand);background:var(--brand-wash)}
.empty-detail{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:0.9rem}
.graph-legend{position:absolute;bottom:3.5rem;left:0.5rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.75rem;font-size:0.7rem;z-index:10}
.legend-item{display:flex;align-items:center;gap:0.4rem;margin-bottom:0.25rem}.legend-dot{width:10px;height:10px;border-radius:50%}
.minimap{width:150px;height:100px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.3);cursor:pointer;position:absolute;bottom:0.5rem;right:0.5rem;z-index:10}
.minimap svg{width:100%;height:100%;display:block}
.minimap-viewport{fill:oklch(55% 0.25 280 / 0.15);stroke:oklch(55% 0.25 280);stroke-width:1.5}
.graph-controls{position:absolute;top:1rem;right:1rem;display:flex;gap:0.4rem;z-index:10}
.graph-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all 0.15s}
.graph-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-wash)}
.tooltip{position:fixed;pointer-events:none;background:oklch(12% 0.02 270 / 0.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:0.75rem 1rem;font-size:0.75rem;max-width:320px;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.tooltip .tt-cat{font-size:0.6rem;font-weight:600;text-transform:uppercase;margin-bottom:0.2rem}
.tooltip .tt-key{font-weight:600;margin-bottom:0.2rem}
.tooltip .tt-content{color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tooltip .tt-score{margin-top:0.3rem;font-size:0.65rem;color:var(--brand)}
.tooltip .tt-edge{font-size:0.65rem;color:var(--muted);margin-top:0.3rem;padding-top:0.3rem;border-top:1px solid var(--border)}
.timeline-container{padding:1.5rem;overflow-y:auto;height:100%}
.timeline-header{font-size:1rem;font-weight:700;margin-bottom:1rem}
.timeline-track{position:relative;padding-left:2rem}
.timeline-line{position:absolute;left:0.5rem;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-entry{position:relative;margin-bottom:1rem;padding:0.6rem 0.8rem;border:1px solid var(--border);border-radius:8px;background:var(--bg2);cursor:pointer;transition:all 0.15s}
.timeline-entry:hover{border-color:var(--brand)}
.timeline-entry::before{content:'';position:absolute;left:-1.75rem;top:0.8rem;width:10px;height:10px;border-radius:50%;border:2px solid var(--border);background:var(--bg)}
.timeline-entry .tl-date{font-size:0.65rem;color:var(--muted);margin-bottom:0.2rem}
.timeline-entry .tl-cat{font-size:0.6rem;font-weight:600;text-transform:uppercase}
.timeline-entry .tl-key{font-size:0.85rem;font-weight:600}
.timeline-entry .tl-content{font-size:0.75rem;color:var(--muted);margin-top:0.2rem}



.physics-panel{position:absolute;top:2.8rem;left:0.5rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.75rem;font-size:0.7rem;z-index:10;min-width:180px}
.physics-panel h4{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:0.5rem}
.graph-toolbar{position:absolute;top:1rem;left:0.5rem;display:flex;gap:0.4rem;z-index:11}
.physics-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem}
.physics-row label{font-size:0.65rem;color:var(--muted);width:60px;flex-shrink:0}
.physics-row input[type="range"]{flex:1;height:4px;-webkit-appearance:none;background:var(--bg3);border-radius:2px;outline:none}
.physics-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--brand);cursor:pointer}
.physics-row .physics-val{font-size:0.6rem;color:var(--muted);width:30px;text-align:right}
.node-circle.search-match{filter:drop-shadow(0 0 10px var(--brand)) brightness(1.4);animation:searchPulse 1.5s ease-in-out infinite}
@keyframes searchPulse{0%,100%{filter:drop-shadow(0 0 8px var(--brand)) brightness(1.2)}50%{filter:drop-shadow(0 0 18px var(--brand)) brightness(1.7)}}
.path-btn.active{background:var(--gradient);color:#fff;border-color:transparent;box-shadow:0 2px 14px -2px oklch(55% 0.25 280 / 0.5)}
.path-info{position:absolute;bottom:0.5rem;left:0.5rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.7rem;font-size:0.7rem;z-index:10;display:none;max-width:500px;word-break:break-all}
.node-circle.path-start{stroke:var(--green);stroke-width:3;filter:drop-shadow(0 0 12px var(--green))}
.node-circle.path-end{stroke:var(--red);stroke-width:3;filter:drop-shadow(0 0 12px var(--red))}
.node-circle.path-node{stroke:var(--brand);stroke-width:2.5;animation:pathNodePulse 1.2s ease-in-out infinite}
@keyframes pathNodePulse{0%,100%{filter:drop-shadow(0 0 6px var(--brand))}50%{filter:drop-shadow(0 0 14px var(--brand))}}
.link.path-edge{stroke:var(--brand);stroke-opacity:0.9;stroke-width:3}
.light{--bg:oklch(96% 0.005 270);--bg2:oklch(100% 0 0);--bg3:oklch(93% 0.005 270);--border:oklch(88% 0.01 270);--text:oklch(22% 0.02 270);--muted:oklch(45% 0.01 260);--brand:oklch(50% 0.22 280);--brand-light:oklch(55% 0.22 280)}
.light .sidebar-header,.light .tabs{background:rgba(255,255,255,0.85)}
.light .tooltip{background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--border);box-shadow:0 8px 32px rgba(0,0,0,0.1)}
.light .timeline-entry{background:var(--bg2)}.light .graph-btn{background:var(--bg2)}
@media(max-width:768px){.main{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Entries</h2>
        <input type="text" class="search-box" id="search" placeholder="Search entries... (/)">
        <div class="filter-row" id="filters"></div>
      </div>
      <div class="entries-list" id="entriesList"></div>
    </div>
    <div class="viewer-area">
      <div class="tabs">
        <div class="tab active" data-tab="graph">Graph</div>
        <div class="tab" data-tab="stats">Stats</div>
        <div class="tab" data-tab="timeline">Timeline</div>
        <div class="tab" data-tab="detail">Detail</div>
      </div>
      <div class="tab-content">
        <div class="tab-panel active" id="panel-graph">
          <div class="graph-container" id="graphContainer">
            <div class="graph-legend" id="legend"></div>
            <div class="minimap" id="minimap"><svg id="minimapSvg"></svg></div>
            <div class="graph-controls">
              <button class="graph-btn" id="zoomIn" title="Zoom in (+)">+</button>
              <button class="graph-btn" id="zoomOut" title="Zoom out (-)">−</button>
              <button class="graph-btn" id="zoomReset" title="Reset (0)">⟲</button>
            </div>
            <div class="graph-toolbar">
              <button class="graph-btn" id="physicsToggle" title="Physics controls">⚙</button>
              <button class="graph-btn path-btn" id="pathToggle" title="Find path between two nodes">⇿</button>
            </div>
            <div class="physics-panel" id="physicsPanel" style="display:none">
              <h4>Graph Physics</h4>
              <div class="physics-row"><label>Charge</label><input type="range" id="chargeSlider" min="-300" max="0" value="-120" step="10"><span class="physics-val" id="chargeVal">-120</span></div>
              <div class="physics-row"><label>Distance</label><input type="range" id="distSlider" min="20" max="200" value="70" step="5"><span class="physics-val" id="distVal">70</span></div>
              <div class="physics-row"><label>Center</label><input type="range" id="centerSlider" min="0" max="1" value="0.05" step="0.01"><span class="physics-val" id="centerVal">0.05</span></div>
            </div>
            <div class="path-info" id="pathInfo"></div>
          </div>
        </div>
        <div class="tab-panel" id="panel-stats">
          <div class="stats-grid" id="statsGrid"></div>
        </div>
        <div class="tab-panel" id="panel-timeline">
          <div class="timeline-container" id="timelineContainer"></div>
        </div>
        <div class="tab-panel" id="panel-detail">
          <div class="detail-panel" id="detailPanel">
            <div class="empty-detail">Select an entry from the sidebar or click a node in the graph</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip" style="display:none"></div>
<script>
const DATA = {"nodes":[{"id":"hook-scripts-relative-path","key":"hook-scripts-relative-path","category":"bug","content":"Los hooks generados (.toon-memory/hooks/*.sh) usaban rutas relativas: `node \"capture.js\" claude`. Causa raíz: src/cli/constants.ts derivaba scriptDir de `process.argv[1]`, pero los entry points (src/bin/toon-memory.ts y src/cli/toon-memory.ts) sobreescriben `process.argv = [\"node\",\"toon-memory\",...args]` → dirname = \".\" → paths relativos resueltos contra el CWD del hook. Fix v4.3.2: constants.ts usa `dirname(fileURLToPath(import.meta.url))`. Verificado: constants.ts solo lo importa src/cli/* → seguro usar import.meta.url. La ruta ahora es absoluta: node \"/abs/path/dist/cli/session-start.js\" codex. Pendiente futuro: en Windows los hooks son .sh bash y no corren sin Git Bash; habría que generar .cmd o wrapper PowerShell.","tags":["hooks","paths","constants","import.meta.url","windows","CLI"],"quality":0.79,"accessCount":1,"date":"2026-08-03","file":"src/cli/constants.ts:15","links":[],"ttl":"","lastAccessed":""},{"id":"archive-import-header-format-tolerance","key":"archive-import-header-format-tolerance","category":"bug","content":"Los archivos data.toon tienen DOS formatos de header: `entries[N|]` (escrito por ensureMemoryFile/config.ts del MCP) y `[N|]` (escrito por CLI init en src/cli/memory.ts y por import en commands.ts). Los parsers (entryLines/parseEntries) son header-agnósticos, pero archive.ts usaba `startsWith(\"entries[\")` → archiveOldEntries/pruneExpiredEntries devolvían 0 en silencio en proyectos CLI (memory_archive, MAX_ENTRIES auto-trim y TTL pruning rotos). Fix en v4.3.2: helper findHeaderIdx acepta ambos + bumpHeaderCount preserva prefijo entries/archived. OJO: el writer de archive.toon también eliminaba el prefijo `archived` (regla `/archived\\[\\d+\\|/` → `[N|]`), rompiendo el findIndex en la siguiente corrida. También el regex de importMemory `/entries\\[\\d+\\|]/` exigía `]` literal tras el count → nunca matcheaba. Lección: al tocar headers, probar SIEMPRE ambos formatos.","tags":["archive","header","format","import","data.toon","regression"],"quality":0.78,"accessCount":1,"date":"2026-08-03","file":"src/mcp/archive.ts:10","links":[],"ttl":"","lastAccessed":""},{"id":"agent-logos-svg-urls","key":"agent-logos-svg-urls","category":"knowledge","content":"Verified logo SVG URLs for 3 AI coding agents (fact-sheet task). goose: official https://raw.githubusercontent.com/aaif-goose/goose/main/documentation/static/img/logo.svg (200x200 SVG, verified 200). Amp: official https://ampcode.com/press-kit/logo-dark.svg + logo-light.svg (verified 200). Junie: JetBrains official sources blocked (junie.jetbrains.com 403; plugins/agent-workbench NOT in intellij-community master; no SVG in JetBrains/junie assets or @jetbrains/junie npm tarball). Junie fallback: LobeHub CDN https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.94.0/icons/junie.svg (verified 200, simplified 24x24 green \"J\" glyph, not official).","tags":["goose","junie","amp","logo","research"],"quality":0.79,"accessCount":1,"date":"2026-08-03","file":"","links":[],"ttl":"","lastAccessed":""},{"id":"publish-mcp-registry-needs-npm","key":"publish-mcp-registry-needs-npm","category":"decision","content":"PUBLISH WORKFLOW: publish-mcp-registry AHORA necesita [build, publish-npm] (antes solo build) + step \"Wait for npm version to propagate\" que hace curl a https://registry.npmjs.org/toon-memory/${VERSION} cada 5s (hasta 30 intentos) antes de ./mcp-publisher publish. Motivo: el MCP registry (registry.modelcontextprotocol.io) VALIDA que la versión npm exista — en v4.3.1 falló con 400 \"NPM package 'toon-memory' exists, but version '4.3.1' was not found (status: 404)\" porque npm publish tarda un momento en propagarse. La asunción previa \"el orden npm→MCP no es requisito\" es FALSA. Si un release vuelve a fallar en el job MCP: verificar `npm view toon-memory@<ver>` y rerun del job con `gh run rerun <run> --job <id>`. Tests: build+test en el job build (npm ci). Usar npm ci (no install) para reproducibilidad.","tags":["ci","workflow","publish","mcp-registry","npm"],"quality":0.78,"accessCount":1,"date":"2026-08-03","file":"","links":["supersedes:publish-workflow-parallel-jobs"],"ttl":"","lastAccessed":""},{"id":"install-ps1-pinned-ancient","key":"install-ps1-pinned-ancient","category":"bug","content":"install.ps1 estaba anclado a toon-memory@1.0.9 con checksum SHA-256 placeholder (d5b2a8cbe0f3...). El usuario E.N.D corrió el instalador de PowerShell → le instaló una versión antigua cuyo init escribía el formato MCP legacy de opencode ({\"command\",\"args\"} sin type/enabled) → opencode 1.17+ rechaza la entrada y bloquea TODO el opencode.json (sus otros MCP servidores quedaron \"rotos\" sin que se tocaran). Fix v4.3.1: install.ps1 resuelve latest + dist.integrity (sha512) desde https://registry.npmjs.org/toon-memory/latest en runtime y verifica SHA-512, espejando install.sh. Config-writer YA escribía el formato correcto desde v3.1.0; re-correr 'toon-memory init --agent opencode --scope global' migra la entrada legacy preservando las demás claves.","tags":["windows","installer","opencode","mcp-config"],"quality":0.78,"accessCount":1,"date":"2026-08-03","file":"install.ps1","links":[],"ttl":"","lastAccessed":"2026-08-03T19:01:09.145Z"},{"id":"windows-esm-url-scheme","key":"windows-esm-url-scheme","category":"bug","content":"Windows crash ERR_UNSUPPORTED_ESM_URL_SCHEME: los entry points (src/bin/toon-memory.ts, src/cli/toon-memory.ts) pasaban rutas absolutas crudas a import() → en Windows 'C:\\...' se parsea como URL scheme 'c:'. Fix: pathToFileURL(join(...)).href vía helper compartido src/cli/entry.ts (fileImportURL). build:bin ahora usa --bundle para inlinear el helper. Afectaba TODAS las versiones publicadas desde 05f62c6 (2026-07-12, eliminación de child_process) → toon-memory estaba 100% roto en Windows. Fix en v4.3.1.","tags":["windows","esm","bug","entry-point"],"quality":0.79,"accessCount":1,"date":"2026-08-03","file":"src/cli/entry.ts","links":[],"ttl":"","lastAccessed":"2026-08-03T19:01:09.145Z"},{"id":"starlight-lang-keys","key":"starlight-lang-keys","category":"knowledge","content":"En @astrojs/starlight (v0.41) el sidebar `translations` y el `title` map se indexan por el `lang` del locale, NO por la clave del objeto `locales`/URL. Para pt-br: clave URL 'pt-br' pero lang 'pt-BR' → todas las translations y el title deben usar 'pt-BR'. El title top-level acepta un objeto por idioma (`title: { en, es, zh, ja, ko, 'pt-BR', de, fr }`) con clave obligatoria para el lang del defaultLocale; `description` solo acepta string (no por idioma). Referencia: docs/astro.config.mjs.","tags":["astro","starlight","i18n","pt-br","docs"],"quality":0.78,"accessCount":1,"date":"2026-08-03","file":"docs/astro.config.mjs","links":[],"ttl":"","lastAccessed":""},{"id":"isologo-mimo-style","key":"isologo-mimo-style","category":"decision","content":"Isologo \"toon-memory\" rediseñado en estilo MiMo (letras slab con cortes a 45°) implementado en el header como variante B (SVG único). Usuario eligió B de 3 variantes mostradas.\n\n- Nuevo asset: docs/src/assets/logo-isologo.svg (viewBox 0 0 252 52). Letras \"toon\" = polígonos slab chamfered dibujados a mano (t/o/o/n), gradiente brand #6366f1→#8b5cf6→#a855f7; \"memory\" = <text> system-ui font-size 34 weight 700 fill oklch(56% 0.02 270). Cortes: bisel 45° en esquina top-left y bottom-right de cada letra (chamfer=6, stroke=12, x-height=12..40).\n- SiteHeader.astro: importa logo-isologo.svg, renderiza solo <img class=\"logo-isologo\" alt=\"toon-memory\" aria-label>, se ELIMINÓ el <span class=\"logo-text\">toon-memory</span>.\n- home.css: .logo-isologo { height:26px; width:auto; display:block }, mobile (@media 768) height:22px. Se quitó .logo-icon (28x28).\n- logo.svg ORIGINAL (icono red de nodos) NO se tocó: sigue en favicon (<link rel=\"icon\"> en 8 index.astro) y hero-eyebrow-logo 18x18 en Hero.astro. SiteFooter importa logoSrc pero es import muerto.\n- Generador de las letras: /tmp/opencode/make-logo.mjs (fuera del repo, temporal). Preview: http://localhost:8787/preview.html (python http.server sirviendo /tmp/opencode, temporal).\n- Verificado: chromium headless (header desktop + móvil 390px OK), build docs OK (201 páginas), tsc --noEmit OK.","tags":["landing","header","logo","branding"],"quality":0.89,"accessCount":1,"date":"2026-08-03","file":"","links":["landing-fixes-completed"],"ttl":"","lastAccessed":""},{"id":"hero-auto-sweep","key":"hero-auto-sweep","category":"pattern","content":"Auto-demo del reveal MiMo en el hero: si no hay interacción, un \"sweep\" simula el cursor cruzando el hero de lado a lado (6 waypoints: LR y0.34, giro, RL y0.62, giro, LR y0.4; SWEEP_SPEED 520px/s, wobble senoidal 16px; pausa 2.6s y repite). stampAlong() llama start() internamente. mouseenter/mousemove sobre .hero llaman stopAuto() (auto=false + clearTimeout) → el modo demo muere para siempre al interactuar. Arranca con setTimeout(runSweep, 1500). El script de Hero se externaliza como módulo (/src/components/Hero.astro?astro&type=script) → para comprobar contenido hay que grepear el MÓDULO, no el HTML. ⏳ Superseded (2026-08-03): Auto-sweep eliminado: el usuario no lo quiso (\"nah quita eso no me gusto\"). El reveal queda solo con mouse.","tags":["hero","canvas","auto-sweep","demo","mimo","superseded"],"quality":0.78,"accessCount":1,"date":"2026-08-03","file":"","links":["superseded_by:mimo-reveal-mask"],"ttl":"","lastAccessed":""},{"id":"mimo-reveal-mask","key":"mimo-reveal-mask","category":"pattern","content":"Efecto MiMo Code replicado en el hero: canvas #wallMask relleno del color del fondo (leído en runtime vía canvas scratch 1x1, porque getComputedStyle devuelve oklch no rgb) y tallado con destination-out en mousemove sobre .hero: manchas de tinta (radial 32 segmentos con wobble senoidal) crecen 6→120px y se desvanecen en 520ms, stamps cada 12px del recorrido, max 160, rAF solo mientras hay stamps. Revela una copia brillante de la pared (.wall-layer-reveal, wallA, brand-light opacity .5, --dur:60s) que está DEBAJO del canvas; las capas ambientales (.wall-layer-a/b) van ENCIMA para que el canvas sólido no las apague. Orden DOM: reveal → canvas → a → b (posicionados sin z-index pintan por orden DOM). hover:none y prefers-reduced-motion ocultan canvas+reveal.","tags":["hero","canvas","mimo","reveal","animation"],"quality":0.78,"accessCount":1,"date":"2026-08-03","file":"","links":["supersedes:hero-auto-sweep"],"ttl":"","lastAccessed":""},{"id":"hero-wall-pre-scroll","key":"hero-wall-pre-scroll","category":"bug","content":"Scroll horizontal del hero NO venía del wall-layer (que ya tenía overflow:hidden) sino de la regla GLOBAL pre{overflow-x:auto;background;padding} (home.css:859) que heredaba el pre del muro. Además ese background sólido (--bg-card) tapaba la capa B (texto apenas visible). Fix: .wall-layer pre sobreescribe todo (background:none;border:0;padding:0;overflow:hidden). Opacidades subidas: wall-layer-a .12, wall-layer-b .09.","tags":["hero","scroll","pre","css"],"quality":0.79,"accessCount":1,"date":"2026-08-03","file":"","links":[],"ttl":"","lastAccessed":""},{"id":"hero-term-cursor","key":"hero-term-cursor","category":"pattern","content":"Cursor de terminal parpadeante estilo MiMo Code en el hero: <span class=\"term-cursor\"> tras .term-cmd en Hero.astro. CSS .term-cursor idéntico a .chat-cursor existente (0.55em × 1em, background var(--brand), animation cursorBlink 1s steps(1)); el minificador los fusiona. Añadido .term-cursor{animation:none} al bloque prefers-reduced-motion. Verificado en chromium: parpadea (opacity 1→0), no empuja el botón copy.","tags":["hero","terminal","cursor","mimo"],"quality":0.79,"accessCount":1,"date":"2026-08-03","file":"","links":[],"ttl":"","lastAccessed":""},{"id":"hero-scroll-verified","key":"hero-scroll-verified","category":"knowledge","content":"Scroll horizontal del hero: verificado con chromium headless (playwright-core en /tmp/opencode). Cero overflow en 375/768/1024/1280/1920px; el fix (overflow:hidden en .wall-layer Y .hero-wall) está servido en localhost:4321. html,body tienen overflow-x:clip. No hay 100vw en el código. El scroll que reporta el usuario es casi seguro CSS cacheado → hard reload. Solo hay un dev server (4321). WebKit no testeable (faltan libs del sistema).","tags":["hero","scroll","css","fix"],"quality":0.78,"accessCount":1,"date":"2026-08-03","file":"docs/src/styles/home.css:164","links":[],"ttl":"","lastAccessed":""},{"id":"adr-feature-comparison-5","key":"adr-feature-comparison-5","category":"decision","content":"ADR (Aug 2): comparativa de 5 features — aprobados #3, #2, #1; rechazados #4, #5.\n\nIMPLEMENTADO:\n- #3 pre-edit risk surfacing: hook tool.execute.before en src/cli/opencode-plugin.ts inyecta \"⚠ KNOWN RISKS for <path>:\" (recall category \"warning\", budget tiny) antes de edit/write/patch; re-inyecta post-edit. Helpers risks/pickPath/buildQuery/inject/isEditTool.\n- #2 mode:\"index\" + fetch por ids en memory_recall: renderIndex (1 línea por entry: [n] key (id) · categoria · fecha · % relativo, sin contenido) + fetchEntriesByIds (ids/keys en orden, skip unknown/obsolete/expired, asOf re-incluye superseded). Sin bumpAccessed en index mode (el índice no consume entradas).\n- #1 convención ligera rejected: tag \"rejected\" + key \"rejected-<tema>\" en entries decision (SIN schema nuevo) + docs. Recall de la idea trae la rechazada con motivo; no se re-discute cada sesión.\n\nRECHAZADO (backlog, NO implementar):\n- #4 procedimiento/predict en cli.ts: el CLI es procedural y sync; predict require sentencia persistente y async — no encaja con arquitectura zero-dep/determinista.\n- #5 campo agent/loadout en entries: el grafo ya cubre \"quién\" vía per-agent auto-loading por file path en el plugin; añadir campo rígido no aporta.\n\nFilosofía: sin LLM/embeddings/servidor; .toon local; determinista; token-eficiente. Docs: solo .mdx (sin schema); README aún NO documenta index/ids ni rejected: (pendiente).","tags":["decision","adr","features","recall","index","rejected","plugin"],"quality":0.98,"accessCount":1,"date":"2026-08-02","file":"docs/src/content/docs/features/tools.mdx","links":["docs-astro","toon-format-escape-fields"],"ttl":"","lastAccessed":""},{"id":"init-help-side-effect","key":"init-help-side-effect","category":"bug","content":"`toon-memory init -h` NO mostraba ayuda: ejecutaba un install real. Sin TTY y sin --agent, init() cae en `selected = agents` (TODOS los agentes detectados, src/cli/commands.ts:100) e instala MCP+hooks+instruction files para claude/codex/gemini/cursor/cline/continue/antigravity/aider/zed/windsurf/etc. — efecto colateral grave (modifica configs globales como ~/.config/zed/settings.json y ~/.codeium/windsurf/mcp_config.json, y crea archivos en el proyecto). FIX: setup.ts ahora intercepta -h/--help en la rama init y llama printUsage()+exit 0. Es el mismo bug de clase que `viewer -h` (arreglado en la misma sesión). LECCIÓN: al verificar ayuda con init -h accidentalmente se instaló para todos los agentes en el repo toon-memory y hubo que revertir a mano: borrar configs toon-memory-only, quitar entradas de zed/windsurf global, borrar hook scripts. Verificar `init`/`viewer -h` con `--agent` explícito o capturando salida sin ejecutar.","tags":["cli","init","help","side-effect","bugfix"],"quality":0.88,"accessCount":1,"date":"2026-08-01","file":"src/cli/setup.ts","links":["viewer-port-fallback"],"ttl":"","lastAccessed":"2026-08-03T19:01:09.145Z"},{"id":"viewer-port-fallback","key":"viewer-port-fallback","category":"bug","content":"`toon-memory viewer -h` mostraba \"Port 3000 already in use\" en vez de ayuda: el bin solo maneja -h/--help si es args[0], y la rama viewer de setup.ts ignoraba -h y arrancaba el server. Arreglado: (1) setup.ts maneja `viewer -h/--help` con printViewerUsage() dedicado y exit 0; (2) src/viewer/index.ts añade resolvePort() que valida 1-65535 y error claro para NaN, y auto-fallback de puerto (EADDRINUSE → port+1 hasta MAX_PORT_ATTEMPTS=20, log \"Port N in use, trying N+1...\", mensaje final sugiere `--port` y `PORT`); (3) viewer añadido al HELP raíz de bin/toon-memory.ts. Tests nuevos: viewer -h, viewer --help, --port abc rechazado. Verificado en vivo: 3000 ocupado → sirve en 3002. 318 tests pass, tsc OK.","tags":["viewer","cli","port","bugfix"],"quality":0.78,"accessCount":1,"date":"2026-08-01","file":"src/viewer/index.ts","links":[],"ttl":"","lastAccessed":"2026-08-01T17:30:38.535Z"},{"id":"retrieval-benchmark-v4-1-0","key":"retrieval-benchmark-v4-1-0","category":"decision","content":"v4.1.0 (released 2026-08-01): primer benchmark de retrieval LongMemEval-style sobre corpus real. Artifacts committed: benchmarks/retrieval-corpus.toon (187 entries reales, snapshot 2026-08-01), gold-queries.json (42 queries hand-authored, 6 categorías), retrieval-results.json. El harness mide el pipeline de PRODUCCIÓN (src/lib/graph.ts graphRecallDetailed + src/lib/quality.ts generateSmartRecall) bundleado en memoria con esbuild (data URL) — sin copias fieles. Determinismo: param opcional `today` (utils.isExpiredLocal/importance, graph.graphRecallDetailed, quality.generateSmartRecall) fija recency/decay/TTL; backward-compatible. Read-only (sin bumpAccess). K=5, LIMIT=8. Resultados: linear R@5 0.643/nDCG 0.654/MRR 0.776/answerable 81%; rrf R@5 0.861/nDCG 0.764/MRR 0.788/answerable 97.6%; smart R@5 0.829/nDCG 0.739/MRR 0.760. Se excluyeron 2 entries meta con priority:1 (data-toon-migration-3-entries, toon-format-escape-fields) porque describen el propio data file y dominaban el top-5 de TODAS las queries (rrf nDCG 0.406 con ellas vs 0.764 sin ellas); documentado en la note de gold-queries.json. DOCS (commit 8b5819d): el tile 'Ranking quality' viejo (RRF parity 8 queries sintéticas) fue REEMPLAZADO por el bloque Retrieval unificado, traducido a las 8 locales (en/es/zh/ja/ko/pt-br/de/fr) en docs/src/i18n.ts; sin duplicación (un solo bloque de ranking). pt usa prefijo 'pt-br'. Reproducible: npm run bench:retrieval. Release v4.1.0 vía gh release create → publish.yml (npm ok); docs deploy automático por docs.yml al push a main.","tags":["benchmark","retrieval","v4.1.0","today","release","docs"],"quality":0.98,"accessCount":1,"date":"2026-08-01","file":"benchmarks/retrieval-results.json","links":["docs-benchmarks-tabbed","rrf-fusion-final-design","data-toon-migration-3-entries","toon-format-escape-fields"],"ttl":"","lastAccessed":"2026-08-03T16:41:26.616Z"},{"id":"embed-minimap-fullscreen-bug","key":"embed-minimap-fullscreen-bug","category":"knowledge","content":"Bug minimap del demo (docs/public/viewer/embed.html, generado por scripts/generate-embed.mjs): se bugueaba al entrar en pantalla completa en el modal del home. Causa: (1) el handler de zoom NO llamaba updateMinimap() (el producto src/viewer/html.ts:483 sí) → el rectángulo del viewport quedaba stale al hacer zoom; (2) el embed no escuchaba window.resize → al fullscreenear el modal (CSS .viewer-modal:fullscreen .viewer-modal-frame height:100vh, docs/src/styles/home.css:823) el iframe redimensiona y el minimap + centro del grafo quedaban desincronizados. Fix: updateMinimap() en el zoom + window.addEventListener('resize') debounced (80ms) que llama resize() (recentra force center + sim restart) y updateMinimap(). switchTab ya llamaba graph.resize() (linea 432 del generador).","tags":["viewer","minimap","fullscreen","embed","bug"],"quality":0.77,"accessCount":1,"date":"2026-07-31","file":"","links":[],"ttl":"","lastAccessed":"2026-08-01T04:05:28.632Z"},{"id":"data-toon-migration-3-entries","key":"data-toon-migration-3-entries","category":"knowledge","content":"Migración aplicada a .toon-memory/memory/data.toon (Jul 31): 3 entries tenían contenido multilínea que rompía el pipe-delimited (sus líneas de continuación sin indent se parseaban como 3 entries falsas con keys tipo `release;roadmap;engram;changelog`). Reconstruidas con merge: 51868a40 (release-roadmap-post-engram, 9 líneas), ee732474 (engram-features-implemented, 12 líneas, contiene `|` literales ahora escapados como `\\|`), 0665af4d (mcp-apps-extensions-init-handler, 5 líneas). Header `[185|]` era correcto (185 entries reales; los 3 garbage eran líneas extra). Backup pre-migración en /tmp/data.toon.bak.","tags":[],"quality":0,"accessCount":1,"date":"2026-08-01","file":"","links":[],"ttl":"2029","lastAccessed":"2026-08-03T19:01:09.145Z"},{"id":"graph-single-component-bridge","key":"graph-single-component-bridge","category":"decision","content":"buildGraph (src/lib/graph.ts) ahora garantiza UN único componente conectado: tras el orphan fallback (orphanScore = tags*4 + key*2 + content, tie-break por key), un segundo pase calcula connectedComponents y puentea cada isla a la componente más grande con el par (a,b) de mayor orphanScore. generate-embed.mjs lo espeja EXACTO (fix: antes usaba un `deg` obsoleto en el orphan pass que conectaba el grafo por accidente — ahora usa adjMap en vivo + componente-bridge). Verificado: data.toon migrado (185 entries, 3 multilíneas reconstruidas: release-roadmap-post-engram, engram-features-implemented, mcp-apps-extensions-init-handler) → 1 componente / 0 huérfanos tanto en producto como en demo embed.html.","tags":["graph","buildGraph","orphans","connectivity","viewer"],"quality":0.78,"accessCount":1,"date":"2026-07-31","file":"","links":[],"ttl":"","lastAccessed":"2026-08-01T17:30:38.535Z"},{"id":"toon-format-escape-fields","key":"toon-format-escape-fields","category":"decision","content":"El formato pipe-delimited de data.toon ahora escapa contenido: `\\n`→`\\n` literal, `|`→`\\|`, `\\\\`→`\\\\`. Helpers centrales en src/lib/utils.ts: escField/unescField (single-pass, sin ambigüedad con backslashes) y parseToonLine/toToonLine (toToonLine devuelve línea con indent de 2 espacios). Todo write debe pasar por toToonLine y todo read por parseToonLine — NUNCA `split(\"|\")` directo. mergeEntries (quality.ts), tools.ts (9 sitios), scoring.ts bumpAccessed, session-store.ts (writeSessionEntry/touch/migrate/promote), archive/consolidation/observations/resources/cli reads: convertidos. summaries block también escapa vía escField/unescField. Generador del demo (scripts/generate-embed.mjs) replica el mismo parser con splitToonLine escapado.","tags":[],"quality":0,"accessCount":1,"date":"2026-08-01","file":"","links":[],"ttl":"2029","lastAccessed":"2026-08-03T19:01:09.145Z"},{"id":"docs-benchmarks-tabbed","key":"docs-benchmarks-tabbed","category":"decision","content":"Docs home benchmarks consolidados en UNA sección tabbed (Benchmarks.astro, id=\"benchmarks\") con 3 pestañas: Ranking (tabla Linear vs RRF nDCG/MRR paridad 0.776/0.917, 8 gold queries, npm run bench:rrf), Workflow (5 ahorros de sesión en tarjetas compactas), Formato (barras JSON vs TOON + 3 stats). Se eliminaron ImpactShowcase.astro y TokenSavings.astro (fusión en pestañas). Card RRF del WhatNew perdió los números. i18n: keys tokenSavings/impactSection reemplazadas por benchmarks.{tabs,ranking,workflow,format} en 8 locales. Commit 2e8be8e.","tags":["docs","benchmark","rrf","i18n"],"quality":0.89,"accessCount":1,"date":"2026-07-31","file":"","links":["v3-7-0-released"],"ttl":"","lastAccessed":"2026-08-01T04:07:24.176Z"},{"id":"mcp-registry-cache-lag","key":"mcp-registry-cache-lag","category":"knowledge","content":"The MCP Registry search endpoint `GET /v0/servers?search=toon-memory` (no version filter) serves a stale CDN-cached copy (showed 3.6.1 for ~5+ min after publish). To verify the live version, query `?version=latest` (or `?version=X.Y.Z`) — those returned 3.7.0 immediately. The publish API itself confirmed \"✓ Server io.github.LuiggiVal08/toon-memory version 3.7.0\".","tags":["mcp-registry","verification","release"],"quality":0.79,"accessCount":1,"date":"2026-07-31","file":"","links":[],"ttl":"","lastAccessed":"2026-08-01T17:30:38.668Z"},{"id":"v3-7-0-released","key":"v3-7-0-released","category":"knowledge","content":"v3.7.0 published: commit 81f3a3d on main, release/tag v3.7.0, npm `toon-memory@3.7.0` live, MCP Registry `io.github.LuiggiVal08/toon-memory` v3.7.0 = latest (description \"40 tools\"). Publish workflow (3 parallel jobs: build guard → npm + MCP Registry) all green, run 30656554816.","tags":["release","v3.7.0","npm","mcp-registry"],"quality":0.99,"accessCount":1,"date":"2026-07-31","file":"","links":["publish-workflow-parallel-jobs","rrf-fusion-final-design"],"ttl":"","lastAccessed":"2026-08-01T17:30:38.668Z"},{"id":"publish-workflow-parallel-jobs","key":"publish-workflow-parallel-jobs","category":"decision","content":"PUBLISH WORKFLOW (.github/workflows/publish.yml) refactorizado a 3 jobs: (1) `build` — checkout, npm ci, build, test, guard \"package.json version == release tag\" (cazaría el error del doble v3.6.0), npm pack, upload artifact `npm-package` (tgz); (2) `publish-npm` needs:build — setup-node con registry-url, download artifact, `npm publish --provenance --access public ./package/*.tgz` (publicar un tarball NO re-ejecuta prepublishOnly=build+test, verificado en docs npm: solo corre al publicar desde el directorio); (3) `publish-mcp-registry` needs:build — checkout, mcp-publisher login github-oidc (id-token:write), jq set version en server.json desde GITHUB_REF, publish. Ambos publish jobs son independientes entre sí (comparten solo el gate de build) — un fallo en uno no bloquea al otro. Publish del MCP registry: mcp-publisher solo sube server.json, no valida que el paquete npm exista → el orden npm→MCP no es requisito. Historial de fallos: v3.6.0 doble tag → npm 403 \"cannot publish over previously published versions\"; v3.6.0/v3.5.0 → MCP 422 \"expected length <= 100\" en server.json.description (arreglado acortando desc). server.json requiere descripcion <=100 chars. Usar npm ci (no npm install) para reproducibilidad. ⏳ Superseded (2026-08-03): The MCP registry now validates the npm version exists; publish-mcp-registry must wait for npm publish + propagation (proven by the v4.3.1 400 error)","tags":["ci","workflow","publish","npm","mcp-registry","superseded"],"quality":0.88,"accessCount":1,"date":"2026-07-31","file":"","links":["competitive-roadmap-2026-07","superseded_by:publish-mcp-registry-needs-npm"],"ttl":"","lastAccessed":"2026-08-01T17:30:38.668Z"},{"id":"rrf-fusion-final-design","key":"rrf-fusion-final-design","category":"decision","content":"DISEÑO FINAL de RRF (benchmark scripts/bench-rrf.mjs decidió la variante). Fusion = rrfFuse([bm25Rank, bm25Rank, bm25Rank, centRank], rrfK(n)) con rrfK(n)=clamp[3,60] de round(sqrt(n)). IMPORTANCE se EXCLUYÓ de la fusión: en grafos pequeños su rank está dominado por ruido de recencia y arrastra el nDCG (variantes probadas: bbci=0.725, bbccci=0.648, bbbci=0.775, bbbc=0.776 PARITY). Resultado con 8 queries gold-fair: RRF nDCG 0.776 = linear 0.776, MRR 0.917 = 0.917 (1 win/1 loss/6 ties). El seedRank/exact-match ranker también se eliminó (stopwords lo volvían ruidoso). Se replicó por igual en src/lib/graph.ts (graphRecallDetailed) y src/lib/quality.ts (generateSmartRecall). k=60 textbook aplana ranks en grafos pequeños → adaptive k=√N. package.json ahora tiene \"bench:rrf\": \"node scripts/bench-rrf.mjs\".","tags":["rrf","benchmark","graph","retrieval"],"quality":0.88,"accessCount":1,"date":"2026-07-31","file":"scripts/bench-rrf.mjs:1","links":["competitive-roadmap-2026-07"],"ttl":"","lastAccessed":"2026-08-01T04:07:24.176Z"},{"id":"competitive-roadmap-2026-07","key":"competitive-roadmap-2026-07","category":"decision","content":"Competitive roadmap approved (Jul 2026). ADOPTED (all 6): (1) typed edges in links (type:key, backward-compatible), (2) RRF fusion flag in recall, (3) deterministic memory_reflect (tag co-occurrence, contradictions, hubs), (4) memory_supersede + as_of, (5) MCP tool annotations (readOnlyHint/destructiveHint) on all tools, (6) heuristic auto-promote from capture log (drafts, confidence ≤0.65, opt-in). PLUS: publish a real retrieval benchmark (LongMemEval-style on our own data) to close the only numeric gap vs MemPalace/Hindsight/Zep. DEFERRED (maybe later, re-evaluate): local Markdown/notes importer (idea #6 from Basic Memory two-way) — user not attracted to it now; revisit in future sessions.","tags":["roadmap","competitive","decision","philosophy"],"quality":0.89,"accessCount":1,"date":"2026-07-31","file":"","links":["competitive-analysis-2026-07"],"ttl":"","lastAccessed":"2026-08-03T16:41:26.616Z"},{"id":"competitive-analysis-2026-07","key":"competitive-analysis-2026-07","category":"knowledge","content":"Competitive analysis vs Mem0, Supermemory, Basic Memory, MemPalace, Hindsight, Zep (Jul 2026). Our edges: TOON -22.5% tokens, zero runtime deps, no LLM/cloud, deterministic, 15-agent hooks, quality+confidence, TTL, pin, sessions, context_* tools, budget recall. Their edges: semantic/LLM retrieval accuracy (MemPalace 96.6% R@5 LongMemEval), auto-ingestion of conversations, two-way human-readable Markdown (Basic Memory), typed graph relations (Basic Memory/MemPalace), fact invalidation + temporal queries (Zep/MemPalace), reflect/synthesis (Hindsight), MCP tool annotations (Basic Memory), RRF+rerank (Hindsight). Adoptable without breaking philosophy: typed edges in links (type:key), RRF fusion flag in recall, deterministic memory_reflect, memory_supersede + as_of, MCP annotations on 37 tools, local markdown/notes importer (one-way), heuristic auto-promote from capture log (drafts, low confidence). Deliberately NOT copying: cloud/LLM extraction, remote embeddings (violates zero-deps). Gap: we have no public retrieval benchmark.","tags":["competitive","analysis","roadmap","philosophy"],"quality":0.99,"accessCount":1,"date":"2026-07-31","file":"","links":["bm25-vs-embeddings-decision","no-cloud-decision","zero-deps-philosophy"],"ttl":"","lastAccessed":"2026-08-01T04:07:24.176Z"},{"id":"release-roadmap-post-engram","key":"release-roadmap-post-engram","category":"knowledge","content":"Post-implementation roadmap for engram features:\n1. Update README.md with new features (path_scope, budget, origin, soft-delete, resolve/suppress tools)\n2. Update docs/ (Astro site) — tool docs, TOON format changes, new params\n3. Update compromised sections of home page in all languages (en, es, etc.)\n4. Update manifests (package.json version, etc.)\n5. Atomic commits per convention (feat:, fix:, docs:, etc.)\n6. Push changes to remote\n7. Create new git tag with bumped version\n8. Create new GitHub release","tags":["release","roadmap","engram","changelog"],"quality":0.79,"accessCount":1,"date":"2026-07-30","file":"","links":[],"ttl":"","lastAccessed":""},{"id":"new-tools-usage","key":"new-tools-usage","category":"pattern","content":"New tools added: memory_resolve (restore soft-deleted entries), memory_suppress (mark obsolete). memory_forget now soft-deletes by default; use hard:true for permanent deletion.","tags":["tools","soft-delete","usage"],"quality":0.8,"accessCount":1,"date":"2026-07-30","file":"","links":[],"ttl":"","lastAccessed":"2026-07-31T11:58:32.180Z"},{"id":"engram-features-implemented","key":"engram-features-implemented","category":"knowledge","content":"Implemented 6 features inspired by Engram into toon-memory:\n1. **Path Scoping** (graph.ts: `path_scope` field 14): Entries can be scoped to file paths via glob patterns. `memory_remember` accepts `path_scope`. `memory_recall`/`memory_search` filter by `path_scope`. Added `globMatch()` helper.\n\n2. **Budget Control** (graph.ts: renderCompact): Replaced simple `compact` boolean with `budget: \"tiny\"|\"normal\"|\"deep\"`. `tiny` = key+1 line (~50 tokens), `normal` = compact with tags/edges, `deep` = all fields. Backward compatible with `compact: true`.\n\n3. **Origin Separation** (graph.ts: `origin` field 15, quality.ts): Entries track `human|agent|inferred` origin. qualityScore gives +0.1 for human, -0.05 for inferred. `memory_stats` shows origin breakdown.\n\n4. **Proactive Recall** (opencode-plugin.ts): `tool.execute.after` enhanced to also recall by tool name keywords when no file path is found. Uses `budget: \"tiny\"` for token efficiency.\n\n5. **Soft-delete** (tools.ts memory_forget/memory_resolve/memory_suppress): `memory_forget` soft-deletes by default (sets `status=obsolete`). `memory_resolve` restores. `memory_suppress` marks obsolete. Added `hard: true` flag for permanent deletion. `graphRecallDetailed` filters obsolete entries.\n\n6. **Enhanced Lint** (context.ts health): Missing-evidence check (path_scope without file). Stale-claims check (overlapping content in same category). Origin breakdown in overview. Status tracking in stats.","tags":["engram","path-scope","budget","proactive-recall","soft-delete","lint"],"quality":0.79,"accessCount":1,"date":"2026-07-30","file":"src/lib/graph.ts:21, src/mcp/tools.ts:26, src/lib/quality.ts:29, src/lib/context.ts:482, src/cli/opencode-plugin.ts:62","links":[],"ttl":"","lastAccessed":""},{"id":"mcp-apps-extensions-init-handler","key":"mcp-apps-extensions-init-handler","category":"architecture","content":"Added MCP Apps protocol support by overriding the initialize handler in server.ts:\n1. Set `capabilities.experimental` with `io.modelcontextprotocol/ui: {}` in McpServer constructor options\n2. Override `server.server.setRequestHandler(InitializeRequestSchema, ...)` to include `extensions: { \"io.modelcontextprotocol/ui\": {} }` in InitializeResult\n3. Migrated from `@modelcontextprotocol/server` to `@modelcontextprotocol/sdk` (same API, official package)\n4. The SDK still only supports protocol version 2025-11-25, but the extensions field is added to the response for MCP Apps negotiation","tags":["mcp-apps","extensions","initialize","protocol"],"quality":0.98,"accessCount":1,"date":"2026-07-30","file":"src/mcp/server.ts:15-30","links":["viewer-mcp-apps-integration","session-store-details","esbuild-vs-tsc-decision"],"ttl":"","lastAccessed":""},{"id":"viewer-mcp-apps-integration","key":"viewer-mcp-apps-integration","category":"decision","content":"MCP Apps integration for the viewer: registered `ui://viewer` resource that generates the D3.js force-directed graph HTML with live data, and `memory_visualize` tool with `_meta.ui.resourceUri` pointing to it. The tool accepts an optional `query` parameter. `buildViewerData()` now returns empty data instead of `process.exit(0)` for empty memory. Resource is served dynamically — each request builds fresh data. Viewer reload button uses `location.reload()` which re-fetches the `ui://` resource in MCP Apps hosts. Total tools: 30, total resources: 4.","tags":["viewer","mcp-apps","ui","decision"],"quality":0.98,"accessCount":1,"date":"2026-07-29","file":"src/mcp/resources.ts","links":["viewer-html-generation","viewer-data-flow","resources-registration"],"ttl":"","lastAccessed":""},{"id":"viewer-live-observations-bridge","key":"viewer-live-observations-bridge","category":"knowledge","content":"Live mode watchea todo MEMORY_DIR (data.toon + observations.toon). Observations registran cada tool call del agente (recall, remember, stats, etc.). Al cambiar observations.toon, el server re-construye ViewerData y envía SSE aunque data.toon no haya cambiado. El badge LIVE parpadea en verde para mostrar actividad.","tags":["viewer","live","sse","observations","bridge"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/server.ts","links":["viewer-serve-mode","viewer-static-snapshot","observations-module","viewer-serve-mode","session-auto-promotion-details","viewer-html-generation"],"ttl":"","lastAccessed":"2026-07-29T17:18:16.367Z"},{"id":"viewer-sidebar-graph-sync","key":"viewer-sidebar-graph-sync","category":"pattern","content":"Pattern: viewer connector between sidebar entry list and graph uses the selectEntry() function which sets selectedEntry global, re-renders entry list (adds .selected class), shows detail panel via showDetail(), highlights the node in the graph via graph.highlightNode(), switches to the Detail tab. Clicking on a graph node does the same via the node click handler.","tags":["pattern","viewer","selection","sync","sidebar-graph"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["sidebar-entry-list-pattern","viewer-data-flow","viewer-css-variable-pattern"],"ttl":"","lastAccessed":"2026-08-01T03:59:14.993Z"},{"id":"viewer-data-flow","key":"viewer-data-flow","category":"architecture","content":"Architecture: viewer data flow starts in buildViewerData() which reads .toon memory, parses entries, builds the graph, and returns structured ViewerData (nodes, edges, categories, tagCounts, totalEntries). The data is serialized to JSON and injected into the HTML template. On the client side, DATA is parsed once and used by all panels: graph (D3 force layout), stats (category/tag charts), timeline (date groups), detail (entry metadata).","tags":["architecture","viewer","data-flow","json","serialization"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/data.ts","links":["viewer-html-generation","viewer-tabs-system","cli-setup-routing"],"ttl":"","lastAccessed":"2026-08-01T17:30:38.535Z"},{"id":"viewer-tooltip-design","key":"viewer-tooltip-design","category":"decision","content":"Decision: viewer uses pointer-events:none on tooltips to prevent them from intercepting mouse events. The tooltip is a fixed-position div that follows the cursor via mousemove listener. Position calculation flips the tooltip to the left if it would overflow the viewport. This approach is simpler than a CSS-only tooltip and allows rich HTML content (colored spans, tag chips).","tags":["decision","viewer","tooltip","ux","interaction"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["sidebar-resizer-layout-bug","viewer-css-variable-pattern","viewer-theme-toggle"],"ttl":"","lastAccessed":"2026-07-31T20:46:46.935Z"},{"id":"viewer-css-variable-pattern","key":"viewer-css-variable-pattern","category":"pattern","content":"Pattern: viewer uses CSS custom properties (--sidebar-w, --bg, --text, --brand, etc.) for all dynamic styling. This enables theme switching via .light class toggling CSS variable values, sidebar resize by updating --sidebar-w, consistent color usage across all components. The approach avoids JS-driven style changes and keeps all visual logic in CSS.","tags":["pattern","viewer","css-variables","theming","design"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-theme-toggle-pattern","sidebar-resizer-layout-bug","viewer-theme-toggle"],"ttl":"","lastAccessed":"2026-07-29T13:08:53.050Z"},{"id":"viewer-node-edge-sizing","key":"viewer-node-edge-sizing","category":"architecture","content":"Architecture: viewer node sizing uses a formula based on accessCount: radius = 4 + min(accessCount * 0.8, 8). This means nodes range from 4px (never accessed) to 12px (max). Edge thickness also varies: width = 0.5 + min(shared connections * 0.3, 3), where shared connections is the smaller of the two nodes' connection counts. Both formulas cap growth to prevent visual distortion.","tags":["architecture","viewer","sizing","radius","visualization"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-edge-thickness","graph-node-radius","graph-bfs-traversal"],"ttl":"","lastAccessed":"2026-07-29T13:07:40.627Z"},{"id":"viewer-zoom-controls","key":"viewer-zoom-controls","category":"knowledge","content":"Knowledge: viewer zoom controls implement D3 zoom behavior with scaleExtent [0.1, 4]. Three buttons: zoom in (1.5x), zoom out (0.67x), reset (identity). The zoom is applied to a g wrapper element, not the SVG itself, so UI overlay elements (controls, legend, minimap) stay fixed. reset uses d3.zoomIdentity for a clean transition back to the initial state.","tags":["knowledge","viewer","zoom","controls","d3"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","viewer-physics-controls","viewer-force-graph"],"ttl":"","lastAccessed":"2026-07-29T13:08:53.050Z"},{"id":"viewer-highlight-system","key":"viewer-highlight-system","category":"architecture","content":"Architecture: viewer node highlight system provides 3 interaction modes: node hover (mouseover shows tooltip + highlights neighbors), node click (selects entry + switches to detail tab), and search/filter mode (matches by id/content/tags + category filter). Highlight types: hover highlights neighbors with increased radius + opacity fade for non-neighbors, selected gets glow + brand stroke, search dims non-matches to 0.08 opacity.","tags":["architecture","viewer","highlight","selection","search"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-node-radius","graph-glow-effect","sidebar-entry-list-pattern"],"ttl":"","lastAccessed":"2026-07-29T13:07:40.627Z"},{"id":"viewer-detail-panel","key":"viewer-detail-panel","category":"architecture","content":"Architecture: viewer detail panel shows full entry metadata: category badge (colored), key/title, content (monospace block), file link (if any), date, quality score (brand colored, bold), access count, TTL (if set), last accessed date, tags as chips, and linked entries as clickable pills. Clicking a linked entry navigates to that entry via selectEntryById() which is exposed as a global function.","tags":["architecture","viewer","detail","metadata","links"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["toon-file-format-details","viewer-timeline-panel","sidebar-entry-list-pattern"],"ttl":"","lastAccessed":"2026-07-29T13:08:14.062Z"},{"id":"viewer-timeline-panel","key":"viewer-timeline-panel","category":"architecture","content":"Architecture: viewer timeline panel groups entries by date in reverse chronological order. Each timeline entry shows date, category badge (colored left border), key, and content preview (100 chars). Clicking navigates to the entry's detail. A vertical line (timeline-line) connects entries visually. Entries without dates are grouped under 'unknown'. Timeline-header shows total count.","tags":["architecture","viewer","timeline","chronological"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["sidebar-entry-list-pattern","viewer-stats-panel","toon-file-format-details"],"ttl":"","lastAccessed":"2026-08-03T14:31:42.419Z"},{"id":"viewer-stats-panel","key":"viewer-stats-panel","category":"architecture","content":"Architecture: viewer topic rendering - the stats panel shows bar charts for category distribution and a tag cloud for top 20 tags. Category bars use the COLORS map for fill colors and animate width via CSS transition (0.6s cubic-bezier). Tag cloud pills show count in parentheses. Stats also show total entries, edge count, average quality, and max access count in big stat cards.","tags":["architecture","viewer","stats","charts","visualization"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-html-generation","sidebar-entry-list-pattern","cli-setup-routing"],"ttl":"","lastAccessed":"2026-07-29T13:08:14.062Z"},{"id":"viewer-physics-controls","key":"viewer-physics-controls","category":"decision","content":"Decision: viewer physics sliders use HTML range inputs with live updates. Three controls: Charge (-300 to 0, default -120), Link Distance (20 to 200, default 70), Center Strength (0 to 1, default 0.05). Changes update the simulation forces and restart with alpha 0.5. Panel toggled via button. This lets users fine-tune the layout without needing to understand D3 force parameters.","tags":["decision","viewer","physics","ux","interaction"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-physics-controls","viewer-force-graph","graph-force-layout"],"ttl":"","lastAccessed":"2026-07-29T13:27:24.420Z"},{"id":"viewer-tabs-system","key":"viewer-tabs-system","category":"knowledge","content":"Knowledge: viewer tabs system - 4 tabs (Graph, Stats, Timeline, Detail). Tabs use data-tab attributes to match with panel IDs (#panel-graph, #panel-stats, etc.). Only the active tab-panel is visible (display:block). Switching tabs triggers graph.resize() if switching to the graph tab (to recalculate layout after the panel becomes visible and has dimensions). switchTab() helper function handles tab switching.","tags":["knowledge","viewer","tabs","panel","navigation"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-keyboard-shortcuts","viewer-html-generation","viewer-standalone"],"ttl":"","lastAccessed":"2026-07-29T13:10:26.720Z"},{"id":"viewer-theme-toggle-pattern","key":"viewer-theme-toggle-pattern","category":"pattern","content":"Pattern: theme toggle stores preference in localStorage (key: 'toon-viewer-theme'). Dark theme uses dark background with brand purple. Light theme swaps to light background. Toggle button cycles icons. CSS variables handle all color references, so a single .light class toggle updates the entire page. Tooltips get adjusted backdrop-filter in light mode.","tags":["pattern","viewer","theme","dark","light","localstorage"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-theme-toggle","d3-graph-viewer","viewer-standalone"],"ttl":"","lastAccessed":"2026-07-29T13:08:53.050Z"},{"id":"sidebar-entry-list-pattern","key":"sidebar-entry-list-pattern","category":"pattern","content":"Pattern: entry viewer sidebar renders the entry list with filtering and search. Filter buttons for each category (decision/bug/pattern/knowledge/architecture) plus 'All'. Search input filters by id, content, or tags. Entries show category badge, key, content preview (2 lines), and tag chips. Clicking selects the entry and switches to Detail tab. Selected entries get .selected class with brand border.","tags":["pattern","viewer","sidebar","filter","search"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["toon-file-format-details","entry-linking-patterns","shared-tag-auto-linking"],"ttl":"","lastAccessed":"2026-07-29T17:18:16.367Z"},{"id":"skills-architecture","key":"skills-architecture","category":"architecture","content":"Architecture: the skills directory contains skill definitions for agent workflows. skills/toon-memory.md is the main skill that teaches agents how to use toon-memory effectively. Skills are loaded by the agent via the skill tool when a task matches the skill description. Each skill has a name, description (used for matching), and location (path to SKILL.md with instructions).","tags":["architecture","skills","workflows","agents"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"skills/","links":["observations-module","lock-file-mechanism","config-writer-architecture"],"ttl":"","lastAccessed":""},{"id":"codebase-memory-mcp-integration","key":"codebase-memory-mcp-integration","category":"architecture","content":"Architecture: codebase-memory-mcp integration via auto-loaded rules file auto-loads the codebase knowledge graph for structural code queries. It augments traditional grep/glob with graph-based search (search_graph, trace_path, get_code_snippet, query_graph). The codebase graph indexes LSP call/usage resolution and provides cross-referencing. Used together with toon-memory for comprehensive context.","tags":["architecture","codebase","graph","mcp","opencode"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/cli/agents.ts","links":["esbuild-build-pipeline","consolidation-module","session-auto-promotion-details"],"ttl":"","lastAccessed":"2026-07-31T11:58:32.180Z"},{"id":"scoring-access-tracking","key":"scoring-access-tracking","category":"architecture","content":"Architecture: scoring module in src/mcp/scoring.ts provides entry relevance scoring. findRelatedEntries() finds entries related to a given query by checking tags, content overlap, and links. bumpAccessed() increments the accessCount and updates lastAccessed timestamp when an entry is recalled. Access tracking is persisted to the .toon file on every recall. Used by memory_recall and memory_smart_recall.","tags":["architecture","scoring","relevance","access-tracking"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/scoring.ts","links":["drift-detection","git-integration","quality-access-tracking"],"ttl":"","lastAccessed":"2026-07-30T16:13:07.557Z"},{"id":"session-store-details","key":"session-store-details","category":"architecture","content":"Architecture: session store in src/mcp/session-store.ts manages agent session lifecycle. createSession() records a new session with branch, start time, and empty file list. touchSession() updates the last-seen timestamp. addSessionFile() records files touched during the session. getSessions() lists active sessions. Supports conflict detection by comparing file sets between sessions on different branches.","tags":["architecture","session","store","lifecycle"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/session-store.ts","links":["session-start-hook","session-pruning-pattern","session-store-architecture"],"ttl":"","lastAccessed":"2026-07-30T16:13:07.203Z"},{"id":"consolidation-module","key":"consolidation-module","category":"architecture","content":"Architecture: consolidation module in src/mcp/consolidation.ts provides content deduplication. consolidateEntries() removes entries with identical content (keeps the one with the highest quality score). mergeSimilar() uses Jaccard similarity > 0.5 to find near-duplicates and merge them. Both operations create backups before modifying data. Used by memory_consolidate and memory_merge_similar tools.","tags":["architecture","consolidation","dedup","merge"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/consolidation.ts","links":["near-duplicate-detection","consolidation-algorithm","archive-module"],"ttl":"","lastAccessed":"2026-07-31T11:58:32.180Z"},{"id":"observations-module","key":"observations-module","category":"architecture","content":"Architecture: observations module in src/mcp/observations.ts manages the observation log. readObservations() reads observations.toon, writeObservation() appends a new observation. Each observation has: tool (name of tool that was called), file (file being operated on), timestamp (ISO date). The module also handles auto-pruning at 500 entries. Observations are stored in the same TOON format as memory entries.","tags":["architecture","observations","log","capture"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/observations.ts","links":["observation-auto-prune","capture-hook-architecture","session-auto-promotion-details"],"ttl":"","lastAccessed":"2026-07-29T13:27:24.420Z"},{"id":"entry-id-generation","key":"entry-id-generation","category":"architecture","content":"Architecture: entry IDs use format 'XXXXXXXX' (8 hex chars) generated from timestamp + random. generateId() takes the current Unix timestamp in ms, converts to hex (last 6 chars), and appends 2 random hex chars. This gives ~65K unique IDs per millisecond without collisions. IDs are short (8 chars) for token efficiency but not meant to be human-readable.","tags":["architecture","id","generation","hex","unique"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/entries.ts","links":["entries-module","toon-format-decision","lock-file-mechanism"],"ttl":"","lastAccessed":""},{"id":"lock-file-mechanism","key":"lock-file-mechanism","category":"architecture","content":"Architecture: lock file (.toon-memory/memory/.lock) uses a format with PID@hostname and timestamp. acquireLock() writes this file using writeFileSync (atomic on most OS for small files). If the file exists and is older than 5 seconds, it's considered stale and overwritten (deadlock recovery). Locks are released explicitly by releaseLock() or cleaned up on process exit.","tags":["architecture","lock","concurrency","atomic","deadlock"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/lock.ts","links":["file-locking-pattern","drift-detection","session-pruning-pattern"],"ttl":"","lastAccessed":""},{"id":"i18n-and-localization","key":"i18n-and-localization","category":"knowledge","content":"Knowledge: i18n is handled through 8 translated README files (README.es.md, README.de.md, README.fr.md, README.ja.md, README.ko.md, README.pt-br.md, README.zh.md). The docs site has its own i18n via Astro's built-in i18n support. CLI messages and tool descriptions are in English only. The AGENTS.md allows the agent to respond in the user's language (Spanish in this case).","tags":["knowledge","i18n","languages","readme","docs"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"README.es.md","links":["docs-site-architecture","mcp-tool-error-handling","memory-io-layer"],"ttl":"","lastAccessed":"2026-07-29T13:06:36.814Z"},{"id":"project-constants","key":"project-constants","category":"knowledge","content":"Knowledge: project constants in src/cli/constants.ts defines projectRoot (resolved from package.json location or CWD), editorConfig paths, and version string. Used by all modules that need filesystem paths. The projectRoot discovery walks up directories looking for package.json or .toon-memory directory. Falls back to process.cwd().","tags":["knowledge","constants","paths","project-root"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/constants.ts","links":["memory-io-layer","context-generation-tools","backup-rotation-pattern"],"ttl":"","lastAccessed":"2026-07-29T17:18:16.367Z"},{"id":"capture-hooks-per-agent","key":"capture-hooks-per-agent","category":"knowledge","content":"Knowledge: capture hooks are stored per-agent-framework in each agent's config directory. OpenCode uses .opencode/rules/, Claude Code uses CLAUDE.md, Cursor uses .cursorrules, Continue uses .continuerc, Gemini uses .gemini/config/*.md. Each config installs the capture binary (dist/cli/capture.js) as a tool_use hook. The binary writes observations to observations.toon when a tool is invoked.","tags":["knowledge","capture","hooks","agents","config"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/cli/config-writer.ts","links":["agent-framework-integration","agents-module","config-writer-architecture"],"ttl":"","lastAccessed":"2026-08-03T18:37:27.514Z"},{"id":"viewer-static-snapshot","key":"viewer-static-snapshot","category":"knowledge","content":"Knowledge: the viewer receives data as an injected JSON blob (const DATA = ${jsonData}) at HTML generation time. It does NOT fetch from any API or read the .toon file. This means the viewer is a static HTML snapshot, not a live view, it works offline with no server, to refresh you regenerate. The --serve flag wraps the same HTML in a basic HTTP server. --live flag adds SSE for auto-refresh.","tags":["knowledge","viewer","static","offline","architecture"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-html-generation","no-cloud-decision","prompts-ts-error"],"ttl":"","lastAccessed":"2026-07-31T11:58:32.180Z"},{"id":"drift-detection","key":"drift-detection","category":"knowledge","content":"Knowledge: drift detection compares lastAccessed date against git file modification times. If a memory entry references a file and that file has been modified more recently than the entry was accessed, the entry is flagged as potentially stale. Quality score is reduced by up to 0.15 for drifted entries. Detected during smart_recall and context generation.","tags":["knowledge","drift","stale","quality","git"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["git-integration","toon-file-format-details","toon-format-decision"],"ttl":"","lastAccessed":"2026-07-29T13:13:30.218Z"},{"id":"session-auto-promotion-details","key":"session-auto-promotion-details","category":"knowledge","content":"Knowledge: session promotion automatically promotes observations accessed 3+ times in a session to permanent memory entries. Tracked via session access map. Happens on session end or periodically. Prevents loss of frequently-used transient knowledge. The promotion uses memory_remember with the observation content, auto-assigning a key from the tool name and file path.","tags":["knowledge","session","promotion","auto","transient"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/session-store.ts","links":["session-auto-promotion","file-locking-pattern","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":"2026-07-30T16:13:07.203Z"},{"id":"context-generation-tools","key":"context-generation-tools","category":"knowledge","content":"Knowledge: context generation in src/lib/context.ts produces structured output for context_* tools. context_brief returns relevant memory + active sessions + project health. context_generate returns full system prompt with project info (from package.json), git state (branch, recent commits), relevant memory entries, and active sessions. context_focus returns hyper-focused data for a specific symbol/task including related files and tests.","tags":["knowledge","context","generation","structured"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/context.ts","links":["token-efficient-context","context-brief-architecture","benchmark-scripts"],"ttl":"","lastAccessed":"2026-07-29T17:18:16.367Z"},{"id":"git-integration","key":"git-integration","category":"knowledge","content":"Knowledge: git integration in src/lib/git.ts provides fileMtimes() to check when files were last modified via git. Used for drift detection in quality scoring. If a file has been modified by the user but the memory entry hasn't been updated, quality decreases. Also checks git log for recency signals. Integration uses execSync to run git commands.","tags":["knowledge","git","drift","quality","mtime"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/git.ts","links":["session-start-hook","no-cloud-decision","jsonl-format"],"ttl":"","lastAccessed":""},{"id":"deterministic-graph-algorithms","key":"deterministic-graph-algorithms","category":"pattern","content":"Pattern: all graph algorithms (centrality, BM25, BFS) are deterministic with no randomness. Centrality uses degree centrality (number of connections). BM25 uses fixed k1=1.5, b=0.75. Sort for tiebreaking uses consistent key ordering. This ensures the same query always returns the same results, critical for reproducible agent behavior.","tags":["pattern","graph","deterministic","reproducibility"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-bfs-traversal","shared-tag-auto-linking","mcp-tool-error-handling"],"ttl":"","lastAccessed":""},{"id":"graph-bfs-traversal","key":"graph-bfs-traversal","category":"pattern","content":"Pattern: graph traversal uses BFS for shortest path (memory_graph_path) and neighbor expansion (graph recall mode). Shortest path uses a standard queue-based BFS with visited set, returning the path as array of entry keys. Graph recall does 1-hop or 2-hop expansion from seed nodes, returning the subgraph with edges. Both are O(V+E) on the memory graph.","tags":["pattern","graph","bfs","shortest-path","traversal"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-recall-algorithm","graph-centrality-algorithm","entry-linking-patterns"],"ttl":"","lastAccessed":""},{"id":"entry-linking-patterns","key":"entry-linking-patterns","category":"pattern","content":"Pattern: entries also link via explicit links field and [[wiki refs]] in content. parseEntries() extracts both. Explicit links are stored as array in the entry. Wiki refs are parsed from content using regex /\\[\\[([^\\]]+)\\]\\]/g. All link types (explicit, wiki, shared-tag) are merged into the graph adjacency list for unified traversal.","tags":["pattern","graph","links","wiki","parsing"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["shared-tag-auto-linking","graph-edge-types","utils-module"],"ttl":"","lastAccessed":"2026-07-31T21:11:49.729Z"},{"id":"shared-tag-auto-linking","key":"shared-tag-auto-linking","category":"pattern","content":"Pattern: entries auto-link when they share 2+ tags. buildGraph() in graph.ts iterates all entry pairs and adds an edge if they share >= 2 tags. Skip optimization: entries with 0-1 tags are skipped from the outer loop since they cannot match the threshold. This O(n²) algorithm runs on every build but is fast enough for <500 entries.","tags":["pattern","graph","edges","tags","auto-link"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["near-duplicate-detection","entries-module","benchmark-graph-mismatch"],"ttl":"","lastAccessed":"2026-07-31T21:11:49.729Z"},{"id":"viewer-css-duplicates","key":"viewer-css-duplicates","category":"bug","content":"Bug: viewer CSS had a duplicate .timeline-entry rule and a duplicate .graph-container svg rule. The grid background pseudoelement was rendered below the SVG due to z-index stacking. These were cosmetic but caused redundant CSS.","tags":["bug","viewer","css","duplicate","cosmetic"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["sidebar-resizer-layout-bug","d3js-viewer-decision","viewer-serve-exit-bug"],"ttl":"","lastAccessed":"2026-08-02T17:16:51.537Z"},{"id":"prompts-ts-error","key":"prompts-ts-error","category":"bug","content":"Bug: TS error in prompts.ts - a pre-existing type error unrelated to the viewer/system changes. Error was already present before any edits. Does not block build (esbuild doesn't type-check) but fails npx tsc --noEmit. Needs separate fix: type annotation mismatch in the prompts definitions.","tags":["bug","typescript","type-error","preexisting"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/prompts.ts","links":["esbuild-vs-tsc-decision","mcp-tool-error-handlin
