g","build-order-race"],"ttl":"","lastAccessed":"2026-08-02T17:16:51.537Z"},{"id":"build-order-race","key":"build-order-race","category":"bug","content":"Bug: Build had implicit dependency order (bin -> mcp -> cli) but the build script used Promise.all originally, causing race conditions where mcp/server.js was referenced before being built. Fix: changed to sequential && chaining to guarantee build order. Also discovered that src/mcp/server.ts imports from lib/ which must be resolved before bundling.","tags":["bug","build","race","order","sequential"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["benchmark-graph-mismatch","viewer-serve-exit-bug","npm-dependencies"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.060Z"},{"id":"benchmark-graph-mismatch","key":"benchmark-graph-mismatch","category":"bug","content":"Bug: Benchmark script (bench-viewer.mjs) produced graph stats (167 edges) that didn't match the real buildGraph in graph.ts (171 edges). Cause: benchmark used a simpler edge-building algorithm that didn't include shared-tag edges (2+ shared tags). Fix: rewrote benchmark to use the same buildGraph logic, now produces matching 171 edges.","tags":["bug","benchmark","graph","edges","mismatch"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"scripts/bench-viewer.mjs","links":["benchmark-scripts","bm25-vs-embeddings-decision","docs-site-architecture"],"ttl":"","lastAccessed":"2026-07-31T21:11:49.729Z"},{"id":"sidebar-resizer-layout-bug","key":"sidebar-resizer-layout-bug","category":"bug","content":"Bug: sidebar resizer was a grid item in a grid-template-columns layout, causing layout shifts when the sidebar width changed via CSS variable. Fix: changed resizer to position: absolute with left: var(--sidebar-w), and .main to position: relative. This decoupled the resizer from the grid layout and allowed smooth sidebar resize without grid recalculation.","tags":["bug","viewer","layout","resizer","css"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-theme-toggle","viewer-standalone","viewer-serve-exit-bug"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.060Z"},{"id":"viewer-serve-exit-bug","key":"viewer-serve-exit-bug","category":"bug","content":"Bug: viewer --serve called process.exit(0) after viewerServe() but before the HTTP server could bind. The exit(0) was in the non-serve code path but ran unconditionally due to fallthrough in the if/else chain. Fix: moved process.exit(0) inside the non-serve callback and restructured as if/else if/else to prevent fallthrough to 'Unknown command'.","tags":["bug","viewer","server","exit","race-condition"],"quality":0.97,"accessCount":1,"date":"2026-07-28","file":"src/cli/setup.ts","links":["stdio-vs-sse-decision","cli-setup-routing","toon-format-decision"],"ttl":"","lastAccessed":""},{"id":"auto-merge-on-duplicate","key":"auto-merge-on-duplicate","category":"decision","content":"Decision: memory_remember auto-merges on duplicate key (same key = update, not error). This simplifies agent usage - agents can update entries without checking existence first. Auto-merge strategy: union of tags, max of confidence/quality scores, merge links, update date to latest. Verbatim mode (skip auto-tagging) available for precision. No cascading merge on linked entries.","tags":["decision","merge","dedup","upsert","ergonomics"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["entries-module","no-cloud-decision","jaccard-merge"],"ttl":"","lastAccessed":"2026-07-29T13:05:42.677Z"},{"id":"no-cloud-decision","key":"no-cloud-decision","category":"decision","content":"Decision: no central storage or cloud sync - memory stays local to each project. Rationale: security (no data leaves the machine), simplicity (no auth, no API keys, no servers), speed (no network latency), offline-first (works without internet). Users who want cloud sync can use GitHub Gist export/import or check .toon files into git. This is a feature, not a limitation.","tags":["decision","privacy","offline","local","security"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"README.md","links":["export-gist-format","memory-io-layer","esbuild-vs-tsc-decision"],"ttl":"","lastAccessed":"2026-08-02T15:41:06.712Z"},{"id":"quality-scoring-decision","key":"quality-scoring-decision","category":"decision","content":"Decision: access counting with staleness decay for quality scoring rather than LLM-based quality assessment. Access count + recency approximates usefulness without LLM calls. Entries accessed recently score higher. Staleness decay (-0.2 after 30 days) removes stale knowledge. Combined with content-based signals (tags, links, specificity) for a robust 0-1 score. Deterministic, predictable, explainable.","tags":["decision","quality","scoring","staleness","deterministic"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["quality-scoring-pattern","quality-score-formula","quality-access-tracking"],"ttl":"","lastAccessed":"2026-07-31T11:58:26.709Z"},{"id":"bm25-vs-embeddings-decision","key":"bm25-vs-embeddings-decision","category":"decision","content":"Decision to use BM25 over embedding models for search: BM25 is deterministic, requires no LLM, no model downloads, no GPU. Works offline. Perfect for code search where exact term matching matters. Trade-off: misses semantic similarity that embeddings capture. Mitigation: synonym expansion and fuzzy matching add coverage. For a dev tool, BM25's precision on code terms is more valuable than semantic fuzziness.","tags":["decision","search","bm25","embeddings","offline"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["stdio-vs-sse-decision","esbuild-vs-tsc-decision","fuzzy-search-module"],"ttl":"","lastAccessed":"2026-08-01T03:59:14.993Z"},{"id":"d3js-viewer-decision","key":"d3js-viewer-decision","category":"decision","content":"Decision: D3.js v7 via CDN for the viewer instead of bundling a graph library. Rationale: D3 is the de facto standard for force-directed graphs, CDN avoids adding 250KB+ to the bundle, the viewer HTML is self-contained anyway. Canvas was considered for rendering but SVG was chosen for simplicity, accessibility, and export support. Cytoscape.js was rejected due to heavier API and licensing.","tags":["decision","viewer","d3js","cdn","visualization"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-html-generation","viewer-standalone","d3-graph-viewer"],"ttl":"","lastAccessed":"2026-07-31T20:46:46.935Z"},{"id":"esbuild-vs-tsc-decision","key":"esbuild-vs-tsc-decision","category":"decision","content":"Decision to use esbuild over tsc for build: esbuild is 10-100x faster than tsc, produces bundled output (single JS file for MCP server), supports --define for version injection. tsc is used only for type checking (npx tsc --noEmit in CI). The trade-off: no type checking during build means type errors slip through if not caught separately. CI catches them.","tags":["decision","build","esbuild","tsc","speed"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["ci-workflow-config","stdio-vs-sse-decision","typescript-configuration"],"ttl":"","lastAccessed":"2026-07-30T05:01:48.315Z"},{"id":"stdio-vs-sse-decision","key":"stdio-vs-sse-decision","category":"decision","content":"Decision to use StdioServerTransport (stdio MCP) over SSE (HTTP MCP): Stdio is simpler, requires no HTTP server, no port assignment, no CORS. Ideal for local CLI-based AI agents (OpenCode, Claude, Cursor). SSE adds complexity for zero benefit in local scenarios. The trade-off: only one client at a time, but memory uses file locking for concurrent safety anyway.","tags":["decision","mcp","transport","stdio","sse"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/server.ts","links":["viewer-standalone","jsonl-format","utils-module"],"ttl":"","lastAccessed":"2026-08-01T17:30:38.535Z"},{"id":"toon-format-decision","key":"toon-format-decision","category":"decision","content":"Decision to use TOON format over JSON/Markdown: TOON is compact (~250 bytes/entry vs ~500+ for JSON), pipe-delimited (human-readable, grep-friendly), version-controllable (diff-friendly). Preserves field order for deterministic diffs. JSONL was considered but TOON offers better density. Markdown was rejected because structured data needs parsing. The @toon-format/toon library handles serialization.","tags":["decision","format","toon","json","markdown","storage"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/memory-io.ts","links":["toon-file-format-details","memory-io-layer","jsonl-format"],"ttl":"","lastAccessed":"2026-08-02T16:15:36.134Z"},{"id":"toon-file-format-details","key":"toon-file-format-details","category":"knowledge","content":"TOON file format: custom pipe-delimited compact format via @toon-format/toon. Header with version, separator config. Each entry has fields: key, category, content, tags, date, accessed, file, ttl, lastAccessed, links. Compact storage (~250 bytes per entry). Human-readable and version-controllable. Archive.toon uses same format for old entries.","tags":["toon","format","storage","compact","human-readable"],"quality":1,"accessCount":0,"date":"2026-07-29","file":"src/mcp/memory-io.ts","links":["toon-format-decision","memory-io-layer","jsonl-format"],"ttl":"","lastAccessed":"2026-08-03T14:31:42.419Z"},{"id":"agent-framework-integration","key":"agent-framework-integration","category":"knowledge","content":"Agent frameworks integration: 15+ agents supported via auto-detection in agents.ts and config-writer.ts. Each agent gets capture hooks + memory_recall auto-loading. File watcher (watchMemory via fs.watch) reloads memory on changes. OpenCode gets the most advanced integration (beacon event, tool.execute.after hook). Claude Code via CLAUDE.md. Others via .cursorrules, .continuerc, .gemini/config, etc.","tags":["agents","integration","frameworks","auto-detection"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/agents.ts","links":["agents-module","config-writer-architecture","capture-hook-architecture"],"ttl":"","lastAccessed":"2026-07-31T11:58:32.180Z"},{"id":"benchmark-scripts","key":"benchmark-scripts","category":"knowledge","content":"Benchmark scripts in scripts/: benchmark-toon.mjs (TOON format read/write perf), benchmark-impact.mjs (impact analysis), bench-context-tools.mjs (context generation perf), bench-full-impact.mjs (full impact analysis), bench-compress-all.mjs (compression perf), bench-primer.mjs (system primer generation). bench-viewer.mjs produces graph stats (density, avg degree) to match buildGraph output.","tags":["benchmark","scripts","performance","metrics"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"scripts/","links":["docs-site-architecture","npm-dependencies","mcp-tool-history"],"ttl":"","lastAccessed":"2026-07-31T17:13:02.097Z"},{"id":"installer-scripts","key":"installer-scripts","category":"knowledge","content":"Installer scripts: install.sh (bash, Unix) and install.ps1 (PowerShell, Windows). Detects platform and installs to local bin or global. install.sh uses curl/wget to fetch the latest release tarball. install.ps1 uses Invoke-WebRequest. Both check for Node.js >= 18. Also installs shell completions (bash/zsh) and man pages. Uninstall via uninstall.sh or manual removal.","tags":["installer","setup","cross-platform","node"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"install.sh","links":["cli-setup-routing","docs-site-architecture","commands-module"],"ttl":"","lastAccessed":""},{"id":"docs-site-architecture","key":"docs-site-architecture","category":"knowledge","content":"Documentation is a separate Astro site in docs/ directory. Uses Astro for SSG, deployed via GitHub Pages. Supports 8 languages (en, es, zh, ja, ko, pt-br, de, fr) via Astro i18n. Features: 29 MCP tools cards with SVG icons, token system architecture diagrams, benchmark showcase with charts, sticky header, accessibility, SEO, professional design. Dev server via docs own scripts.","tags":["docs","astro","i18n","ssg","landing-page"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"docs/","links":["docs-i18n-keys","viewer-html-generation","mcp-tool-error-handling"],"ttl":"","lastAccessed":"2026-08-03T16:58:25.598Z"},{"id":"ci-workflow-config","key":"ci-workflow-config","category":"knowledge","content":"CI configuration in .github/workflows/ci.yml: Triggers on push/PR to main. Matrix strategy: Node 20 and 22. Steps: checkout, setup-node (matrix version), npm ci, npm run build, npm test. Also runs npx tsc --noEmit for type checking (no ESLint configured). Separate workflows: docs.yml (docs site deploy) and publish.yml (npm publish on release tag).","tags":["ci","github-actions","matrix","node"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":".github/workflows/ci.yml","links":["typescript-configuration","vitest-test-infrastructure","esbuild-build-pipeline"],"ttl":"","lastAccessed":"2026-07-30T05:01:48.315Z"},{"id":"npm-dependencies","key":"npm-dependencies","category":"knowledge","content":"Dependencies: @inquirer/prompts (interactive prompts for CLI), @modelcontextprotocol/server (MCP SDK v2 beta), @toon-format/toon (TOON file format parser/serializer), zod (schema validation). Dev deps: typescript 7, vitest 4, esbuild, gpt-tokenizer. No runtime LLM dependency, no external services. Zero external service architecture keeps memory fully offline.","tags":["dependencies","package","npm","offline"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["zero-deps-philosophy","memory-io-layer","esbuild-build-pipeline"],"ttl":"","lastAccessed":"2026-08-02T15:41:06.712Z"},{"id":"typescript-configuration","key":"typescript-configuration","category":"knowledge","content":"TypeScript configuration in tsconfig.json: target ES2022, module NodeNext, strict mode enabled. Type-checks src/ directory only (excludes tests via exclude pattern). Includes 'declaration: true' for type generation. moduleResolution uses NodeNext for ESM compatibility. Uses Node types via @types/node. Runs in CI via 'npx tsc --noEmit' (not an npm script, run manually).","tags":["typescript","config","typecheck","tsconfig"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"tsconfig.json","links":["jsonl-format","vitest-test-infrastructure","esbuild-build-pipeline"],"ttl":"","lastAccessed":"2026-08-03T18:37:27.514Z"},{"id":"vitest-test-infrastructure","key":"vitest-test-infrastructure","category":"knowledge","content":"Test infrastructure uses Vitest 4 with vitest.config.ts configuration. Tests are in tests/ directory. 16 test files with 278 tests total. Runs on Node 20/22 in CI. Each test uses temp directories and cleans up automatically. No external services required. Key test files: cli.test.ts (CLI integration), mcp-integration.test.ts (all MCP tools end-to-end), graph.test.ts, quality.test.ts, context.test.ts.","tags":["test","vitest","ci","integration"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"vitest.config.ts","links":["test-no-external","test-temp-dirs","test-auto-cleanup"],"ttl":"","lastAccessed":"2026-07-30T05:01:48.315Z"},{"id":"esbuild-build-pipeline","key":"esbuild-build-pipeline","category":"knowledge","content":"Build pipeline in package.json: 'npm run build' runs three esbuild steps sequentially via &&. First builds bin/toon-memory.js (entry: src/bin/toon-memory.ts, bundle: true, platform: node, target: node20, external: ['esbuild']). Second builds mcp/server.js (entry: src/mcp/server.ts, bundle with version injection via --define). Third builds dist/cli/*.js (4 files: setup.ts, opencode-plugin.ts, capture.ts, session-start.ts, external: all packages).","tags":["build","esbuild","pipeline","bundling"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["esbuild-bundle","viewer-html-generation","build-output-layout"],"ttl":"","lastAccessed":"2026-07-30T05:01:48.315Z"},{"id":"near-duplicate-detection","key":"near-duplicate-detection","category":"pattern","content":"Near-duplicate detection in consolidation uses Jaccard similarity on word sets. Two entries are considered near-duplicates if Jaccard > 0.5 (50% word overlap). mergeSimilar() in consolidation.ts scans all entries pairwise (O(n²)) and merges matching pairs by keeping the longer content and combining tags. Runs on demand via memory_merge_similar or memory_consolidate.","tags":["dedup","jaccard","similarity","merge","consolidation"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/consolidation.ts","links":["consolidation-algorithm","fuzzy-search-module","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.399Z"},{"id":"bm25-search-ranking","key":"bm25-search-ranking","category":"pattern","content":"BM25 ranking in src/lib/graph.ts implements the Okapi BM25 algorithm for text search. Parameters: k1=1.5 (term saturation), b=0.75 (length normalization). Tokenization splits on whitespace and camelCase. Structural boosting: Functions/Methods +10, Routes +8, Classes/Interfaces +5. Noise labels (File/Folder/Module/Variable) excluded from results. avgDocLen computed from all entries.","tags":["bm25","search","ranking","ir","tokenization"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["bm25-ranking","utils-module","auto-linking-depth"],"ttl":"","lastAccessed":"2026-07-30T16:13:07.557Z"},{"id":"quality-scoring-pattern","key":"quality-scoring-pattern","category":"pattern","content":"Quality scoring in src/lib/quality.ts calculates 0-1 scores based on: tags (bonus for 1-5 tags), links (bonus for 1-5 links), content length (optimal 50-500 chars), recency (1.0 fresh, decays to 0.2 over 365 days), specificity (detecting code, paths, URLs, numbers), access frequency (more accesses = higher), staleness decay (-0.2 after 30 days no access). Combined via weighted product.","tags":["quality","scoring","decay","staleness","recency"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["quality-score-formula","quality-staleness-decay","quality-scoring"],"ttl":"","lastAccessed":""},{"id":"observation-auto-prune","key":"observation-auto-prune","category":"pattern","content":"Observations auto-prune at 500 entries to prevent bloat. When a new observation pushes the count over 500, the oldest entries are removed. Pruning happens on write, not on a timer. Observations are stored in observations.toon with tool name, file, and timestamp. This keeps the capture log manageable while retaining recent context.","tags":["observations","prune","auto","capture","bloat"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/hooks.ts","links":["capture-hook-architecture","backup-rotation-pattern","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":""},{"id":"session-pruning-pattern","key":"session-pruning-pattern","category":"pattern","content":"Session pruning removes stale sessions (older than 7 days or with expired TTL). pruneSessions() in src/lib/sessions.ts scans the sessions directory, checks each session's last-seen timestamp, and deletes stale ones. Runs on MCP server startup and periodically. Prevents build-up of orphan session files from disconnected agents.","tags":["session","pruning","stale","cleanup"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/sessions.ts","links":["file-locking-pattern","session-start-hook","resources-registration"],"ttl":"","lastAccessed":"2026-08-01T17:30:38.668Z"},{"id":"token-efficient-context","key":"token-efficient-context","category":"pattern","content":"Context generation tools use token-efficient patterns: compact mode (only signatures, no full source) for context_brief, rebuild mode (hierarchical with token budgets) for context_generate. Truncation detection via comparing total_results to limit. All context_* tools return structured data without LLM processing - pure deterministic logic from memory data.","tags":["context","tokens","efficiency","compact"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/context.ts","links":["context-rebuild-hierarchical","graph-recall-algorithm","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":"2026-08-02T17:16:51.537Z"},{"id":"backup-rotation-pattern","key":"backup-rotation-pattern","category":"pattern","content":"Backup system keeps the last 10 timestamped backups in .toon-memory/memory/backups/. Each backup file includes the date in the filename (e.g. memory-2026-07-28T16-00-00.toon). Older backups beyond the 10 limit are automatically pruned. Used by memory_backup tool and triggered before major operations like archive or consolidation.","tags":["backup","rotation","pruning","safety"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/mcp/tools.ts","links":["commands-module","file-locking-pattern","config-module"],"ttl":"","lastAccessed":"2026-07-29T13:11:06.342Z"},{"id":"zod-schema-validation","key":"zod-schema-validation","category":"pattern","content":"All MCP tool parameters use Zod schemas for validation. Each tool defines its input schema using z.object() with typed fields, optional defaults, and descriptive messages. Schemas include string/number/boolean with min/max constraints. Enums for categories (decision, pattern, bug, knowledge, architecture) and modes (flat, graph, rebuild).","tags":["zod","validation","schemas","typescript"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["mcp-tool-error-handling","tool-error-handling","agents-module"],"ttl":"","lastAccessed":""},{"id":"file-locking-pattern","key":"file-locking-pattern","category":"pattern","content":"File locking in src/lib/lock.ts prevents concurrent access to .toon files. Uses a lock file (.toon-memory/memory/.lock) with PID and timestamp. acquireLock() creates the lock file atomically, releaseLock() removes it. Times out after 5 seconds if lock cannot be acquired. Used by readMemory() and writeMemory() to prevent corruption from parallel agent sessions.","tags":["locking","concurrency","file","atomic"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/lock.ts","links":["session-start-hook","capture-hook-architecture","config-writer-architecture"],"ttl":"","lastAccessed":"2026-07-29T13:11:26.189Z"},{"id":"mcp-tool-error-handling","key":"mcp-tool-error-handling","category":"pattern","content":"MCP tools use try/catch with error messages returned as content responses, not thrown exceptions. Each tool wraps its logic in try/catch and returns { isError: true, content: [{ type: 'text', text: error.message }] }. This ensures the MCP server never crashes on user errors. Input validation uses Zod schemas before processing.","tags":["error-handling","mcp","robustness","validation"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["tool-error-handling","memory-io-layer","crypto-module"],"ttl":"","lastAccessed":""},{"id":"config-module","key":"config-module","category":"architecture","content":"Config module in src/mcp/config.ts handles configuration loading, key management, and limits. loadConfig() reads .toon-memory/memory/config.json. MAX_ENTRIES constant (default 100) triggers archive warnings. Key management for encryption mode. Config includes file paths for data.toon, archive.toon, observations.toon, and session storage directories.","tags":["config","limits","paths","keys"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/config.ts","links":["fuzzy-search-module","entries-module","synonyms-module"],"ttl":"","lastAccessed":"2026-08-03T18:37:27.514Z"},{"id":"utils-module","key":"utils-module","category":"architecture","content":"Utils module in src/lib/utils.ts provides shared utility functions: tokenize() splits text into tokens for BM25, normalize() normalizes text (lowercase, trim), isExpiredLocal() checks if a date has passed, importance() calculates entry importance score based on access count and links, isPrivate() checks for 'private' tag on entries.","tags":["utils","tokenize","normalize","utility"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/utils.ts","links":["entries-module","quality-access-tracking","synonyms-module"],"ttl":"","lastAccessed":""},{"id":"entries-module","key":"entries-module","category":"architecture","content":"Entries module in src/mcp/entries.ts provides entry management utilities: generateId() creates unique entry IDs using timestamp + random, parseTTL() converts TTL strings (e.g. '7d', '2026-07-17') to dates, isExpired() checks TTL expiration, inferTags() auto-tags content by keyword matching (verbatim mode skips this), parseRelativeDate() handles relative date strings for date filtering.","tags":["entries","id","ttl","tags","parsing"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/entries.ts","links":["archive-module","toon-v1-format","synonyms-module"],"ttl":"","lastAccessed":""},{"id":"crypto-module","key":"crypto-module","category":"architecture","content":"Crypto module in src/mcp/crypto.ts implements AES-256-GCM encryption for memory data. encrypt(data, key) returns base64-encoded ciphertext with IV prepended. decrypt(ciphertext, key) reverses the process. Key derivation uses PBKDF2 with salt. The TOON_MEMORY_KEY environment variable supplies the encryption key. Encryption is opt-in via memory_encrypt tool.","tags":["crypto","aes","gcm","encryption","security"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/crypto.ts","links":["security-env-keys","aes256gcm-encrypt","encrypt-decrypt"],"ttl":"","lastAccessed":""},{"id":"synonyms-module","key":"synonyms-module","category":"architecture","content":"Synonyms module in src/lib/synonyms.ts provides term expansion for improved memory recall. Maps common terms to their synonyms (e.g. 'config' ↔ 'configuration', 'delete' ↔ 'remove' ↔ 'forget'). Used during smart_recall to broaden search queries and find entries that use different terminology. Domain-specific synonym maps for memory system terminology.","tags":["synonyms","search","recall","nlp"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/synonyms.ts","links":["fuzzy-search-module","commands-module","resources-registration"],"ttl":"","lastAccessed":""},{"id":"fuzzy-search-module","key":"fuzzy-search-module","category":"architecture","content":"Fuzzy search in src/lib/fuzzy.ts implements approximate string matching for memory recall. Uses Levenshtein distance with configurable threshold. Falls back gracefully when no fuzzy matches are found. Integrated into graph recall and smart recall for broader matching when exact keyword search misses relevant entries.","tags":["fuzzy","search","levenshtein","matching"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/fuzzy.ts","links":["viewer-keyboard-shortcuts","memory-io-layer","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":""},{"id":"commands-module","key":"commands-module","category":"architecture","content":"Commands module in src/cli/commands.ts provides the core CLI command implementations. Includes initProject() to set up the .toon-memory directory structure, showStatus() for current state, showStats() with category breakdowns, exportToon()/importToon() for data portability, watchMemory() for file watching, upgradeSelf() for self-update, and uninstallSelf() for cleanup.","tags":["cli","commands","init","export","import","watch"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/commands.ts","links":["cli-setup-routing","cli-commands","session-start-hook"],"ttl":"","lastAccessed":"2026-08-03T19:01:09.145Z"},{"id":"agents-module","key":"agents-module","category":"architecture","content":"Agents module in src/cli/agents.ts detects which AI coding agent is running and installs the appropriate capture hooks. Supports 15+ agents: OpenCode, Claude, Cursor, Continue, Gemini, Codex, Kiro, Mimocode, Cline, Impeccable, Windsurf, CodeGPT, Codium, Aider, Augment, Copilot. Detection is by environment variables, config file presence, or process arguments. Each agent gets a tailored config with tool_use captures.","tags":["agents","detection","hooks","integration"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/agents.ts","links":["config-writer-architecture","15-agents","cli-setup-routing"],"ttl":"","lastAccessed":""},{"id":"cli-setup-routing","key":"cli-setup-routing","category":"architecture","content":"CLI routing in src/cli/setup.ts handles commands: init, status, stats, export, import, watch, upgrade, uninstall, capture, viewer (with --serve and --port). Uses if/else if/else chain routing argv[2]. 'init' sets up .toon-memory directory and installs agent hooks. 'stats' shows entry counts by category. 'export/import' handle TOON data. 'viewer' generates or serves the HTML graph viewer.","tags":["cli","routing","commands","setup"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/setup.ts","links":["cli-init-command","memory-io-layer","viewer-html-generation"],"ttl":"","lastAccessed":"2026-08-02T15:41:52.108Z"},{"id":"config-writer-architecture","key":"config-writer-architecture","category":"architecture","content":"Config writer in src/cli/config-writer.ts generates agent-specific configuration files. For each supported agent (OpenCode, Claude, Cursor, Continue, Gemini, Codex, Kiro, Mimocode, Cline, Impeccable), it creates the appropriate config file format with capture hooks enabled. Templates are per-agent with correct file paths and format. Called during 'toon-memory init' and 'toon-memory capture on'.","tags":["config","agents","templates","init"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/config-writer.ts","links":["session-start-hook","capture-hook-architecture","opencode-plugin-auto-loading"],"ttl":"","lastAccessed":"2026-08-03T19:01:09.145Z"},{"id":"resources-registration","key":"resources-registration","category":"architecture","content":"MCP resources in src/mcp/resources.ts expose memory data as read-only resources for MCP clients. Registers resource templates and static resources that provide access to memory entries, sessions, and health data. Resources use the MCP ResourceTemplate pattern with URI templates for dynamic access by entry key or category.","tags":["mcp","resources","templates","uri"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/mcp/resources.ts","links":["memory-io-layer","session-start-hook","graph-recall-algorithm"],"ttl":"","lastAccessed":"2026-07-31T01:52:40.128Z"},{"id":"session-start-hook","key":"session-start-hook","category":"architecture","content":"Session start hook in src/cli/session-start.ts runs at agent session initialization. It records the git branch, start time, and file access list. Tracks active sessions for conflict detection. Sessions are stored in .toon-memory/sessions/ directory with a structured format including branch, files touched, and last-seen timestamp.","tags":["session","hooks","git","conflict-detection"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/session-start.ts","links":["session-store-architecture","opencode-plugin-auto-loading","session-conflict-detection"],"ttl":"","lastAccessed":"2026-07-30T16:13:07.203Z"},{"id":"archive-module","key":"archive-module","category":"architecture","content":"Archive module in src/mcp/archive.ts handles moving old entries (>30 days) to archive.toon and pruning expired TTL entries. archiveOldEntries() filters entries by date and appends them to the archive file. pruneExpiredEntries() scans entries with TTL and removes expired ones. Both maintain the data.toon file by filtering out processed entries.","tags":["archive","ttl","prune","storage"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/mcp/archive.ts","links":["opencode-plugin-auto-loading","capture-hook-architecture","memory-archive"],"ttl":"","lastAccessed":""},{"id":"memory-io-layer","key":"memory-io-layer","category":"architecture","content":"Memory I/O in src/mcp/memory-io.ts handles reading and writing .toon files. readMemory() reads the data.toon file and returns its content as a string. writeMemory(data) writes data to data.toon. Uses the TOON format via @toon-format/toon. The file path is resolved relative to projectRoot from src/cli/constants.ts. Handles file not found errors gracefully.","tags":["io","toon","file","persistence","storage"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/memory-io.ts","links":["opencode-plugin-auto-loading","capture-hook-architecture","export-gist-format"],"ttl":"","lastAccessed":"2026-08-02T16:15:36.134Z"},{"id":"capture-hook-architecture","key":"capture-hook-architecture","category":"architecture","content":"Capture hooks intercept tool calls and write observations to observations.toon. Implemented in src/cli/hooks.ts. Opt-in via 'toon-memory capture on'. Each observation records tool name, file path, and timestamp. Auto-prunes at 500 entries to prevent bloat. The 'toon-memory capture status' command shows hook installation state. Observations can be promoted to permanent memory entries.","tags":["capture","hooks","observations","auto-prune"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/cli/hooks.ts","links":["capture-system","capture-hooks","capture-observations"],"ttl":"","lastAccessed":""},{"id":"opencode-plugin-auto-loading","key":"opencode-plugin-auto-loading","category":"architecture","content":"OpenCode plugin in src/cli/opencode-plugin.ts hooks into tool.execute.after to implement intelligent auto-loading. Instead of injecting all memory at session start, it triggers a memory_recall by file path after every tool execution. Uses setContext() in OpenCode to inject recalled entries. The plugin also handles first-run config generation. This reduces tokens by ~90% compared to full memory dump.","tags":["opencode","plugin","auto-loading","tokens","efficiency"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/opencode-plugin.ts","links":["intelligent-auto-loading","opencode-plugin","session-conflict-detection"],"ttl":"","lastAccessed":"2026-08-02T16:08:35.098Z"},{"id":"viewer-keyboard-shortcuts","key":"viewer-keyboard-shortcuts","category":"architecture","content":"Viewer keyboard shortcuts: / focuses search, Escape clears search or deselects entry and switches to graph tab, 1-4 switches tabs (Graph/Stats/Timeline/Detail). When input is focused, Escape only clears and blurs the input. All shortcuts ignore input elements except the Escape+blur behavior.","tags":["viewer","keyboard","ux","shortcuts"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-theme-toggle","viewer-standalone","viewer-html-generation"],"ttl":"","lastAccessed":"2026-07-29T13:11:06.342Z"},{"id":"viewer-export-features","key":"viewer-export-features","category":"architecture","content":"Viewer supports PNG and SVG export. PNG uses Canvas 2D: serializes the SVG element to XML, converts to base64 data URL, loads it into an Image, draws to a 2x resolution canvas, then exports via link download. SVG export directly serializes the SVG to a Blob and creates an object URL. Both handle the dark/light background via getComputedStyle.","tags":["viewer","export","png","svg","canvas"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-export-png","viewer-standalone","d3-graph-viewer"],"ttl":"","lastAccessed":"2026-07-29T13:12:06.257Z"},{"id":"viewer-force-graph","key":"viewer-force-graph","category":"architecture","content":"Viewer graph uses D3 forceSimulation with 4 forces: link (distance-based), charge (many-body repulsion, default -120), center (gravity to center, default 0.05), collision (radius-based). Nodes are circle elements, edges are line elements. The simulation runs on tick to update positions. Nodes are draggable (fixes position on drag), right-click to unfix. Minimap shows a scaled-down overview with its own SVG.","tags":["viewer","d3js","force-graph","simulation","physics"],"quality":0.99,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-minimap-render","graph-force-layout","graph-physics-controls"],"ttl":"","lastAccessed":""},{"id":"viewer-html-generation","key":"viewer-html-generation","category":"architecture","content":"Viewer generates a self-contained HTML file with D3.js v7 via CDN. No runtime dependencies. generateHtml() in src/viewer/html.ts builds the complete HTML string with embedded CSS and JS. Data is serialized as JSON and injected via const DATA = ${jsonData}. The viewer supports graph (D3 force simulation), stats (bar charts, tag cloud), timeline (grouped by date), and detail panels via tabs. --live flag enables SSE for auto-refresh.","tags":["viewer","html","d3js","self-contained","cdnd","cdn"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-standalone","viewer-inline-bundle","d3-graph-viewer"],"ttl":"","lastAccessed":"2026-07-29T13:27:24.420Z"},{"id":"build-output-layout","key":"build-output-layout","category":"architecture","content":"Build output layout: bin/toon-memory.js (entry binary), mcp/server.js (MCP server), dist/cli/setup.js (CLI), dist/cli/toon-memory.js, dist/cli/capture.js, dist/cli/session-start.js. All gitignored.","tags":["build","output","structure","esbuild"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"package.json","links":["esbuild-bundle","file-structure","zero-deps-philosophy"],"ttl":"","lastAccessed":"2026-08-03T00:55:26.456Z"},{"id":"context-rebuild-hierarchical","key":"context-rebuild-hierarchical","category":"knowledge","content":"Context rebuild hierarchical: context_rebuild tool reconstructs memory from git history. Scans commits, extracts file changes, generates entries. 3 modes: quick (recent 10 commits), full (all commits), incremental (since last rebuild). Zero LLM.","tags":["context","rebuild","git","hierarchical"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/mcp/tools.ts","links":["context-generate","mcp-tool-history","context-diff"],"ttl":"","lastAccessed":"2026-07-29T13:07:40.627Z"},{"id":"consolidation-algorithm","key":"consolidation-algorithm","category":"architecture","content":"Memory consolidation: removes entries with identical content (keeps first). Deterministic, no LLM. Scans all entries, compares content strings, marks duplicates for removal. Useful after mass-import or merge operations.","tags":["consolidation","dedup","deterministic"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/lib/quality.ts","links":["memory-consolidate","memory-compress","duplicate-detection","near-duplicate-detection"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.399Z"},{"id":"viewer-export-png","key":"viewer-export-png","category":"architecture","content":"Viewer export PNG: serializes SVG to XML, renders to canvas (2x resolution), downloads as PNG. Uses btoa(unescape(encodeURIComponent(svgData))) for data URL. Background color from CSS variable. Filename: toon-memory-graph.png.","tags":["viewer","export","png","canvas"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","viewer-standalone"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"viewer-theme-toggle","key":"viewer-theme-toggle","category":"architecture","content":"Viewer theme toggle: button swaps CSS variables between dark and light via .light class. localStorage persistence. Affects all elements: sidebar, graph, detail panel, tooltips. No flash on load (inline check).","tags":["viewer","theme","dark-light","localStorage"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","viewer-standalone","graph-tooltip-content"],"ttl":"","lastAccessed":"2026-07-29T13:06:54.236Z"},{"id":"graph-node-radius","key":"graph-node-radius","category":"architecture","content":"Graph node radius: variable by access count. Formula: 4 + min(accessCount * 0.8, 8). Range: 4px (never accessed) to 12px (heavily accessed). Provides visual cue for entry importance. Used in collision force radius.","tags":["graph","node","radius","importance"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-edge-thickness","graph-physics-controls"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"graph-recall-algorithm","key":"graph-recall-algorithm","category":"architecture","content":"Graph recall: memory_recall with mode='graph' expands related-entry subgraph. 1-hop: direct neighbors only. 2-hop: neighbors of neighbors. More precise than flat mode, fewer tokens. Useful for deep context gathering.","tags":["graph","recall","subgraph","algorithm"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-recall","auto-linking-depth","smart-recall"],"ttl":"","lastAccessed":"2026-07-30T16:13:07.557Z"},{"id":"capture-system","key":"capture-system","category":"architecture","content":"Capture system: hooks intercept MCP tool calls and write observations to observations.toon. Opt-in via capture enable. Observations are raw tool inputs/outputs. memory_captured shows captured observations. Promote to memory with memory_remember.","tags":["capture","hooks","observations","opt-in"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/capture.ts","links":["capture-observations","memory-captured","cli-commands"],"ttl":"","lastAccessed":""},{"id":"export-gist-format","key":"export-gist-format","category":"architecture","content":"GitHub Gist export: memory_export_gist creates private Gist with data.toon content. Uses Node.js built-in fetch() (no axios/node-fetch). GITHUB_TOKEN env var required. Format: single file 'memory.toon' with JSONL content.","tags":["export","gist","github","cloud-sync"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["export-import","memory-export-gist","memory-import-gist"],"ttl":"","lastAccessed":""},{"id":"auto-linking-depth","key":"auto-linking-depth","category":"architecture","content":"Auto-linking depth: findRelatedEntries() in graph.ts does 2-hop expansion from query matches. First hop: BM25 matches. Second hop: entries connected to matches via edges. Combined with centrality ranking. Result capped at limit parameter.","tags":["graph","auto-linking","bm25","depth"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["auto-linking","graph-bm25-ranking","graph-centrality-algorithm"],"ttl":"","lastAccessed":"2026-07-31T21:11:49.729Z"},{"id":"quality-score-formula","key":"quality-score-formula","category":"architecture","content":"Quality score formula: quality = (0.3 * freshness + 0.3 * accessScore + 0.2 * tagScore + 0.2 * linkScore) * stalenessDecay. freshness: 1/(1+age/30). accessScore: min(accessCount/5, 1). tagScore: min(tags.length/3, 1). linkScore: min(links.length/3, 1). Final range: 0-1.","tags":["quality","formula","scoring","algorithm"],"quality":0.97,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["quality-scoring","quality-staleness-decay","quality-access-tracking"],"ttl":"","lastAccessed":""},{"id":"graph-tooltip-content","key":"graph-tooltip-content","category":"architecture","content":"Graph tooltips: category (colored), key, content preview (truncated to 100 chars), quality score, access count. Positioned at mouse + 12px offset. Dark background, white text. Hidden on mouseout. Styled with CSS class 'tooltip'.","tags":["graph","tooltip","ux","hover"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-glow-effect","graph-edge-thickness"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"graph-transitions","key":"graph-transitions","category":"architecture","content":"CSS transitions on graph elements: node-circle (r, opacity, filter 0.2s ease), node-label (opacity 0.2s), link (stroke-opacity, stroke, stroke-width 0.2s). Smooth highlight/unhighlight without D3 transition calls. Pure CSS, no JS overhead.","tags":["graph","animation","transitions","css"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-glow-effect","graph-physics-controls"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"graph-glow-effect","key":"graph-glow-effect","category":"architecture","content":"SVG glow filter for selected nodes: feGaussianBlur (stdDeviation 4) + feMerge (blur + SourceGraphic). Applied via CSS class 'glow'. Also adds brightness(1.4). Creates distinct visual highlight without extra DOM elements.","tags":["graph","visual","glow","svg","effect"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-edge-thickness","graph-minimap-render"],"ttl":"","lastAccessed":"2026-08-03T19:01:09.145Z"},{"id":"graph-physics-controls","key":"graph-physics-controls","category":"architecture","content":"Graph physics controls: toggle button opens panel with sliders. Charge: -300 to 0 (default -120), repulsion strength. Distance: 20-200 (default 70), edge target length. Center: 0-1 (default 0.05), center gravity. Changes apply instantly with alpha(0.5) restart.","tags":["graph","physics","interactive","controls"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-force-layout","graph-minimap-render","d3-graph-viewer"],"ttl":"","lastAccessed":"2026-07-29T13:06:54.236Z"},{"id":"graph-minimap-render","key":"graph-minimap-render","category":"architecture","content":"Graph minimap: bottom-left corner, 150x100px. Real-time rendering via D3. Scale factor 0.1x. Shows nodes as colored dots, edges as thin lines, viewport rectangle (purple). Updates on every simulation tick. No separate canvas, uses SVG.","tags":["graph","minimap","visualization","real-time"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-force-layout","graph-physics-controls"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"test-no-external","key":"test-no-external","category":"architecture","content":"Tests require no external services: no database, no network, no API calls. All tests run locally with temp files. 278 tests in 16 files. CI runs on Node 20/22 matrix.","tags":["testing","local","self-contained","ci"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"","links":["test-temp-dirs","test-auto-cleanup","vitest-testing"],"ttl":"","lastAccessed":""},{"id":"test-auto-cleanup","key":"test-auto-cleanup","category":"architecture","content":"Tests auto-cleanup: temp directories removed after each test. process.on('exit') cleanup handler. No manual rm -rf needed. Ensures clean state for next test run.","tags":["testing","cleanup","automatic"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"tests/cli.test.ts","links":["test-temp-dirs","vitest-testing"],"ttl":"","lastAccessed":"2026-08-01T03:59:14.993Z"},{"id":"test-temp-dirs","key":"test-temp-dirs","category":"architecture","content":"Tests use temp directories: each test creates isolated .toon-memory/ in system temp. No shared state between tests. Parallel-safe. Vitest config in vitest.config.ts with globals: true.","tags":["testing","temp","isolation","vitest"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"tests/cli.test.ts","links":["test-auto-cleanup","vitest-testing"],"ttl":"","lastAccessed":""},{"id":"security-env-keys","key":"security-env-keys","category":"architecture","content":"Encryption keys via environment variables only. TOON_MEMORY_KEY for AES-256-GCM memory encryption. GITHUB_TOKEN for Gist export/import. Never stored in memory, never logged. Process-level isolation.","tags":["security","encryption","env-variables"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"","links":["security-no-secrets","aes256gcm-encrypt","memory-encrypt"],"ttl":"","lastAccessed":"2026-08-02T16:15:36.134Z"},{"id":"security-no-secrets","key":"security-no-secrets","category":"architecture","content":"Security rule: never log or commit secrets, API keys, or encryption keys. Memory entries marked 'private' are excluded from context injection. TOON_MEMORY_KEY never written to disk. No hardcoded secrets anywhere in codebase.","tags":["security","secrets","best-practice"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"","links":["security-env-keys","aes256gcm-encrypt"],"ttl":"","lastAccessed":""},{"id":"docs-i18n-keys","key":"docs-i18n-keys","category":"knowledge","content":"i18n key patterns in src/i18n.ts: each language has 'whatNew' array with version cards. Keys: home.*, nav.*, docs.*, ui.*. English is default/fallback. 8 languages: en, es, zh, ja, ko, de, pt-br, fr.","tags":["docs","i18n","localization","keys"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"docs/src/i18n.ts","links":["docs-astro","i18n-8-languages","docs-content-structure"],"ttl":"","lastAccessed":""},{"id":"docs-content-structure","key":"docs-content-structure","category":"knowledge","content":"Docs site structure: src/content/docs/ has subdirectories per language (en/, es/, zh/, ja/, ko/, de/, pt-br/, fr/). Each has .mdx files. Astro Content Collections schema in src/content.config.ts. Sidebar auto-generated from frontmatter order.","tags":["docs","astro","structure","i18n"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"docs/src/content.config.ts","links":["docs-astro","i18n-8-languages","docs-i18n-keys"],"ttl":"","lastAccessed":"2026-08-03T00:55:26.456Z"},{"id":"session-conflict-detection","key":"session-conflict-detection","category":"architecture","content":"Session conflict detection: memory_sessions tool shows files touched by 2+ sessions (soft conflicts). Prevents overwriting parallel session work. Uses git branch name + last-seen timestamp per session.","tags":["session","conflict","parallel","multi-agent"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["memory-sessions","session-auto-promotion","session-merge"],"ttl":"","lastAccessed":"2026-07-30T16:13:07.203Z"},{"id":"session-auto-promotion","key":"session-auto-promotion","category":"architecture","content":"Session auto-promotion: observations accessed 3+ times in a session are automatically promoted to permanent memory entries. Tracked via session access map. Happens on session end or periodically. Prevents loss of frequently-used transient knowledge.","tags":["session","promotion","auto","transient"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/session-store.ts","links":["memory-sessions","session-conflict-detection","capture-observations"],"ttl":"","lastAccessed":"2026-07-30T16:13:07.203Z"},{"id":"quality-access-tracking","key":"quality-access-tracking","category":"architecture","content":"Access tracking: each entry has accessCount (incremented on recall) and lastAccessed (timestamp). bumpAccessed() in scoring.ts updates both. High access count = high quality. Combined with staleness decay for final quality score.","tags":["quality","access","tracking","scoring"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/scoring.ts","links":["quality-scoring","quality-staleness-decay","smart-recall"],"ttl":"","lastAccessed":""},{"id":"quality-staleness-decay","key":"quality-staleness-decay","category":"architecture","content":"Quality staleness decay: entries older than 30 days lose quality exponentially. Decay factor: e^(-age/30). Fresh entry: quality 1.0. After 30 days: ~0.37. After 60 days: ~0.14. Combined with access count: frequently accessed old entries maintain higher quality.","tags":["quality","decay","staleness","algorithm"],"qual let searchQuery = '';

// Init theme from localStorage
const savedTheme = localStorage.getItem('toon-viewer-theme') || 'dark';
if (savedTheme === 'light') document.documentElement.classList.add('light');

// Tooltip
const tooltip = document.getElementById('tooltip');
function showTooltip(e, d) {
  tooltip.innerHTML =
    '<div class="tt-cat" style="color:' + (COLORS[d.category] || 'var(--muted)') + '">' + d.category + '</div>' +
    '<div class="tt-key">' + escHtml(d.id) + '</div>' +
    '<div class="tt-content">' + escHtml(d.content) + '</div>' +
    '<div class="tt-score">Quality: ' + (d.quality || 0).toFixed(2) + ' | Access: ' + (d.accessCount || 0) + '</div>';
  tooltip.style.display = 'block';
  positionTooltip(e);
}
function positionTooltip(e) {
  const x = e.clientX + 12, y = e.clientY + 12;
  const rect = tooltip.getBoundingClientRect();
  tooltip.style.left = (x + rect.width > window.innerWidth ? e.clientX - rect.width - 8 : x) + 'px';
  tooltip.style.top = (y + rect.height > window.innerHeight ? e.clientY - rect.height - 8 : y) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }
document.addEventListener('mousemove', (e) => { if (tooltip.style.display === 'block') positionTooltip(e); });

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'graph') setTimeout(() => graph.resize(), 50);
  });
});
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="' + name + '"]').classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// Filters
const filterContainer = document.getElementById('filters');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active'; allBtn.textContent = 'All';
allBtn.onclick = () => setFilter(null);
filterContainer.appendChild(allBtn);
Object.keys(DATA.categories).sort().forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn'; btn.textContent = cat;
  btn.dataset.cat = cat; btn.onclick = () => setFilter(cat);
  filterContainer.appendChild(btn);
});
function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', cat === null ? !b.dataset.cat : b.dataset.cat === cat));
  renderEntries();
  if (graph.highlightSearch) graph.highlightSearch();
}

// Search
document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase();
  renderEntries();
  if (graph.highlightSearch) graph.highlightSearch();
  if (searchQuery && graph.centerOn) {
    const first = DATA.nodes.find(n => n.id.toLowerCase().includes(searchQuery) || n.content.toLowerCase().includes(searchQuery) || n.tags.some(t => t.toLowerCase().includes(searchQuery)));
    if (first) graph.centerOn(first.id);
  }
});

// Entries List
function renderEntries() {
  const q = searchQuery;
  const list = document.getElementById('entriesList');
  list.innerHTML = '';
  DATA.nodes.filter(e => !activeFilter || e.category === activeFilter)
    .filter(e => !q || e.id.toLowerCase().includes(q) || e.content.toLowerCase().includes(q) || e.tags.some(t => t.toLowerCase().includes(q)))
    .forEach(e => {
      const div = document.createElement('div');
      div.className = 'entry-item' + (selectedEntry && selectedEntry.id === e.id ? ' selected' : '');
      div.innerHTML = '<div class="entry-cat ' + e.category + '">' + e.category + '</div><div class="entry-key">' + escHtml(e.id) + '</div><div class="entry-preview">' + escHtml(e.content) + '</div>' + (e.tags.length ? '<div class="entry-tags">' + e.tags.map(t => '<span class="entry-tag">' + escHtml(t) + '</span>').join('') + '</div>' : '');
      div.onclick = () => selectEntry(e);
      list.appendChild(div);
    });
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Entry Selection
function selectEntry(entry) {
  selectedEntry = entry; renderEntries(); showDetail(entry);
  graph.highlightNode(entry.id); graph.centerOn(entry.id); switchTab('detail');
}
function showDetail(e) {
  const panel = document.getElementById('detailPanel');
  const linkedNodes = DATA.edges.filter(ed => (typeof ed.source === 'object' ? ed.source.id : ed.source) === e.id || (typeof ed.target === 'object' ? ed.target.id : ed.target) === e.id)
    .map(ed => (typeof ed.source === 'object' ? ed.source.id : ed.source) === e.id ? (typeof ed.target === 'object' ? ed.target.id : ed.target) : (typeof ed.source === 'object' ? ed.source.id : ed.source));
  panel.innerHTML =
    '<div class="detail-cat" style="color:' + (COLORS[e.category] || 'var(--muted)') + '">' + e.category + '</div><h2>' + escHtml(e.id) + '</h2>' +
    '<div class="detail-field"><label>Content</label><span class="value mono">' + escHtml(e.content) + '</span></div>' +
    (e.file ? '<div class="detail-field"><label>File</label><span class="value mono" style="color:var(--brand)">' + escHtml(e.file) + '</span></div>' : '') +
    (e.date ? '<div class="detail-field"><label>Date</label><span class="value">' + e.date + '</span></div>' : '') +
    '<div class="detail-field"><label>Quality</label><span class="value" style="color:var(--brand);font-weight:700;font-size:1.1rem">' + (e.quality || 0).toFixed(3) + '</span></div>' +
    '<div class="detail-field"><label>Access Count</label><span class="value">' + (e.accessCount || 0) + '</span></div>' +
    (e.tags.length ? '<div class="detail-field"><label>Tags</label><div class="entry-tags">' + e.tags.map(t => '<span class="entry-tag">' + escHtml(t) + '</span>').join('') + '</div></div>' : '') +
    (linkedNodes.length ? '<div class="detail-field"><label>Links (' + linkedNodes.length + ')</label><div class="detail-links">' + linkedNodes.map(k => '<span class="detail-link" onclick="selectEntryById(\'' + k + '\')">' + escHtml(k) + '</span>').join('') + '</div></div>' : '');
}
window.selectEntryById = function(id) { const e = DATA.nodes.find(n => n.id === id); if (e) selectEntry(e); };

// Stats
function renderStats() {
  const grid = document.getElementById('statsGrid');
  const catEntries = Object.entries(DATA.categories).sort((a,b) => b[1] - a[1]);
  const maxCat = Math.max(...catEntries.map(c => c[1]));
  const topTags = Object.entries(DATA.tagCounts).sort((a,b) => b[1] - a[1]).slice(0, 20);
  const maxTag = Math.max(...topTags.map(t => t[1]));
  const avgQuality = DATA.nodes.reduce((s, n) => s + (n.quality || 0), 0) / DATA.nodes.length;
  grid.innerHTML =
    '<div class="stat-card"><h3>Total Entries</h3><div class="stat-big">' + DATA.totalEntries + '</div></div>' +
    '<div class="stat-card"><h3>Graph Edges</h3><div class="stat-big">' + DATA.edges.length + '</div></div>' +
    '<div class="stat-card"><h3>Avg Quality</h3><div class="stat-big">' + avgQuality.toFixed(2) + '</div></div>' +
    '<div class="stat-card"><h3>Categories</h3><div class="bar-chart">' + catEntries.map(([cat, count]) =>
      '<div class="bar-row"><span class="bar-label">' + cat + '</span><div class="bar-track"><div class="bar-fill" style="width:' + (count/maxCat*100) + '%;background:' + (COLORS[cat] || 'var(--brand)') + '"></div></div><span class="bar-value">' + count + '</span></div>').join('') +
    '</div></div>' +
    '<div class="stat-card"><h3>Top Tags</h3><div class="tag-cloud">' + topTags.map(([tag, count]) => '<span class="tag-pill">' + escHtml(tag) + ' <small>(' + count + ')</small></span>').join('') + '</div></div>';
}
function renderTimeline() {
  const container = document.getElementById('timelineContainer');
  const sorted = [...DATA.nodes].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const grouped = {};
  sorted.forEach(e => { const d = e.date || 'unknown'; if (!grouped[d]) grouped[d] = []; grouped[d].push(e); });
  let html = '<div class="timeline-header">Timeline (' + DATA.totalEntries + ' entries)</div><div class="timeline-track"><div class="timeline-line"></div>';
  for (const [date, entries] of Object.entries(grouped)) {
    for (const e of entries) {
      html += '<div class="timeline-entry" onclick="selectEntryById(\'' + e.id + '\')" style="border-left:3px solid ' + (COLORS[e.category] || 'var(--border)') + '"><div class="tl-date">' + escHtml(date) + '</div><div class="tl-cat" style="color:' + (COLORS[e.category] || 'var(--muted)') + '">' + e.category + '</div><div class="tl-key">' + escHtml(e.id) + '</div><div class="tl-content">' + escHtml(e.content.substring(0, 100)) + '</div></div>';
    }
  }
  html += '</div>';
  container.innerHTML = html;
}

    link.attr('opacity', d => id ? (((typeof d.source === 'object' ? d.source.id : d.source) === id || (typeof d.target === 'object' ? d.target.id : d.target) === id) ? 1 : 0.04) : 0.5);

  document.getElementById('zoomOut').onclick = () => svg.transition().call(zoom.scaleBy, 0.67);
  document.getElementById('zoomReset').onclick = () => svg.transition().call(zoom.transform, d3.zoomIdentity);
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(COLORS).map(([cat, color]) => '<div class="legend-item"><span class="legend-dot" style="background:' + color + '"></span>' + cat + '</div>').join('');
  const physicsToggle = document.getElementById('physicsToggle');

  function highlightPath(path) { link.classed('path-edge', false).attr('opacity', 0.5); node.classed('path-start path-end path-node', false).attr('r', d => nodeRadius(d)); if (!path) return; const set = new Set(path); path.forEach((id, i) => { node.filter(d => d.id === id).classed(i === 0 ? 'path-start' : i === path.length - 1 ? 'path-end' : 'path-node', true).attr('r', d => nodeRadius(d) + 3); }); for (let i = 0; i < path.length - 1; i++) { link.filter(d => { const s = typeof d.source === 'object' ? d.source.id : d.source; const t = typeof d.target === 'object' ? d.target.id : d.target; return (s === path[i] && t === path[i+1]) || (s === path[i+1] && t === path[i]); }).classed('path-edge', true).attr('opacity', 1); } }

  function resize() { const w = container.clientWidth, h = container.clientHeight; simulation.force('center', d3.forceCenter(w / 2, h / 2).strength(centerStrength)); simulation.alpha(0.3).restart(); }
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { resize(); updateMinimap(); }, 80);
  });
  return { highlightNode, highlightSearch, centerOn, resize };
})();

renderStats();
renderTimeline();
renderEntries();

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') { e.target.value = ''; searchQuery = ''; renderEntries(); if (graph.highlightSearch) graph.highlightSearch(); e.target.blur(); } return; }
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'Escape') { selectedEntry = null; renderEntries(); graph.highlightNode(null); switchTab('graph'); }
  if (e.key === '1') switchTab('graph');
  if (e.key === '2') switchTab('stats');
  if (e.key === '3') switchTab('timeline');
  if (e.key === '4') switchTab('detail');
});
</script>
</body>
