7-29","file":"src/mcp/tools.ts","links":["context-generate","mcp-tool-history","context-diff"],"ttl":"","lastAccessed":"2026-07-29T13:07:40.627Z"},{"id":"957ae826","key":"consolidation-algorithm","category":"architecture","content":"Memory consolidation: removes entries with identical content (keeps first). Deterministic, no LLM. Scans all entries, compares content strings, marks duplicates for removal. Useful after mass-import or merge operations.","tags":["consolidation","dedup","deterministic"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/lib/quality.ts","links":["memory-consolidate","memory-compress","duplicate-detection","near-duplicate-detection"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.399Z"},{"id":"1dbcb592","key":"viewer-export-png","category":"architecture","content":"Viewer export PNG: serializes SVG to XML, renders to canvas (2x resolution), downloads as PNG. Uses btoa(unescape(encodeURIComponent(svgData))) for data URL. Background color from CSS variable. Filename: toon-memory-graph.png.","tags":["viewer","export","png","canvas"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","viewer-standalone"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"60a494a9","key":"viewer-theme-toggle","category":"architecture","content":"Viewer theme toggle: button swaps CSS variables between dark and light via .light class. localStorage persistence. Affects all elements: sidebar, graph, detail panel, tooltips. No flash on load (inline check).","tags":["viewer","theme","dark-light","localStorage"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","viewer-standalone","graph-tooltip-content"],"ttl":"","lastAccessed":"2026-07-29T13:06:54.236Z"},{"id":"09dd29e1","key":"graph-node-radius","category":"architecture","content":"Graph node radius: variable by access count. Formula: 4 + min(accessCount * 0.8, 8). Range: 4px (never accessed) to 12px (heavily accessed). Provides visual cue for entry importance. Used in collision force radius.","tags":["graph","node","radius","importance"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-edge-thickness","graph-physics-controls"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"ee3f8771","key":"graph-recall-algorithm","category":"architecture","content":"Graph recall: memory_recall with mode='graph' expands related-entry subgraph. 1-hop: direct neighbors only. 2-hop: neighbors of neighbors. More precise than flat mode, fewer tokens. Useful for deep context gathering.","tags":["graph","recall","subgraph","algorithm"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-recall","auto-linking-depth","smart-recall"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.399Z"},{"id":"ed3f8946","key":"capture-system","category":"architecture","content":"Capture system: hooks intercept MCP tool calls and write observations to observations.toon. Opt-in via capture enable. Observations are raw tool inputs/outputs. memory_captured shows captured observations. Promote to memory with memory_remember.","tags":["capture","hooks","observations","opt-in"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/capture.ts","links":["capture-observations","memory-captured","cli-commands"],"ttl":"","lastAccessed":""},{"id":"63f4a62a","key":"export-gist-format","category":"architecture","content":"GitHub Gist export: memory_export_gist creates private Gist with data.toon content. Uses Node.js built-in fetch() (no axios/node-fetch). GITHUB_TOKEN env var required. Format: single file 'memory.toon' with JSONL content.","tags":["export","gist","github","cloud-sync"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["export-import","memory-export-gist","memory-import-gist"],"ttl":"","lastAccessed":""},{"id":"8039e297","key":"auto-linking-depth","category":"architecture","content":"Auto-linking depth: findRelatedEntries() in graph.ts does 2-hop expansion from query matches. First hop: BM25 matches. Second hop: entries connected to matches via edges. Combined with centrality ranking. Result capped at limit parameter.","tags":["graph","auto-linking","bm25","depth"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["auto-linking","graph-bm25-ranking","graph-centrality-algorithm"],"ttl":"","lastAccessed":""},{"id":"8a3aa0b1","key":"quality-score-formula","category":"architecture","content":"Quality score formula: quality = (0.3 * freshness + 0.3 * accessScore + 0.2 * tagScore + 0.2 * linkScore) * stalenessDecay. freshness: 1/(1+age/30). accessScore: min(accessCount/5, 1). tagScore: min(tags.length/3, 1). linkScore: min(links.length/3, 1). Final range: 0-1.","tags":["quality","formula","scoring","algorithm"],"quality":0.97,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["quality-scoring","quality-staleness-decay","quality-access-tracking"],"ttl":"","lastAccessed":""},{"id":"1bfdf13d","key":"graph-tooltip-content","category":"architecture","content":"Graph tooltips: category (colored), key, content preview (truncated to 100 chars), quality score, access count. Positioned at mouse + 12px offset. Dark background, white text. Hidden on mouseout. Styled with CSS class 'tooltip'.","tags":["graph","tooltip","ux","hover"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-glow-effect","graph-edge-thickness"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"3efdea6c","key":"graph-transitions","category":"architecture","content":"CSS transitions on graph elements: node-circle (r, opacity, filter 0.2s ease), node-label (opacity 0.2s), link (stroke-opacity, stroke, stroke-width 0.2s). Smooth highlight/unhighlight without D3 transition calls. Pure CSS, no JS overhead.","tags":["graph","animation","transitions","css"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-glow-effect","graph-physics-controls"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"b44751cf","key":"graph-glow-effect","category":"architecture","content":"SVG glow filter for selected nodes: feGaussianBlur (stdDeviation 4) + feMerge (blur + SourceGraphic). Applied via CSS class 'glow'. Also adds brightness(1.4). Creates distinct visual highlight without extra DOM elements.","tags":["graph","visual","glow","svg","effect"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-edge-thickness","graph-minimap-render"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"51e94ad1","key":"graph-physics-controls","category":"architecture","content":"Graph physics controls: toggle button opens panel with sliders. Charge: -300 to 0 (default -120), repulsion strength. Distance: 20-200 (default 70), edge target length. Center: 0-1 (default 0.05), center gravity. Changes apply instantly with alpha(0.5) restart.","tags":["graph","physics","interactive","controls"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["graph-force-layout","graph-minimap-render","d3-graph-viewer"],"ttl":"","lastAccessed":"2026-07-29T13:06:54.236Z"},{"id":"756329e7","key":"graph-minimap-render","category":"architecture","content":"Graph minimap: bottom-left corner, 150x100px. Real-time rendering via D3. Scale factor 0.1x. Shows nodes as colored dots, edges as thin lines, viewport rectangle (purple). Updates on every simulation tick. No separate canvas, uses SVG.","tags":["graph","minimap","visualization","real-time"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-force-layout","graph-physics-controls"],"ttl":"","lastAccessed":"2026-07-29T13:08:43.877Z"},{"id":"22a486ae","key":"test-no-external","category":"architecture","content":"Tests require no external services: no database, no network, no API calls. All tests run locally with temp files. 278 tests in 16 files. CI runs on Node 20/22 matrix.","tags":["testing","local","self-contained","ci"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"","links":["test-temp-dirs","test-auto-cleanup","vitest-testing"],"ttl":"","lastAccessed":""},{"id":"63af428c","key":"test-auto-cleanup","category":"architecture","content":"Tests auto-cleanup: temp directories removed after each test. process.on('exit') cleanup handler. No manual rm -rf needed. Ensures clean state for next test run.","tags":["testing","cleanup","automatic"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"tests/cli.test.ts","links":["test-temp-dirs","vitest-testing"],"ttl":"","lastAccessed":""},{"id":"80713f85","key":"test-temp-dirs","category":"architecture","content":"Tests use temp directories: each test creates isolated .toon-memory/ in system temp. No shared state between tests. Parallel-safe. Vitest config in vitest.config.ts with globals: true.","tags":["testing","temp","isolation","vitest"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"tests/cli.test.ts","links":["test-auto-cleanup","vitest-testing"],"ttl":"","lastAccessed":""},{"id":"caafabb1","key":"security-env-keys","category":"architecture","content":"Encryption keys via environment variables only. TOON_MEMORY_KEY for AES-256-GCM memory encryption. GITHUB_TOKEN for Gist export/import. Never stored in memory, never logged. Process-level isolation.","tags":["security","encryption","env-variables"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"","links":["security-no-secrets","aes256gcm-encrypt","memory-encrypt"],"ttl":"","lastAccessed":""},{"id":"cef00f73","key":"security-no-secrets","category":"architecture","content":"Security rule: never log or commit secrets, API keys, or encryption keys. Memory entries marked 'private' are excluded from context injection. TOON_MEMORY_KEY never written to disk. No hardcoded secrets anywhere in codebase.","tags":["security","secrets","best-practice"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"","links":["security-env-keys","aes256gcm-encrypt"],"ttl":"","lastAccessed":""},{"id":"3db70c0c","key":"docs-i18n-keys","category":"knowledge","content":"i18n key patterns in src/i18n.ts: each language has 'whatNew' array with version cards. Keys: home.*, nav.*, docs.*, ui.*. English is default/fallback. 8 languages: en, es, zh, ja, ko, de, pt-br, fr.","tags":["docs","i18n","localization","keys"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"docs/src/i18n.ts","links":["docs-astro","i18n-8-languages","docs-content-structure"],"ttl":"","lastAccessed":""},{"id":"eade0895","key":"docs-content-structure","category":"knowledge","content":"Docs site structure: src/content/docs/ has subdirectories per language (en/, es/, zh/, ja/, ko/, de/, pt-br/, fr/). Each has .mdx files. Astro Content Collections schema in src/content.config.ts. Sidebar auto-generated from frontmatter order.","tags":["docs","astro","structure","i18n"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"docs/src/content.config.ts","links":["docs-astro","i18n-8-languages","docs-i18n-keys"],"ttl":"","lastAccessed":""},{"id":"eb24cee7","key":"session-conflict-detection","category":"architecture","content":"Session conflict detection: memory_sessions tool shows files touched by 2+ sessions (soft conflicts). Prevents overwriting parallel session work. Uses git branch name + last-seen timestamp per session.","tags":["session","conflict","parallel","multi-agent"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["memory-sessions","session-auto-promotion","session-merge"],"ttl":"","lastAccessed":""},{"id":"a2e387ba","key":"session-auto-promotion","category":"architecture","content":"Session auto-promotion: observations accessed 3+ times in a session are automatically promoted to permanent memory entries. Tracked via session access map. Happens on session end or periodically. Prevents loss of frequently-used transient knowledge.","tags":["session","promotion","auto","transient"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/session-store.ts","links":["memory-sessions","session-conflict-detection","capture-observations"],"ttl":"","lastAccessed":""},{"id":"b2562d6d","key":"quality-access-tracking","category":"architecture","content":"Access tracking: each entry has accessCount (incremented on recall) and lastAccessed (timestamp). bumpAccessed() in scoring.ts updates both. High access count = high quality. Combined with staleness decay for final quality score.","tags":["quality","access","tracking","scoring"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/scoring.ts","links":["quality-scoring","quality-staleness-decay","smart-recall"],"ttl":"","lastAccessed":""},{"id":"c3af601a","key":"quality-staleness-decay","category":"architecture","content":"Quality staleness decay: entries older than 30 days lose quality exponentially. Decay factor: e^(-age/30). Fresh entry: quality 1.0. After 30 days: ~0.37. After 60 days: ~0.14. Combined with access count: frequently accessed old entries maintain higher quality.","tags":["quality","decay","staleness","algorithm"],"quality":0.98,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["quality-scoring","quality-access-tracking","stale-quality-decay"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.399Z"},{"id":"78d14a4e","key":"graph-edge-thickness","category":"architecture","content":"Edge thickness variable: calculated by shared connections count. Formula: 0.5 + min(sharedCount * 0.3, 3). Nodes with more connections get thicker edges. Range: 0.5px (isolated) to 3.5px (highly connected). Visual cue for graph density.","tags":["graph","visualization","edge-thickness"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-physics-controls","graph-minimap-render"],"ttl":"","lastAccessed":"2026-07-29T13:06:54.236Z"},{"id":"a8b32a33","key":"graph-force-layout","category":"architecture","content":"D3 force simulation parameters: forceLink (distance 70, strength 0.5), forceManyBody (charge -120), forceCenter (width/2, height/2), forceCollide (radius nodeRadius+4). Physics controls in viewer allow adjusting: charge (-300 to 0), distance (20-200), center strength (0-1).","tags":["graph","d3","physics","layout"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","graph-minimap-render","graph-physics-controls"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.060Z"},{"id":"e227e7ee","key":"graph-edge-types","category":"architecture","content":"Graph edges: 'links' (from entry.links field, explicit related entries), 'tags' (shared tags between entries), 'related' (BM25 similarity, auto-generated). Edge direction matters: links are directed, tags/related are bidirectional. Edge count = graph density.","tags":["graph","edges","relationships"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-centrality-algorithm","auto-linking","graph-recall"],"ttl":"","lastAccessed":""},{"id":"e8b728b4","key":"graph-centrality-algorithm","category":"architecture","content":"Graph centrality: computed via betweenness centrality approximation. Nodes with high centrality are most connected/important. Used for quality scoring: high centrality = high recall priority. Algorithm: BFS from each node, count shortest paths through each node.","tags":["graph","centrality","algorithm","quality"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-bm25-ranking","quality-scoring","graph-recall"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.399Z"},{"id":"ca594fe3","key":"cli-init-command","category":"architecture","content":"toon-memory init: Creates .toon-memory/ directory structure (memory/, sessions/, viewer/). Generates empty data.toon. Sets up hooks if --hooks flag. Idempotent: safe to run multiple times.","tags":["cli","init","setup"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/cli/setup.ts","links":["cli-status-command","file-structure","dual-mode"],"ttl":"","lastAccessed":""},{"id":"bcf48a3a","key":"mcp-tool-history","category":"architecture","content":"MCP tool count evolution: v1.0 had 14 tools (remember, recall, forget, sessions, promote, stats, export, import, encrypt, decrypt, primer, archive, merge_sessions, summary). v2.0 added consolidate, smart_recall, graph_path (17). v3.0 added context_*, graph tools (27). v3.1 added context_diff, context_export, context_health (29). v3.2 added context_rebuild, memory_backup, memory_suggest (31).","tags":["mcp","history","tools","versioning"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"","links":["mcp-31-tools","v3.1.0-release","v3.2.0-release"],"ttl":"","lastAccessed":""},{"id":"5779402d","key":"mcp-server-entry","category":"architecture","content":"MCP server entry: src/mcp/server.ts. Creates McpServer with name \"toon-memory\", version from package.json. Calls registerTools(server) from tools.ts. Starts StdioServerTransport. 26 lines total. Server lifecycle: init → register tools → connect transport.","tags":["mcp","server","entry-point"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/server.ts","links":["mcp-tool-registration","mcp-stdio-transport","dual-mode"],"ttl":"","lastAccessed":""},{"id":"b355ad00","key":"mcp-tool-registration","category":"architecture","content":"MCP tools registered in src/mcp/tools.ts via registerTool() helper. Each tool: name, description, inputSchema (JSON Schema), handler function. 31 tools total. Registration order determines tool listing order in MCP.","tags":["mcp","registration","tools"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["mcp-31-tools","mcp-server-entry","mcp-stdio-transport"],"ttl":"","lastAccessed":""},{"id":"2a9c7182","key":"viewer-inline-bundle","category":"architecture","content":"Graph viewer HTML is fully self-contained: D3.js v7 loaded from CDN, all CSS/JS inlined in single HTML file. Generated by src/viewer/html.ts reading memory entries + building graph data. Served by Node http module on localhost:3000.","tags":["viewer","architecture","self-contained"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["d3-graph-viewer","viewer-standalone","viewer-serve-mode"],"ttl":"","lastAccessed":"2026-07-29T13:05:34.433Z"},{"id":"36e1a6e4","key":"esbuild-bundle","category":"architecture","content":"Build system: esbuild with 3 sequential targets. build:bin (2KB, entry point), build:mcp (server.js, bundled with version define), build:cli (4 files: setup.js 95KB, toon-memory.js, capture.js 10KB, session-start.js 7KB). Total ~115KB output. No webpack, no rollup.","tags":["build","esbuild","architecture"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["zero-deps-philosophy","mcp-tool-registration","vitest-testing"],"ttl":"","lastAccessed":""},{"id":"08ea71da","key":"stdio-mcp-transport","category":"architecture","content":"MCP server uses StdioServerTransport (stdin/stdout JSON-RPC). No HTTP, no WebSocket. Agent spawns server as child process, communicates via stdio. Default in MCP SDK. Simple, secure, no port conflicts.","tags":["mcp","transport","stdio","architecture"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/mcp/server.ts","links":["mcp-tool-registration","mcp-server-entry","mcp-31-tools"],"ttl":"","lastAccessed":""},{"id":"d80088d7","key":"zero-deps-philosophy","category":"architecture","content":"toon-memory has zero npm runtime dependencies. All functionality (crypto, HTTP, parsing, graph algorithms) implemented with Node.js built-ins. Only devDependencies: esbuild, vitest, typescript. Design goal: install once, run everywhere.","tags":["architecture","philosophy","zero-deps"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["jsonl-format","esbuild-bundle","viewer-inline-bundle"],"ttl":"","lastAccessed":""},{"id":"4134f830","key":"jsonl-format","category":"architecture","content":"Memory persistence uses plain JSONL (one JSON object per line) in .toon-memory/memory/data.toon. Chosen over SQLite for portability: zero native dependencies, works anywhere Node.js runs, trivially diffable in git.","tags":["persistence","format","jsonl","portability"],"quality":1,"accessCount":1,"date":"2026-07-28","file":".toon-memory/memory/data.toon","links":["zero-deps-philosophy","file-structure","dual-mode"],"ttl":"","lastAccessed":""},{"id":"5675e5e3","key":"session-merge","category":"pattern","content":"Multi-session merging: consolida observaciones de múltiples sesiones/branches. Dedup y suggest para promover a entries. Evita conflictos entre sesiones paralelas.","tags":["session","merge","multi-agent"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/cli/setup.ts","links":["capture-hooks","duplicate-detection","15-agents"],"ttl":"","lastAccessed":""},{"id":"18e487c3","key":"aes256gcm-encrypt","category":"decision","content":"Encriptación AES-256-GCM para memory. Key via env var TOON_MEMORY_KEY. Transparente: readMemory/writeMemory aplican encrypt/decrypt automáticamente.","tags":["security","encryption"],"quality":0.8,"accessCount":1,"date":"2026-07-28","file":"src/mcp/crypto.ts","links":["dual-mode","v3.1.0-release"],"ttl":"","lastAccessed":"2026-07-28T12:20:13.208Z"},{"id":"679c3921","key":"stale-quality-decay","category":"bug","content":"Quality scoring penaliza entries con más de 30 días. Decay exponencial: entries viejas pierden prioridad en recall aunque tengan alto access count.","tags":["quality","decay","staleness"],"quality":0.9,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["graph-centrality","bm25-ranking","duplicate-detection"],"ttl":"","lastAccessed":""},{"id":"319ff177","key":"toon-v1-format","category":"knowledge","content":"TOON v1: formato pipe-delimited compacto. Header version: 1, entries array con metadata, campos: id, category, key, content, file, tags, date, ttl, accessed, links, lastAccessed.","tags":["format","toon","storage"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/lib/graph.ts","links":["15-agents","dual-mode","toon-file-format-details","toon-format-decision"],"ttl":"","lastAccessed":"2026-07-29T13:11:26.189Z"},{"id":"aa4d1eb1","key":"cli-commands","category":"architecture","content":"CLI commands: init (setup project), status (show memory stats), stats (detailed stats), export (JSON export), import (JSON import), watch (file watcher for auto-capture), viewer (graph viewer with --serve), upgrade (update to latest), uninstall (remove hooks). All in src/cli/setup.ts.","tags":["cli","commands","interface"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/cli/setup.ts","links":["dual-mode","15-agents","cli-init-command","cli-status-command"],"ttl":"","lastAccessed":"2026-07-29T13:06:36.814Z"},{"id":"38cc5384","key":"dual-mode","category":"architecture","content":"Binario dual: `toon-memory mcp` arranca MCP server (stdio), todo lo demás va a CLI. Entry point en `src/bin/toon-memory.ts` bifurca según primer arg.","tags":["architecture","cli","mcp"],"quality":0.9,"accessCount":1,"date":"2026-07-28","file":"src/bin/toon-memory.ts","links":["15-agents","cli-commands"],"ttl":"","lastAccessed":"2026-07-28T12:20:13.208Z"},{"id":"517015d9","key":"15-agents","category":"knowledge","content":"Soporte para 15 agentes: Claude Code, Cursor, Windsurf, Copilot, Continue, Zed, Cline, Roo Code, Amp, aider, Aget, Antigravity, OpenClaw, OpenCode, KiloCode. Cada uno con su formato de config.","tags":["agents","multi-agent"],"quality":0.9,"accessCount":1,"date":"2026-07-28","file":"src/cli/agents.ts","links":["toon-v1-format","dual-mode"],"ttl":"","lastAccessed":""},{"id":"7801df47","key":"token-savings","category":"knowledge","content":"Auto-loading reduce ~90% de tokens vs dump completo. En vez de inyectar toda la memoria, recall por file path solo lo relevante al contexto actual.","tags":["performance","tokens","optimization"],"quality":0.8,"accessCount":1,"date":"2026-07-28","file":"src/lib/quality.ts","links":["intelligent-auto-loading"],"ttl":"","lastAccessed":""},{"id":"467a8fcf","key":"d3-graph-viewer","category":"architecture","content":"Viewer usa D3.js v7 force-directed graph. Drag nodes, zoom/pan, click para detail. Hover resalta vecinos sin salir del grafo. Tooltips con preview. Export PNG/SVG. Timeline cronológico. Dark/light theme toggle. Stats con bar chart y tag cloud.","tags":["d3","visualization","ui"],"quality":1,"accessCount":1,"date":"2026-07-29","file":"src/viewer/html.ts","links":["viewer-standalone"],"ttl":"","lastAccessed":"2026-07-29T13:10:09.052Z"},{"id":"e9f21fb6","key":"vocab-autotag","category":"knowledge","content":"Auto-tagging: `extractProjectDeps` lee package.json y detecta dependencias del proyecto. Tags se usan para filtrar y categorizar entries automáticamente.","tags":["vocab","autotag","dependencies"],"quality":0.89,"accessCount":1,"date":"2026-07-28","file":"src/lib/vocab.ts","links":["v3.1.0-release"],"ttl":"","lastAccessed":""},{"id":"57636183","key":"capture-hooks","category":"pattern","content":"Hooks de captura: interceptan tool calls y escriben observaciones en `observations.toon`. Opt-in via `toon-memory capture on`. Observaciones se promueven a entries manualmente.","tags":["hooks","capture","observations"],"quality":0.9,"accessCount":1,"date":"2026-07-28","file":"src/cli/capture.ts","links":["session-merge"],"ttl":"","lastAccessed":"2026-07-28T12:20:13.208Z"},{"id":"14643b8d","key":"graph-centrality","category":"knowledge","content":"PageRank para rankear entries por importancia estructural. Entries con más conexiones y de alta calidad obtienen mayor score de centralidad.","tags":["graph","pagerank","centrality"],"quality":0.89,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-path-recall","bm25-ranking"],"ttl":"","lastAccessed":"2026-07-28T04:37:14.805Z"},{"id":"f655475c","key":"bm25-ranking","category":"pattern","content":"BM25 con structural boosting: Functions/Methods +10, Routes +8, Classes/Interfaces +5. Tokens split en camelCase. Noise labels (File, Variable) filtrados.","tags":["search","bm25","ranking"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-centrality","graph-path-recall"],"ttl":"","lastAccessed":""},{"id":"daec3167","key":"graph-path-recall","category":"knowledge","content":"`memory_graph_path` usa BFS shortest path para encontrar la ruta más corta entre dos entries en el knowledge graph. Devuelve nodos intermedios como contexto.","tags":["graph","bfs","recall"],"quality":1,"accessCount":1,"date":"2026-07-28","file":"src/lib/graph.ts","links":["graph-centrality","bm25-ranking"],"ttl":"","lastAccessed":"2026-07-28T12:20:13.208Z"},{"id":"7cdfb15a","key":"jaccard-merge","category":"knowledge","content":"`memory_merge_similar` detecta entries duplicadas usando coeficiente Jaccard >50% sobre tokens del contenido. Merge automático manteniendo la fecha más reciente.","tags":["merge","dedup","jaccard"],"quality":0.9,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["duplicate-detection"],"ttl":"","lastAccessed":""},{"id":"3c316c7d","key":"intelligent-auto-loading","category":"pattern","content":"Auto-loading inteligente: en vez de inyectar toda la memoria al inicio (~90% más de tokens), se hace recall por file path solo cuando se necesita. Implementado via hooks y plugin.","tags":["auto-loading","performance","tokens"],"quality":0.99,"accessCount":1,"date":"2026-07-28","file":"src/cli/opencode-plugin.ts","links":["opencode-plugin","token-savings"],"ttl":"","lastAccessed":""},{"id":"4a77292c","key":"opencode-plugin", c/i18n.ts` contiene todas las traducciones. Auto-detecta idioma del navegador.","tags":["i18n","languages","translation"],"quality":0.85,"accessCount":1,"date":"2026-07-28","file":"docs/src/i18n.ts","links":["docs-astro","v3.2.0-release"],"ttl":"","lastAccessed":""},{"id":"c3d4e5f6","key":"vitest-testing","category":"knowledge","content":" vitest para testing. 278 tests, temp dirs con auto-cleanup. No requiere servicios externos. `npm test` ejecuta vitest run.","tags":["testing","vitest","quality"],"quality":0.9,"accessCount":1,"date":"2026-07-28","file":"tests/","links":["esbuild-build"],"ttl":"","lastAccessed":""},{"id":"d4e5f6a7","key":"esbuild-build","category":"pattern","content":"Build con esbuild, secuencial: bin→mcp→cli. Outputs en `bin/`, `mcp/`, `dist/` (gitignored). `npm run build` ejecuta los 3 en orden.","tags":["build","esbuild","bundler"],"quality":0.9,"accessCount":1,"date":"2026-07-28","file":"package.json","links":["dual-mode","vitest-testing"],"ttl":"","lastAccessed":"2026-07-29T13:13:16.060Z"},{"id":"e5f6a7b8","key":"mcp-31-tools","category":"knowledge","content":"31 MCP tools registrados: memory_remember, memory_recall, memory_forget, memory_stats, memory_diff, memory_suggest, memory_smart_recall, memory_summary, memory_archive, memory_encrypt, memory_decrypt, memory_captured, memory_promote, memory_promote_all, memory_consolidate, memory_sessions, context_brief, context_generate, context_diff, context_focus, context_health, context_export, memory_backup, memory_primer, memory_compress, memory_compress_all, memory_export_gist, memory_import_gist, memory_merge_sessions, memory_merge_similar, memory_graph_path.","tags":["mcp","tools","registration"],"quality":0.9,"accessCount":1,"date":"2026-07-28","file":"src/mcp/tools.ts","links":["mcp-stdio-transport","15-agents"],"ttl":"","lastAccessed":""},{"id":"f6a7b8c9","key":"mcp-stdio-transport","category":"pattern","content":"StdioServerTransport para MCP server. `src/mcp/server.ts` tiene 26 líneas: cre const COLORS = { decision: '#a78bfa', bug: '#ef4444', pattern: '#22c55e', knowledge: '#06b6d4', architecture: '#f59e0b' };

let selectedEntry = null;
let activeFilter = null;
let searchQuery = '';

// Init theme from localStorage
const savedTheme = localStorage.getItem('toon-viewer-theme') || 'dark';
if (savedTheme === 'light') document.documentElement.classList.add('light');

// Tooltip
const tooltip = document.getElementById('tooltip');
function showTooltip(e, d) {
  tooltip.innerHTML =
    '<div class="tt-cat" style="color:' + (COLORS[d.category] || 'var(--muted)') + '">' + d.category + '</div>' +
    '<div class="tt-key">' + escHtml(d.id) + '</div>' +
    '<div class="tt-content">' + escHtml(d.content) + '</div>' +
    '<div class="tt-score">Quality: ' + (d.quality || 0).toFixed(2) + ' | Access: ' + (d.accessCount || 0) + '</div>';
  tooltip.style.display = 'block';
  positionTooltip(e);
}
function positionTooltip(e) {
  const x = e.clientX + 12, y = e.clientY + 12;
  const rect = tooltip.getBoundingClientRect();
  tooltip.style.left = (x + rect.width > window.innerWidth ? e.clientX - rect.width - 8 : x) + 'px';
  tooltip.style.top = (y + rect.height > window.innerHeight ? e.clientY - rect.height - 8 : y) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }
document.addEventListener('mousemove', (e) => { if (tooltip.style.display === 'block') positionTooltip(e); });

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'graph') setTimeout(() => graph.resize(), 50);
  });
});
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="' + name + '"]').classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// Filters
const filterContainer = document.getElementById('filters');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active'; allBtn.textContent = 'All';
allBtn.onclick = () => setFilter(null);
filterContainer.appendChild(allBtn);
Object.keys(DATA.categories).sort().forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn'; btn.textContent = cat;
  btn.dataset.cat = cat; btn.onclick = () => setFilter(cat);
  filterContainer.appendChild(btn);
});
function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', cat === null ? !b.dataset.cat : b.dataset.cat === cat));
  renderEntries();
  if (graph.highlightSearch) graph.highlightSearch();
}

// Search
document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase();
  renderEntries();
  if (graph.highlightSearch) graph.highlightSearch();
  if (searchQuery && graph.centerOn) {
    const first = DATA.nodes.find(n => n.id.toLowerCase().includes(searchQuery) || n.content.toLowerCase().includes(searchQuery) || n.tags.some(t => t.toLowerCase().includes(searchQuery)));
    if (first) graph.centerOn(first.id);
  }
});

// Entries List
function renderEntries() {
  const q = searchQuery;
  const list = document.getElementById('entriesList');
  list.innerHTML = '';
  DATA.nodes.filter(e => !activeFilter || e.category === activeFilter)
    .filter(e => !q || e.id.toLowerCase().includes(q) || e.content.toLowerCase().includes(q) || e.tags.some(t => t.toLowerCase().includes(q)))
    .forEach(e => {
      const div = document.createElement('div');
      div.className = 'entry-item' + (selectedEntry && selectedEntry.id === e.id ? ' selected' : '');
      div.innerHTML = '<div class="entry-cat ' + e.category + '">' + e.category + '</div><div class="entry-key">' + escHtml(e.id) + '</div><div class="entry-preview">' + escHtml(e.content) + '</div>' + (e.tags.length ? '<div class="entry-tags">' + e.tags.map(t => '<span class="entry-tag">' + escHtml(t) + '</span>').join('') + '</div>' : '');
      div.onclick = () => selectEntry(e);
      list.appendChild(div);
    });
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Entry Selection
function selectEntry(entry) {
  selectedEntry = entry; renderEntries(); showDetail(entry);
  graph.highlightNode(entry.id); graph.centerOn(entry.id); switchTab('detail');
}
function showDetail(e) {
  const panel = document.getElementById('detailPanel');
  const linkedNodes = DATA.edges.filter(ed => (typeof ed.source === 'object' ? ed.source.id : ed.source) === e.id || (typeof ed.target === 'object' ? ed.target.id : ed.target) === e.id)
    .map(ed => (typeof ed.source === 'object' ? ed.source.id : ed.source) === e.id ? (typeof ed.target === 'object' ? ed.target.id : ed.target) : (typeof ed.source === 'object' ? ed.source.id : ed.source));
  panel.innerHTML =
    '<div class="detail-cat" style="color:' + (COLORS[e.category] || 'var(--muted)') + '">' + e.category + '</div><h2>' + escHtml(e.id) + '</h2>' +
    '<div class="detail-field"><label>Content</label><span class="value mono">' + escHtml(e.content) + '</span></div>' +
    (e.file ? '<div class="detail-field"><label>File</label><span class="value mono" style="color:var(--brand)">' + escHtml(e.file) + '</span></div>' : '') +
    (e.date ? '<div class="detail-field"><label>Date</label><span class="value">' + e.date + '</span></div>' : '') +
    '<div class="detail-field"><label>Quality</label><span class="value" style="color:var(--brand);font-weight:700;font-size:1.1rem">' + (e.quality || 0).toFixed(3) + '</span></div>' +
    '<div class="detail-field"><label>Access Count</label><span class="value">' + (e.accessCount || 0) + '</span></div>' +
    (e.tags.length ? '<div class="detail-field"><label>Tags</label><div class="entry-tags">' + e.tags.map(t => '<span class="entry-tag">' + escHtml(t) + '</span>').join('') + '</div></div>' : '') +
    (linkedNodes.length ? '<div class="detail-field"><label>Links (' + linkedNodes.length + ')</label><div class="detail-links">' + linkedNodes.map(k => '<span class="detail-link" onclick="selectEntryById(\'' + k + '\')">' + escHtml(k) + '</span>').join('') + '</div></div>' : '');
}
window.selectEntryById = function(id) { const e = DATA.nodes.find(n => n.id === id); if (e) selectEntry(e); };

// Stats
function renderStats() {
  const grid = document.getElementById('statsGrid');
  const catEntries = Object.entries(DATA.categories).sort((a,b) => b[1] - a[1]);
  const maxCat = Math.max(...catEntries.map(c => c[1]));
  const topTags = Object.entries(DATA.tagCounts).sort((a,b) => b[1] - a[1]).slice(0, 20);
  const maxTag = Math.max(...topTags.map(t => t[1]));
  const avgQuality = DATA.nodes.reduce((s, n) => s + (n.quality || 0), 0) / DATA.nodes.length;
  grid.innerHTML =
    '<div class="stat-card"><h3>Total Entries</h3><div class="stat-big">' + DATA.totalEntries + '</div></div>' +
    '<div class="stat-card"><h3>Graph Edges</h3><div class="stat-big">' + DATA.edges.length + '</div></div>' +
    '<div class="stat-card"><h3>Avg Quality</h3><div class="stat-big">' + avgQuality.toFixed(2) + '</div></div>' +
    '<div class="stat-card"><h3>Categories</h3><div class="bar-chart">' + catEntries.map(([cat, count]) =>
      '<div class="bar-row"><span class="bar-label">' + cat + '</span><div class="bar-track"><div class="bar-fill" style="width:' + (count/maxCat*100) + '%;background:' + (COLORS[cat] || 'var(--brand)') + '"></div></div><span class="bar-value">' + count + '</span></div>').join('') +
    '</div></div>' +
    '<div class="stat-card"><h3>Top Tags</h3><div class="tag-cloud">' + topTags.map(([tag, count]) => '<span class="tag-pill">' + escHtml(tag) + ' <small>(' + count + ')</small></span>').join('') + '</div></div>';
}
function renderTimeline() {

  const grouped = {};
  sorted.forEach(e => { const d = e.date || 'unknown'; if (!grouped[d]) grouped[d] = []; grouped[d].push(e); });
  let html = '<div class="timeline-header">Timeline (' + DATA.totalEntries + ' entries)</div><div class="timeline-track"><div class="timeline-line"></div>';
  for (const [date, entries] of Object.entries(grouped)) {
    for (const e of entries) {
      html += '<div class="timeline-entry" onclick="selectEntryById(\'' + e.id + '\')" style="border-left:3px solid ' + (COLORS[e.category] || 'var(--border)') + '"><div class="tl-date">' + escHtml(date) + '</div><div class="tl-cat" style="color:' + (COLORS[e.category] || 'var(--muted)') + '">' + e.category + '</div><div class="tl-key">' + escHtml(e.id) + '</div><div class="tl-content">' + escHtml(e.content.substring(0, 100)) + '</div></div>';
    }
  }
  html += '</div>';
  container.innerHTML = html;
}

// Graph
const graph = (function() {
  const container = document.getElementById('graphContainer');
  const width = container.clientWidth;
  const height = container.clientHeight;
  const svg = d3.select(container).append('svg').attr('width', '100%').attr('height', '100%');
  const defs = svg.append('defs');
  const filter = defs.append('filter').attr('id', 'glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
  filter.append('feGaussianBlur').attr('stdDeviation', '4').attr('result', 'blur');
  filter.append('feMerge').selectAll('feMergeNode').data(['blur', 'SourceGraphic']).join('feMergeNode').attr('in', d => d);
  const g = svg.append('g');
  let currentTransform = d3.zoomIdentity;
  const zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => { g.attr('transform', e.transform); currentTransform = e.transform; });
  svg.call(zoom);
  function nodeRadius(d) { return 4 + Math.min((d.accessCount || 0) * 0.6, 10); }
  const connectionCount = new Map();
  DATA.edges.forEach(e => {
    const s = typeof e.source === 'object' ? e.source.id : e.source;
    const t = typeof e.target === 'object' ? e.target.id : e.target;
    connectionCount.set(s, (connectionCount.get(s) || 0) + 1);
    connectionCount.set(t, (connectionCount.get(t) || 0) + 1);
  });
  function edgeWidth(d) {
    const s = typeof d.source === 'object' ? d.source.id : d.source;
    const t = typeof d.target === 'object' ? d.target.id : d.target;
    return 0.5 + Math.min(Math.min(connectionCount.get(s) || 1, connectionCount.get(t) || 1) * 0.3, 3);
  }
  function getSharedTags(a, b) {
    const na = nodeMap.get(a), nb = nodeMap.get(b);
    if (!na || !nb || !na.tags || !nb.tags) return [];
    return na.tags.filter(t => nb.tags.includes(t));
  }
  let chargeStrength = -120, linkDistance = 70, centerStrength = 0.05;
  const nodeMap = new Map(DATA.nodes.map(n => [n.id, n]));
  const simulation = d3.forceSimulation(DATA.nodes)
    .force('link', d3.forceLink(DATA.edges).id(d => d.id).distance(linkDistance).strength(0.5))
    .force('charge', d3.forceManyBody().strength(chargeStrength))
    .force('center', d3.forceCenter(width / 2, height / 2).strength(centerStrength))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 4));
  const link = g.append('g').selectAll('line').data(DATA.edges).join('line').attr('class', 'link').attr('stroke-width', d => edgeWidth(d)).attr('stroke-linecap', 'round');
  const node = g.append('g').selectAll('circle').data(DATA.nodes).join('circle').attr('class', 'node-circle')
    .attr('r', d => nodeRadius(d)).attr('fill', d => COLORS[d.category] || '#888').attr('stroke', d => COLORS[d.category] || '#888').attr('stroke-width', 1.5).attr('stroke-opacity', 0.6)
    .call(d3.drag().on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; }).on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); }))
    .on('contextmenu', (e, d) => { e.preventDefault(); d.fx = null; d.fy = null; simulation.alpha(0.3).restart(); });
  const label = g.append('g').selectAll('text').data(DATA.nodes).join('text').attr('class', 'node-label')
    .attr('dy', d => -(nodeRadius(d) + 4)).text(d => d.id.length > 18 ? d.id.substring(0, 16) + '..' : d.id);
  link.on('mouseover', (e, d) => {
    const s = typeof d.source === 'object' ? d.source.id : d.source, t = typeof d.target === 'object' ? d.target.id : d.target;
    const shared = getSharedTags(s, t);
    tooltip.innerHTML = '<div class="tt-edge"><span style="color:' + (COLORS[nodeMap.get(s)?.category] || 'var(--muted)') + '">' + escHtml(s) + '</span> → <span style="color:' + (COLORS[nodeMap.get(t)?.category] || 'var(--muted)') + '">' + escHtml(t) + '</span>' + (shared.length ? '<br>Tags: ' + shared.map(tag => '<span class="entry-tag">' + escHtml(tag) + '</span>').join(' ') : '') + '</div>';
    tooltip.style.display = 'block'; positionTooltip(e);
  }).on('mouseout', () => hideTooltip());
  node.on('mouseover', (e, d) => { showTooltip(e, d); highlightNode(d.id); }).on('mouseout', () => { hideTooltip(); if (!selectedEntry) highlightNode(null); else highlightNode(selectedEntry.id); });
  svg.on('click', () => { selectedEntry = null; highlightNode(null); renderEntries(); });
  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('cx', d => d.x).attr('cy', d => d.y); label.attr('x', d => d.x).attr('y', d => d.y);
  });
  function highlightNode(id) {
    const neighbors = new Set();
    if (id) {
      DATA.edges.forEach(e => { const s = typeof e.source === 'object' ? e.source.id : e.source; const t = typeof e.target === 'object' ? e.target.id : e.target; if (s === id) neighbors.add(t); if (t === id) neighbors.add(s); });
      neighbors.add(id);
    }
    node.attr('r', d => id ? (d.id === id ? nodeRadius(d) + 4 : neighbors.has(d.id) ? nodeRadius(d) + 1 : 2) : nodeRadius(d))
      .attr('opacity', d => id ? (neighbors.has(d.id) ? 1 : 0.12) : 1).classed('glow', d => id && d.id === id);
    link.classed('highlighted', d => id && ((typeof d.source === 'object' ? d.source.id : d.source) === id || (typeof d.target === 'object' ? d.target.id : d.target) === id));
    link.attr('opacity', d => id ? (((typeof d.source === 'object' ? d.source.id : d.source) === id || (typeof d.target === 'object' ? d.target.id : d.target) === id) ? 1 : 0.04) : 0.5);
    label.attr('opacity', d => id ? (neighbors.has(d.id) ? 1 : 0.08) : 1);
  }
  function highlightSearch() {
    if (!searchQuery && !activeFilter) { highlightNode(null); return; }
    const q = searchQuery;
    const matches = new Set();
    DATA.nodes.forEach(n => { const match = (!q || n.id.toLowerCase().includes(q) || n.content.toLowerCase().includes(q) || n.tags.some(t => t.toLowerCase().includes(q))); const catMatch = !activeFilter || n.category === activeFilter; if (match && catMatch) matches.add(n.id); });
    node.attr('r', d => matches.has(d.id) ? nodeRadius(d) + 3 : 2).attr('opacity', d => matches.has(d.id) ? 1 : 0.06).classed('glow search-match', d => matches.has(d.id));
    label.attr('opacity', d => matches.has(d.id) ? 1 : 0.03); link.attr('opacity', 0.03);
  }
  document.getElementById('zoomIn').onclick = () => svg.transition().call(zoom.scaleBy, 1.5);
  document.getElementById('zoomOut').onclick = () => svg.transition().call(zoom.scaleBy, 0.67);
  document.getElementById('zoomReset').onclick = () => svg.transition().call(zoom.transform, d3.zoomIdentity);
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(COLORS).map(([cat, color]) => '<div class="legend-item"><span class="legend-dot" style="background:' + color + '"></span>' + cat + '</div>').join('');
  const physicsToggle = document.getElementById('physicsToggle');
  const physicsPanel = document.getElementById('physicsPanel');
  physicsToggle.onclick = () => { physicsPanel.style.display = physicsPanel.style.display === 'none' ? 'block' : 'none'; };
  function updatePhysics() { simulation.force('charge').strength(chargeStrength); simulation.force('link').distance(linkDistance); simulation.force('center').strength(centerStrength); simulation.alpha(0.5).restart(); }
  document.getElementById('chargeSlider').oninput = (e) => { chargeStrength = parseInt(e.target.value); document.getElementById('chargeVal').textContent = chargeStrength; updatePhysics(); };
  document.getElementById('distSlider').oninput = (e) => { linkDistance = parseInt(e.target.value); document.getElementById('distVal').textContent = linkDistance; updatePhysics(); };
  document.getElementById('centerSlider').oninput = (e) => { centerStrength = parseFloat(e.target.value); document.getElementById('centerVal').textContent = centerStrength; updatePhysics(); };
  function centerOn(id) { const n = DATA.nodes.find(d => d.id === id); if (!n || n.x == null) return; const w = container.clientWidth, h = container.clientHeight; svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(w / 2 - n.x * currentTransform.k, h / 2 - n.y * currentTransform.k).scale(currentTransform.k)); }
  let pathStart = null, pathActive = false;
  function findPath(a, b) { const adj = new Map(); DATA.edges.forEach(e => { const s = typeof e.source === 'object' ? e.source.id : e.source; const t = typeof e.target === 'object' ? e.target.id : e.target; if (!adj.has(s)) adj.set(s, []); if (!adj.has(t)) adj.set(t, []); adj.get(s).push(t); adj.get(t).push(s); }); const visited = new Set([a]), parent = new Map([[a, null]]); const queue = [a]; while (queue.length) { const cur = queue.shift(); if (cur === b) break; for (const nb of (adj.get(cur) || [])) { if (!visited.has(nb)) { visited.add(nb); parent.set(nb, cur); queue.push(nb); } } } if (!parent.has(b)) return null; const path = []; let cur = b; while (cur !== null) { path.unshift(cur); cur = parent.get(cur); } return path; }
  function highlightPath(path) { link.classed('path-edge', false).attr('opacity', 0.5); node.classed('path-start path-end path-node', false).attr('r', d => nodeRadius(d)); if (!path) return; const set = new Set(path); path.forEach((id, i) => { node.filter(d => d.id === id).classed(i === 0 ? 'path-start' : i === path.length - 1 ? 'path-end' : 'path-node', true).attr('r', d => nodeRadius(d) + 3); }); for (let i = 0; i < path.length - 1; i++) { link.filter(d => { const s = typeof d.source === 'object' ? d.source.id : d.source; const t = typeof d.target === 'object' ? d.target.id : d.target; return (s === path[i] && t === path[i+1]) || (s === path[i+1] && t === path[i]); }).classed('path-edge', true).attr('opacity', 1); } }
  document.getElementById('pathToggle').onclick = () => { pathActive = !pathActive; document.getElementById('pathToggle').classList.toggle('active', pathActive); if (!pathActive) { pathStart = null; highlightPath(null); } document.getElementById('pathInfo').style.display = 'none'; };
  let clickTimer = null;
  node.on('click', (e, d) => {
    e.stopPropagation();
    if (pathActive) {
      if (!pathStart) { pathStart = d.id; document.getElementById('pathInfo').textContent = 'Click target node'; document.getElementById('pathInfo').style.display = 'block'; highlightPath(null); node.classed('path-start', false); node.filter(n => n.id === d.id).classed('path-start', true); }
      else { const path = findPath(pathStart, d.id); if (path) { document.getElementById('pathInfo').innerHTML = 'Path: ' + path.join(' → '); document.getElementById('pathInfo').style.display = 'block'; highlightPath(path); } else { document.getElementById('pathInfo').textContent = 'No path found'; document.getElementById('pathInfo').style.display = 'block'; } pathStart = null; pathActive = false; document.getElementById('pathToggle').classList.remove('active'); }
      return;
    }
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; return; }
    clickTimer = setTimeout(() => { clickTimer = null; }, 220);
  });
  node.on('dblclick', (e, d) => { e.stopPropagation(); if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; } selectEntry(d); hideTooltip(); });
  function resize() { const w = container.clientWidth, h = container.clientHeight; simulation.force('center', d3.forceCenter(w / 2, h / 2).strength(centerStrength)); simulation.alpha(0.3).restart(); }
  return { highlightNode, highlightSearch, centerOn, resize };
})();

renderStats();
renderTimeline();
renderEntries();

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') { e.target.value = ''; searchQuery = ''; renderEntries(); if (graph.highlightSearch) graph.highlightSearch(); e.target.blur(); } return; }
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'Escape') { selectedEntry = null; renderEntries(); graph.highlightNode(null); switchTab('graph'); }
  if (e.key === '1') switchTab('graph');
  if (e.key === '2') switchTab('stats');
  if (e.key === '3') switchTab('timeline');
  if (e.key === '4') switchTab('detail');
});
</script>
